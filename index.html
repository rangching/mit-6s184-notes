這堂把三堂的份量壓成一堂；跟不上是正常的，回頭對照前導片的小節。<\/p>\n<h3>五個陷阱<\/h3>\n<ol><li><strong>Q_t(y|x) 是從 x 跳到 y<\/strong>（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=328s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"328\">05:28<\/a> 口頭說反）：以講義式 (86) 為準，一欄總和為 0。<\/li><li><strong>雜訊的機率是 1−κ_t<\/strong>（投影片 p.15 寫成 κ_t；<a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=3572s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"3572\">59:32<\/a> 口頭更正）。<\/li><li><strong>p.25 的 \"Marginal Vector Field\" 是筆誤<\/strong>（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=3617s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"3617\">60:17<\/a>），應為邊際速率矩陣。<\/li><li><strong>遮罩擴散的方向<\/strong>：本課 t=0 全遮、t=1 全解開；讀外部論文先查 t。<\/li><li><strong>這堂的 z 是資料<\/strong>：Lecture 04 資料寫 x，本堂回到 z＝資料、x＝目前序列。<\/li><\/ol>\n<p>另外兩個：均勻雜訊在 t=0 每格有 1/V 剛好對；<a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=648s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"648\">10:48<\/a> 兩狀態例子口頭只說單向，講義 Example 34 是雙向都是 λ。<\/p>","practice":{"title":"練習：速率與一小步","html":"<ol><li>兩個狀態 a、b，互相以速率 2 跳。寫出 2×2 速率矩陣（欄＝出發點），並檢查每欄加起來是多少。<\/li><li>同一個例子，用一步 Euler、步長 h=0.1，從 a 出發：留在 a 和跳到 b 的機率各是多少？h=0.75 時呢？<\/li><li>詞彙表有 6 個字母、序列 3 格。所有可能的序列有幾種？分解式的網路要輸出幾個數？<\/li><\/ol>"},"answers":["速率矩陣。它的一欄是「從同一個狀態出發，跳到每個狀態的速率」：非對角 ≥ 0，對角是負的離開速率總和，所以一欄加起來是 0。","每格各自獨立抽，格子之間的搭配丟掉，拼出來的常常不是字。前導片的簡化模型（8 個三字母字、精確後驗）一步只有 41.8% 是字，2 步 65.9%、16 步 95.2%、64 步 98.8%。","每個位置的分類：看著目前的序列 x，猜每一格最後是哪個字，用交叉熵訓練。flow matching 是迴歸，離散版變成分類。"],"answerExtra":"<p><strong>練習答案<\/strong>：1. 欄 a 是（−2, 2），欄 b 是（2, −2）；每欄和 0。2. h=0.1：留在 a 是 1−0.1×2＝0.8，跳到 b 是 0.2；h=0.75：留下 1−1.5＝−0.5，是負機率，步長太大（h×離開速率要 ≤ 1）。3. 6³＝216 種；網路輸出 3×6＝18 個數。<\/p>\n<p>片中兩狀態、三種資料、8 個字都是簡化模型；網路是查表分類器、不吃 t，不是 Transformer；步數實驗用精確後驗。練習 2 的 −0.5 與片中小節 3 的計算一致（check A4）；216 與 check E2 的「8/216 是字」一致。<\/p>","extra":[]},"learn":{"unit":"07","notes":{"keypoints":["字沒有方向，不能挪一點點，只能整個跳成另一個字；所以 ODE 換成連續時間馬可夫鏈（CTMC），向量場換成速率矩陣 <math aria-label=\"Q_t(y|x)\"><mrow><msub><mi>Q<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>。","速率矩陣的一欄是出發點 x：非對角的速率不能是負的，對角是負的離開速率總和，所以每欄加起來是 0。","抽樣走一小步：跳到 y 的機率約是 h 乘速率，留下的是 1 減 h 乘離開速率；步長要讓 h×離開速率 ≤ 1，否則出現負機率。","分解式只准一次改一格，網路輸出從 <math aria-label=\"V^d\"><mrow><msup><mi>V<\/mi><mi>d<\/mi><\/msup><\/mrow><\/math> 縮成 <math aria-label=\"d×V\"><mrow><mi>d<\/mi><mo>×<\/mo><mi>V<\/mi><\/mrow><\/math>；分解式混合路徑讓每格以機率 <math aria-label=\"κ_t\"><mrow><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 留下資料、<math aria-label=\"1−κ_t\"><mrow><mn>1<\/mn><mo>−<\/mo><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 換成雜訊（均勻亂字或 [MASK]）。","邊際速率是條件速率用後驗加權的平均，唯一的未知數是 <math aria-label=\"p_{1|t}(z_j=v|x)\"><mrow><msub><mi>p<\/mi><mrow><mn>1<\/mn><mo stretchy=\"false\">|<\/mo><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>z<\/mi><mi>j<\/mi><\/msub><mo>=<\/mo><mi>v<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>，所以訓練就是每個位置做分類（交叉熵）：flow matching 是迴歸，離散版是分類。","遮罩擴散從 t=0 全遮走到 t=1 全解開；一步全部解開會丟掉格子之間的搭配，步數要夠。"],"formulas":[{"id":"f1","title":"速率矩陣的兩個條件","plain":"從 x 跳到別處的速率不能是負的；同一欄（同一個出發點）加起來是 0","parts":[{"m":"<math aria-label=\"Q_t(y|x)\"><mrow><msub><mi>Q<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"從 x 跳到 y 有多快；x 是出發點，決定是哪一欄"},{"m":"<math aria-label=\"≥ 0\"><mrow><mo>≥<\/mo><mn>0<\/mn><\/mrow><\/math>","say":"y 不等於 x 時（非對角）不能是負的：最少就是不跳"},{"m":"<math aria-label=\",\"><mrow><mo>,<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"Σ_y\"><mrow><msub><mi>Σ<\/mi><mi>y<\/mi><\/msub><\/mrow><\/math>","say":"把同一個出發點跳往所有 y 的速率加起來"},{"m":"<math aria-label=\"Q_t(y|x)\"><mrow><msub><mi>Q<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"包含對角那一格：負的離開速率總和"},{"m":"<math aria-label=\"= 0\"><mrow><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math>","say":"所以一欄加起來剛好是 0"}],"src":{"lec":"L05","t":359,"video":102,"slide":"p.7","note":"p.55 式 (84)–(86)"}},{"id":"f2","title":"跳一小步","plain":"過了一小段時間 h：留在原地的機率，加上 h 乘速率","parts":[{"m":"<math aria-label=\"p_{t+h|t}(y|x)\"><mrow><msub><mi>p<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mi>h<\/mi><mo stretchy=\"false\">|<\/mo><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"過了 h 這麼久，從 x 到 y 的機率（轉移機率）"},{"m":"<math aria-label=\"≈\"><mrow><mi>≈<\/mi><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"δ_x(y)\"><mrow><msub><mi>δ<\/mi><mi>x<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"沒有時間經過時還在原地：y＝x 是 1，否則是 0"},{"m":"<math aria-label=\"+\"><mrow><mo>+<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"h\"><mrow><mi>h<\/mi><\/mrow><\/math>","say":"一小步的時間長度"},{"m":"<math aria-label=\"Q_t(y|x)\"><mrow><msub><mi>Q<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"乘上速率；對角是負的，所以留下的機率是 1 − h×離開速率"}],"src":{"lec":"L05","t":1470,"video":159,"slide":"p.10","note":"p.57 式 (88)、p.58 Algorithm 7"}},{"id":"f3","title":"邊際速率：只剩一個分類器要學","plain":"倍數是自己選的，目前的字也知道；唯一的未知是「這一格最後是哪個字」的機率","parts":[{"m":"<math aria-label=\"Q_t(v,j|x)\"><mrow><msub><mi>Q<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>v<\/mi><mo>,<\/mo><mi>j<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"站在序列 x，第 j 格換成字 v 有多快"},{"m":"<math aria-label=\"=\"><mrow><mo>=<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"(dκ_t/dt)/(1−κ_t)\"><mrow><mo stretchy=\"false\">(<\/mo><mi>d<\/mi><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>d<\/mi><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mo lspace=\"0\" rspace=\"0\">/<\/mo><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"倍數：排程的變化速度（講義寫 κ̇_t）除以剩下的雜訊比例；κ_t=t 時是 1/(1−t)"},{"m":"<math aria-label=\"·\"><mrow><mo lspace=\"0\" rspace=\"0\">·<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"[\"><mrow><mo stretchy=\"false\">[<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"p_{1|t}(z_j=v|x)\"><mrow><msub><mi>p<\/mi><mrow><mn>1<\/mn><mo stretchy=\"false\">|<\/mo><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>z<\/mi><mi>j<\/mi><\/msub><mo>=<\/mo><mi>v<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"唯一的未知：看著 x，第 j 格最後是 v 的機率，就是網路要學的分類器"},{"m":"<math aria-label=\"−\"><mrow><mo>−<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"δ_{x_j}(v)\"><mrow><msub><mi>δ<\/mi><mrow><msub><mi>x<\/mi><mi>j<\/mi><\/msub><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><mi>v<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"v 是不是第 j 格現在的字；是的話減 1，成為負的離開速率"},{"m":"<math aria-label=\"]\"><mrow><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>","say":""}],"src":{"lec":"L05","t":3751,"video":402,"slide":"p.26","note":"p.63 Theorem 38"}}]},"practice":[{"id":"p1","prompt":"a、b 互相以速率 2 跳。欄 a 是（−2, 2），欄 b 是（2, −2）。欄 a 加起來是多少？","answer":0,"tol":1e-09,"calc":"-2 + 2","hint":"對角是負的離開速率總和，所以欄和一定是 0"},{"id":"p2","prompt":"同一個例子，Euler 一步、步長 h=0.1，從 a 出發，留在 a 的機率是多少？","answer":0.8,"tol":0.001,"calc":"1 + 0.1*(-2)","hint":"留下＝1＋h×對角速率；跳到 b 是 0.1×2＝0.2"},{"id":"p3","prompt":"步長改成 h=0.75，留在 a 的「機率」算出來是多少？","answer":-0.5,"tol":0.001,"calc":"1 + 0.75*(-2)","hint":"結果是負的：h×離開速率超過 1，步長太大"},{"id":"p4","prompt":"詞彙表 6 個字母、序列 3 格，所有可能的序列有幾種？","answer":216,"tol":0,"calc":"6**3","hint":"每格 V 種，共 V 的 d 次方"},{"id":"p5","prompt":"同上，分解式的網路要輸出幾個數？","answer":18,"tol":0,"calc":"3*6","hint":"每一格 × 每個字：d×V"}],"quiz":[{"id":"q01","type":"choice","dim":"concept","level":1,"prompt":"原片一開始就說離散資料「沒有 SDE、沒有 ODE」。最主要的原因是什麼？","choices":["字沒有方向：不能從 cat 往 dog 挪一點點，只能整個換成另一個字","序列太長，解 ODE 太慢，所以改用比較快的方法","可以先把字的編號加上高斯雜訊再四捨五入，只是效果比較差","神經網路沒辦法輸出向量，只能輸出機率"],"answer":0,"explain":"向量場要告訴粒子「往哪個方向走多快」，但字和字之間沒有方向與距離。離散空間只能跳，所以要規定的是跳的速率，數學模型是 CTMC。","src":{"lec":"L05","t":118,"video":19,"slide":"p.5"}},{"id":"q02","type":"tf","dim":"concept","level":2,"prompt":"把每個詞元的編號當成實數，直接加上高斯雜訊，再用 SDE 去噪，就是本堂說的離散擴散。","answer":false,"explain":"編號 3.4 的字不存在，編號的大小也沒有意義。本堂的雜訊是把整格換掉：換成均勻亂抽的字，或換成 [MASK]，過程用 CTMC 的跳躍描述。","src":{"lec":"L05","t":342,"video":283,"note":"p.59 Example 35"}},{"id":"q03","type":"choice","dim":"formula","level":2,"prompt":"兩個狀態 a、b，速率矩陣的欄＝出發點，每欄依序寫（跳到 a, 跳到 b）。哪一個是合法的速率矩陣？","choices":["欄 a＝(−3, 3)，欄 b＝(1, −1)","欄 a＝(−3, 3)，欄 b＝(−1, 1)","欄 a＝(0.7, 0.3)，欄 b＝(0.4, 0.6)","欄 a＝(−3, 3)，欄 b＝(1, −2)"],"answer":0,"explain":"非對角（跳走的速率）要 ≥ 0，對角是負的離開速率總和，每欄加起來是 0。第二個的非對角是 −1；第三個每欄加起來是 1，那是轉移機率矩陣，不是速率矩陣；第四個欄 b 加起來是 −1。","src":{"lec":"L05","t":359,"video":115,"slide":"p.7","note":"p.55 式 (85)–(86)"}},{"id":"q04","type":"fill","dim":"formula","level":1,"prompt":"Taylor 展開一小步：<math aria-label=\"p_{t+h|t}(y|x) ≈ δ_x(y) + ＿＿\"><mrow><msub><mi>p<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mi>h<\/mi><mo stretchy=\"false\">|<\/mo><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mi>≈<\/mi><msub><mi>δ<\/mi><mi>x<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mi>＿<\/mi><mi>＿<\/mi><\/mrow><\/math>（用 h 與速率矩陣寫）","accept":["hQ_t(y|x)","h·Q_t(y|x)","h*Q_t(y|x)","hQt(y|x)","hQ(y|x)","h×Q_t(y|x)","hQ_t","hQ"],"explain":"零階項是 δ（沒有時間經過時還在原地），一階項是 h 乘導數，而導數依定義就是速率矩陣。因為 δ 加起來是 1、Q 的欄加起來是 0，整個仍是一個機率分布。","src":{"lec":"L05","t":1588,"video":159,"slide":"p.10","note":"p.57 式 (88)"}},{"id":"q05","type":"numeric","dim":"compute","level":2,"prompt":"三個狀態 a、b、c。從 a 出發：跳到 b 的速率 0.5，跳到 c 的速率 1.5。Euler 一步、步長 h=0.2，從 a 跳到 c 的機率是多少？","answer":0.3,"tol":0.001,"calc":"0.2*1.5","explain":"跳走的機率是 h 乘速率：0.2×1.5＝0.3。速率 1.5 本身不是機率，要乘 h。順便檢查：到 b 是 0.1，留在 a 是 1＋0.2×(−2)＝0.6，三者加起來是 1。","src":{"lec":"L05","t":1747,"video":159,"note":"p.58 Algorithm 7"}},{"id":"q06","type":"numeric","dim":"compute","level":3,"prompt":"同一個三狀態例子（從 a 跳到 b 速率 0.5、跳到 c 速率 1.5）。步長 h 最大可以到多少，從 a 出發留下的機率才不會變成負的？","answer":0.5,"tol":0.001,"calc":"1/(0.5+1.5)","explain":"離開速率總和是 2，留下的機率是 1 − 2h，要 ≥ 0，所以 h ≤ 0.5。前導片的例子速率 2、h=0.75 就算出 −0.5，步長太大。","src":{"video":186,"note":"p.57 式 (88)"}},{"id":"q07","type":"numeric","dim":"compute","level":2,"prompt":"詞彙表 V=5、序列長 d=4。在分解式條件下，一個序列 x 有幾個「鄰居」（只差一格、不含自己）？","answer":16,"tol":0,"calc":"4*(5-1)","explain":"鄰居是漢明距離 1 的序列：選一格（4 種），換成另外 4 個字之一，共 4×4＝16。分解式只允許跳到鄰居，其他速率都是 0，所以網路只要輸出 d×V＝20 個數，而不是 5⁴＝625 列。","src":{"lec":"L05","t":848,"video":224,"slide":"p.9"}},{"id":"q08","type":"numeric","dim":"compute","level":2,"prompt":"排程取 <math aria-label=\"κ_t = t\"><mrow><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mi>t<\/mi><\/mrow><\/math>。條件速率的倍數 <math aria-label=\"(dκ_t/dt)/(1−κ_t)\"><mrow><mo stretchy=\"false\">(<\/mo><mi>d<\/mi><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>d<\/mi><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mo lspace=\"0\" rspace=\"0\">/<\/mo><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 在 t=0.75 時是多少？","answer":4,"tol":0.001,"calc":"1/(1-0.75)","explain":"κ 的變化速度是 1，倍數是 1/(1−t)＝1/0.25＝4。t=0.9 時是 10、0.99 時是 100：越接近終點，還錯著的格子越要趕快跳。","src":{"lec":"L05","t":3490,"video":336,"slide":"p.22"}},{"id":"q09","type":"numeric","dim":"compute","level":3,"prompt":"均勻雜訊、詞彙表 V=4，某時刻 <math aria-label=\"κ_t = 0.5\"><mrow><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mn>0.5<\/mn><\/mrow><\/math>。一格的字剛好等於資料 <math aria-label=\"z_j\"><mrow><msub><mi>z<\/mi><mi>j<\/mi><\/msub><\/mrow><\/math> 的機率是多少？","answer":0.625,"tol":0.001,"calc":"0.5 + (1-0.5)/4","explain":"機率 κ 留下資料，機率 1−κ 換成均勻亂字，而亂字也有 1/V 剛好抽中：κ＋(1−κ)/V＝0.5＋0.125＝0.625。所以 t=0 時也不是全錯，每格有 1/V 剛好對。","src":{"lec":"L05","t":2360,"video":304,"note":"p.59 Example 35"}},{"id":"q10","type":"match","dim":"formula","level":2,"prompt":"把符號和它的意思配對。","pairs":[["<math aria-label=\"Q_t(y|x)\"><mrow><msub><mi>Q<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","從 x 跳到 y 的速率"],["<math aria-label=\"κ_t\"><mrow><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","這一格留下資料字的機率"],["<math aria-label=\"1−κ_t\"><mrow><mn>1<\/mn><mo>−<\/mo><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","這一格換成雜訊的機率"],["<math aria-label=\"p_{1|t}(z_j=v|x)\"><mrow><msub><mi>p<\/mi><mrow><mn>1<\/mn><mo stretchy=\"false\">|<\/mo><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>z<\/mi><mi>j<\/mi><\/msub><mo>=<\/mo><mi>v<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","站在 x，第 j 格最後是 v 的機率"],["<math aria-label=\"δ_{x_j}(v)\"><mrow><msub><mi>δ<\/mi><mrow><msub><mi>x<\/mi><mi>j<\/mi><\/msub><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><mi>v<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","v 就是第 j 格目前的字時為 1"]],"explain":"注意雜訊的機率是 1−κ_t（投影片 p.15 寫成 κ_t 是筆誤，原片 59:32 口頭更正）；p_{1|t} 是後驗，也是網路要學的分類器。","src":{"lec":"L05","t":3751,"slide":"p.26","note":"p.63 Theorem 38"}},{"id":"q11","type":"choice","dim":"formula","level":2,"prompt":"邊際速率 <math aria-label=\"Q_t(v,j|x) = (dκ_t/dt)/(1−κ_t)·[p_{1|t}(z_j=v|x) − δ_{x_j}(v)]\"><mrow><msub><mi>Q<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>v<\/mi><mo>,<\/mo><mi>j<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mi>d<\/mi><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>d<\/mi><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mo lspace=\"0\" rspace=\"0\">/<\/mo><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><mo lspace=\"0\" rspace=\"0\">·<\/mo><mo stretchy=\"false\">[<\/mo><msub><mi>p<\/mi><mrow><mn>1<\/mn><mo stretchy=\"false\">|<\/mo><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>z<\/mi><mi>j<\/mi><\/msub><mo>=<\/mo><mi>v<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><msub><mi>δ<\/mi><mrow><msub><mi>x<\/mi><mi>j<\/mi><\/msub><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><mi>v<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 裡，哪一項是生成時不知道、必須交給網路學的？","choices":["<math aria-label=\"p_{1|t}(z_j=v|x)\"><mrow><msub><mi>p<\/mi><mrow><mn>1<\/mn><mo stretchy=\"false\">|<\/mo><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>z<\/mi><mi>j<\/mi><\/msub><mo>=<\/mo><mi>v<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>：看著 x，第 j 格最後是 v 的機率","<math aria-label=\"κ_t\"><mrow><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 與它的變化速度","<math aria-label=\"δ_{x_j}(v)\"><mrow><msub><mi>δ<\/mi><mrow><msub><mi>x<\/mi><mi>j<\/mi><\/msub><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><mi>v<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>：v 是不是第 j 格目前的字","資料裡各種 z 出現的比例 <math aria-label=\"p_{data}(z)\"><mrow><msub><mi>p<\/mi><mrow><mi>d<\/mi><mi>a<\/mi><mi>t<\/mi><mi>a<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>，直接拿來加權就好"],"answer":0,"explain":"排程是自己選的，x 是目前手上的序列，δ 一看就知道。唯一的未知是後驗，所以學的就是一個分類器。直接用資料比例（先驗）加權會走錯路，前導片的簡化模型總變差達 0.64。","src":{"lec":"L05","t":3939,"video":388,"slide":"p.26","note":"p.63 Theorem 38"}},{"id":"q12","type":"choice","dim":"concept","level":3,"prompt":"遮罩擴散的網路每一格都能同時猜。如果用一步就把全部 [MASK] 解開，主要會出什麼問題？","choices":["每格各自獨立抽，格子之間的搭配丟掉，拼起來常常不是合理的字或句子","步長太大，h×速率超過 1，跳躍機率變成負的","最後一定還留著 [MASK]，因為跳的機率不夠","t=0 時網路什麼都看不到，所以完全不能預測"],"answer":0,"explain":"一步內每格各自從自己的後驗抽，沒有照顧位置之間的牽連。前導片的簡化模型一步只有 41.8% 是字，步數加多才逐步改善。κ_t=t 時一步的跳躍機率剛好是 1，不會負，也不會留下 [MASK]。","src":{"lec":"L05","t":4550,"video":511,"slide":"p.37"}},{"id":"q13","type":"order","dim":"concept","level":2,"prompt":"把離散 flow matching 的一次訓練步驟排好。","items":["從資料抽一筆序列 z","抽時間 t（0 到 1 均勻），算出 κ_t","每一格擲硬幣：機率 κ_t 留下 z_j，否則換成雜訊，得到 x","網路看著 x，對每一格輸出 V 個字的機率","每一格算 −log（猜中 z_j 的機率），加總後更新參數"],"explain":"先照分解式混合路徑把資料弄亂，再讓網路猜每一格原本的字，用交叉熵訓練。這就是講義 Algorithm 8，同一個網路攤到每個位置一起做分類（amortized）。","src":{"lec":"L05","t":4100,"slide":"p.28","note":"p.65 Algorithm 8"}},{"id":"q14","type":"choice","dim":"link","level":2,"prompt":"單元 02 的 flow matching 用均方誤差迴歸到條件向量場。本單元離散版對應的訓練方式是什麼？","choices":["每個位置做分類，用交叉熵讓網路猜中 z_j","對速率矩陣做均方誤差迴歸，逼近條件速率","把字嵌入成向量後做 denoising score matching","讓網路輸出的分布跟均勻分布的 KL 越小越好"],"answer":0,"explain":"對照單元 02：同樣是「條件好算、邊際用平均」的配方，但邊際速率唯一的未知是後驗，所以迴歸變成分類。原片 72:11 說 flow matching 最後是迴歸，離散版最後是分類。","src":{"lec":"L05","t":4331,"video":428}},{"id":"q15","type":"match","dim":"link","level":2,"prompt":"把連續版（單元 01、02）和離散版（本單元）的對應配起來。","pairs":[["向量場 <math aria-label=\"u_t(x)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","速率矩陣 <math aria-label=\"Q_t(y|x)\"><mrow><msub><mi>Q<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>"],["ODE 走一步 <math aria-label=\"X_{t+h} = X_t + h u_t(X_t)\"><mrow><msub><mi>X<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mi>h<\/mi><\/mrow><\/msub><mo>=<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo>+<\/mo><mi>h<\/mi><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","跳一步 <math aria-label=\"δ_x(y) + h Q_t(y|x)\"><mrow><msub><mi>δ<\/mi><mi>x<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mi>h<\/mi><msub><mi>Q<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>"],["連續方程式","Kolmogorov 前向方程式（KFE）"],["高斯條件路徑：搬動機率質量","分解式混合路徑：淡出雜訊、淡入資料"],["均方誤差迴歸","交叉熵分類"]],"explain":"對照單元 01（ODE、Euler 一步）與單元 02（條件／邊際路徑、邊際化、損失）。原片 33:18 把單元 02 那張表逐格換成離散版：路徑、速率、損失都有條件與邊際兩版。","src":{"lec":"L05","t":1998,"slide":"p.14","video":19}},{"id":"q16","type":"choice","dim":"link","level":3,"prompt":"單元 02 的直線路徑，條件向量場是 <math aria-label=\"(z−x)/(1−t)\"><mrow><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo>−<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo lspace=\"0\" rspace=\"0\">/<\/mo><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>；本單元取 <math aria-label=\"κ_t = t\"><mrow><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mi>t<\/mi><\/mrow><\/math> 時，條件速率的倍數是 <math aria-label=\"1/(1−t)\"><mrow><mn>1<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>。兩者共同的直覺是什麼？","choices":["剩下的時間越少越要趕：都除以剩下的時間 1−t，t→1 時變大","兩者都是損失函數的權重，跟抽樣無關","兩者在 t→1 時都趨近 0，所以最後幾步可以不動","1−t 是雜訊的比例，乘上去是為了讓雜訊淡入"],"answer":0,"explain":"對照單元 02：連續版是「剩下的距離除以剩下的時間」，離散版是「還錯著的格子必須在剩下的時間內跳到 z_j」。所以 t 接近 1 時倍數爆增，原片 58:10 說的就是這個。","src":{"lec":"L05","t":3490,"video":336,"slide":"p.22"}},{"id":"q17","type":"choice","dim":"term","level":2,"prompt":"原片說 x 和 z 不是 neighbors，因為 the Hamming distance is bigger than one。這句的意思是？","choices":["兩個序列有超過一格不同；在分解式條件下，它們之間的速率是 0","兩個字在詞彙表裡的編號差超過 1","從 x 跳到 z 的速率大於 1","兩個序列的長度差超過 1"],"answer":0,"explain":"Hamming distance（漢明距離）是兩個序列有幾格不同。分解式只允許一次改一格，也就是只跳到漢明距離 1 的鄰居。","src":{"lec":"L05","t":884,"video":224,"slide":"p.9"}},{"id":"q18","type":"fill","dim":"term","level":1,"prompt":"由左到右、一個字一個字生成的語言模型，英文叫 ＿＿ model；原片自動字幕常誤成 auto aggressive。","accept":["autoregressive","auto-regressive","auto regressive","自迴歸"],"explain":"autoregressive（自迴歸）。遮罩擴散不必由左到右，可以平行、任意順序；代價是 KV caching 不好用、任意順序可能比較難學。" const UNITS = D.units, LECS = D.lectures;
const STATUS = { live: "已上架", soon: "即將上架", making: "製作中", planned: "尚未開始" };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clock = (t) => {
  const s = Math.floor(t), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s % 60).padStart(2, "0");
};
const yt = (id, t) => `https://www.youtube.com/watch?v=${id}${t ? `&t=${Math.floor(t)}s` : ""}`;
const store = (k, v) => {
  try { if (v === undefined) return localStorage.getItem("s184:" + k); localStorage.setItem("s184:" + k, v); } catch (e) { return null; }
};
const ext = '<span class="ext" aria-hidden="true">↗</span>';
// 觀看進度：只記在這台瀏覽器。打開過單元頁算「看過」，按「標成已完成」才算完成
const progress = (u) => (store("done:" + u.no) === "1" ? "done" : store("seen:" + u.no) === "1" ? "seen" : "");
const PROGRESS = { done: "已完成", seen: "看過" };
const lastUnit = () => UNITS.find((u) => u.no === store("lastUnit"));
const minutes = (d) => { const [m, s] = d.split(":").map(Number); return m + s / 60; };

/* ---------- YouTube 播放器（只有靜態網站版會用到） ---------- */
let ytApi = null, player = null, playerReady = false, tickFn = null;
function loadYT() {
  if (!ytApi) ytApi = new Promise((resolve) => {
    window.onYouTubeIframeAPIReady = resolve;
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.append(s);
  });
  return ytApi;
}
function dropPlayer() {
  if (player && player.destroy) { try { player.destroy(); } catch (e) {} }
  player = null; playerReady = false; tickFn = null;
}
function makePlayer(elId, videoId, start) {
  loadYT().then(() => {
    if (!document.getElementById(elId)) return;
    player = new YT.Player(elId, {
      videoId,
      playerVars: { rel: 0, playsinline: 1, cc_load_policy: 0, start: Math.floor(start || 0), origin: location.origin },
      events: {
        onReady: () => {
          playerReady = true;
          const sp = +store("speed");
          if (sp) player.setPlaybackRate(sp);
          if (start) { player.seekTo(start, true); player.playVideo(); }
        },
        // 原片頁自己顯示字幕，關掉 YouTube 自動字幕避免重複
        onStateChange: (e) => { if (e.data === 1 && view.name === "lecture" && player.setOption) player.setOption("captions", "track", {}); },
      },
    });
  });
}
function seek(t) {
  if (!playerReady) return;
  player.seekTo(t, true);
  player.playVideo();
}
setInterval(() => { if (playerReady && tickFn && player.getCurrentTime) tickFn(player.getCurrentTime()); }, 200);

/* ---------- 路由 ---------- */
const view = { name: "home" };
let pendingSeek = null;
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  dropPlayer();
  const app = $("#app");
  let name = "home";
  const ln = learnRoute(h, app);
  if (ln) name = ln;
  else if (LECS[h]) { name = "lecture"; renderLecture(app, h); }
  else if (h === "glossary") { name = "glossary"; renderGlossary(app); }
  else renderHome(app);
  view.name = name;
  document.querySelectorAll("[data-nav]").forEach((a) => {
    const on = a.dataset.nav === (name === "unit" ? "home" : name === "review" ? "me" : name);
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  const nl = $('[data-nav="lecture"]');
  nl.href = "#" + lastLec();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
const lastLec = () => (LECS[store("lecture")] ? store("lecture") : "L01");

/* 首頁動畫：直線機率路徑，雜訊 ε 與螺旋資料 z 之間的內插 */
let flowRaf = 0;
function startFlow() {
  cancelAnimationFrame(flowRaf);
  const cv = $("#flow");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const N = 700, pts = [];
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const gauss = () => Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * Math.cos(2 * Math.PI * rnd());
  for (let i = 0; i < N; i++) {
    const s = rnd(), a = 0.6 + s * 3.4 * Math.PI, r = 0.12 + s * 0.78;
    pts.push({ ex: gauss() * 0.42, ey: gauss() * 0.42, zx: r * Math.cos(a) + gauss() * 0.025, zy: r * Math.sin(a) + gauss() * 0.025 });
  }
  const css = getComputedStyle(document.documentElement);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const hex = (h) => { const m = h.trim().replace("#", ""); return [0, 2, 4].map((i) => parseInt(m.slice(i, i + 2), 16)); };
  function draw(t) {
    const dpr = Math.min(devicePixelRatio || 1, 2), w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const c0 = hex(css.getPropertyValue("--noise")), c1 = hex(css.getPropertyValue("--data"));
    const [r, g, b] = mix(c0, c1, t);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    const sc = Math.min(w, h) * 0.5, cx = w / 2, cy = h / 2 + 6;
    for (const p of pts) {
      const x = t * p.zx + (1 - t) * p.ex, y = t * p.zy + (1 - t) * p.ey;
      ctx.fillRect(cx + x * sc, cy - y * sc, 2, 2);
    }
    const lab = $("#flowT");
    if (lab) lab.textContent = t.toFixed(2);
  }
  if (reduce) { draw(0.8); return; }
  const t0 = performance.now();
  const loop = (now) => {
    if (!document.body.contains(cv)) return;
    const k = ((now - t0) / 1000) % 9;          // 0–4 秒走過去、停 1.5 秒、2 秒退回、停 1.5 秒
    const ease = (x) => x * x * (3 - 2 * x);
    const t = k < 4 ? ease(k / 4) : k < 5.5 ? 1 : k < 7.5 ? 1 - ease((k - 5.5) / 2) : 0;
    draw(t);
    flowRaf = requestAnimationFrame(loop);
  };
  draw(0);
  flowRaf = requestAnimationFrame(loop);
}

const cardState = (id) => LD.cards[id] || null;
const isDue = (id) => { const s = cardState(id); return !s || s.due <= Date.now(); };
function mastery(id) {
  const s = cardState(id);
  if (!s) return 0;
  let m = (s.box - 1) / 4;
  const over = (Date.now() - s.due) / 864e5;
  if (over > Math.max(BOX_DAYS[s.box], 1)) m = Math.max(0, m - 0.25);  // 很久沒複習，記憶衰減
  return m;
}
function grade(id, g) {
  const s = cardState(id) || { box: 1 };
  const box = g === 0 ? 1 : g === 1 ? Math.max(s.box, 1) : Math.min(s.box + 1, 5);
  const ms = g === 0 ? 5 * 60e3 : g === 1 ? 864e5 : BOX_DAYS[box] * 864e5;
  LD.cards[id] = { box, due: Date.now() + ms };
  LD.reviews++;
  gain(g === 2 ? 3 : 1, "背誦卡");
}
const DECKS = { all: "全部", term: "術語", formula: "公式", listen: "聽力", vocab: "生字" };
function renderDeck(host, cards, opts = {}) {
  const st = { deck: "all", onlyDue: true, i: 0, flipped: false, queue: [] };
  const decks = ["all", ...new Set(cards.map((c) => c.deck))];
  function build() {
    st.queue = cards.filter((c) => (st.deck === "all" || c.deck === st.deck) && (!st.onlyDue || isDue(c.id)));
    st.i = 0; st.flipped = false;
  }
  function draw() {
    const pool = cards.filter((c) => st.deck === "all" || c.deck === st.deck);
    const due = pool.filter((c) => isDue(c.id)).length;
    const ms = pool.length ? Math.round(pool.reduce((a, c) => a + mastery(c.id), 0) / pool.length * 100) : 0;
    const c = st.queue[st.i];
    host.innerHTML = `
      <div class="deck-bar">
        <div class="chips">${decks.map((d) => `<button class="btn small" data-deck="${d}" aria-pressed="${d === st.deck}">${DECKS[d] || d}</button>`).join("")}</div>
        <label class="tgl"><input type="checkbox" id="onlyDue" ${st.onlyDue ? "checked" : ""}> 只看該複習的</label>
        <span class="muted">共 ${pool.length} 張 · 待複習 ${due} · 熟練度 ${ms}%</span>
      </div>
      ${c ? `
      <div class="flash ${st.flipped ? "flipped" : ""}">
        <div class="meta-line"><span>${DECKS[c.deck] || ""}${c.unit ? ` · 單元 ${c.unit}` : ""}</span><span>${st.i + 1} / ${st.queue.length}</span><span>第 ${(cardState(c.id) || { box: 0 }).box || "—"} 盒</span></div>
        <div class="face front">${c.front}${c.clip ? clipHtml(c.clip, "播放原句") : ""}</div>
        ${st.flipped ? `<div class="face back">${c.back}</div>` : ""}
        <div class="row-btns">
          ${st.flipped
            ? `<button class="btn" data-g="0">忘了</button><button class="btn" data-g="1">模糊</button><button class="btn primary" data-g="2">記得</button>`
            : `<button class="btn primary" id="flip">翻面（空白鍵）</button>`}
        </div>
      </div>` : `<div class="empty-state">${pool.length ? "這一疊目前沒有要複習的卡片 🎉　取消「只看該複習的」可以自由練習。" : (opts.empty || "還沒有卡片。")}</div>`}`;
    host.querySelectorAll("[data-deck]").forEach((b) => b.addEventListener("click", () => { st.deck = b.dataset.deck; build(); draw(); }));
    $("#onlyDue", host).addEventListener("change", (e) => { st.onlyDue = e.target.checked; build(); draw(); });
    const flip = $("#flip", host);
    if (flip) flip.addEventListener("click", () => { st.flipped = true; draw(); });
    host.querySelectorAll("[data-g]").forEach((b) => b.addEventListener("click", () => {
      grade(c.id, +b.dataset.g);
      if (+b.dataset.g === 0 && !st.onlyDue) st.queue.push(c);
      if (+b.dataset.g === 0 && st.onlyDue) st.queue.push(c);
      st.i++; st.flipped = false;
      if (opts.onChange) opts.onChange();
      draw();
    }));
  }
  host.onkeydown = null;
  host.tabIndex = -1;
  host.addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea")) return;
    if (e.key === " ") { e.preventDefault(); const f = $("#flip", host); if (f) f.click(); }
    if (["1", "2", "3"].includes(e.key)) { const b = host.querySelector(`[data-g="${+e.key - 1}"]`); if (b) b.click(); }
  });
  build(); draw();
}

/* ---------- 分數與雷達圖 ---------- */
function quizRec(no, id) { return LD.quiz[`${no}:${id}`]; }
function quizAcc(u, dim, first) {
  const qs = (u.learn ? u.learn.quiz : []).filter((q) => q.dim === dim);
  if (!qs.length) return 0;
  return qs.reduce((a, q) => { const r = quizRec(u.no, q.id); return a + (r ? (first ? r.first : r.ok) ? 1 : 0 : 0); }, 0) / qs.length;
}
function deckMastery(u, deck) {
  const cs = unitCards(u).filter((c) => c.deck === deck);
  return cs.length ? cs.reduce((a, c) => a + mastery(c.id), 0) / cs.length : 0;
}
function earScore(u) {
  const ws = u.ws ? u.ws.listen : [];
  const heard = ws.length ? ws.filter((l, k) => LD.heard[`${u.no}:${k}`]).length / ws.length : 0;
  const [a, b] = unitRange(u);
  const recs = Object.entries(LD.dict).filter(([k, v]) => k.startsWith(u.lecture + ":") && v.t >= a && v.t < b).map(([, v]) => v.acc);
  const dict = recs.length ? Math.min(recs.length / 20, 1) * (recs.reduce((x, y) => x + y, 0) / recs.length) : 0;
  return 0.5 * heard + 0.5 * dict;
}
function unitScore(u, first = false) {
  const q = (d) => quizAcc(u, d, first);
  if (first) return Object.fromEntries(DIMS.map(([d]) => [d, Math.round(q(d) * 100)]));
  const self = LD.self[u.no] || [];
  const selfS = self.length ? self.reduce((a, x) => a + (x || 0), 0) / (2 * 3) : 0;
  const pr = u.learn ? u.learn.practice : [];
  const prS = pr.length ? pr.filter((p) => LD.practice[`${u.no}:${p.id}`]).length / pr.length : 0;
  const boss = LD.boss ? LD.boss.score : 0;
  const s = {
    concept: 0.6 * q("concept") + 0.4 * selfS,
    formula: 0.6 * q("formula") + 0.4 * deckMastery(u, "formula"),
    compute: 0.6 * q("compute") + 0.4 * prS,
    term: 0.5 * q("term") + 0.5 * deckMastery(u, "term"),
    listen: 0.4 * q("listen") + 0.3 * deckMastery(u, "listen") + 0.3 * earScore(u),
    link: 0.8 * q("link") + 0.2 * boss,
  };
  return Object.fromEntries(Object.entries(s).map(([k, v]) => [k, Math.round(v * 100)]));
}
function overallScore() {
  const us = UNITS.filter((u) => u.learn);
  if (!us.length) return null;
  const all = us.map((u) => unitScore(u));
  return Object.fromEntries(DIMS.map(([d]) => [d, Math.round(all.reduce((a, s) => a + s[d], 0) / all.length)]));
}
function radar(cur, prev, opts = {}) {
  const W = 320, H = 280, cx = W / 2, cy = H / 2 + 6, R = 96, n = DIMS.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n; return [cx + Math.cos(a) * R * v, cy + Math.sin(a) * R * v]; };
  const poly = (vals) => DIMS.map(([d], i) => pt(i, Math.max(0.02, (vals[d] || 0) / 100)).map((x) => x.toFixed(1)).join(",")).join(" ");
  const rings = [0.25, 0.5, 0.75, 1].map((r) => `<polygon class="ring" points="${DIMS.map((_, i) => pt(i, r).join(",")).join(" ")}"/>`).join("");
  const spokes = DIMS.map((_, i) => { const [x, y] = pt(i, 1); return `<line class="spoke" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`; }).join("");
  const labels = DIMS.map(([d, name], i) => {
    const [x, y] = pt(i, 1.2);
    const anchor = Math.abs(x - cx) < 4 ? "middle" : x > cx ? "start" : "end";
    return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="${anchor}" class="lbl">${name}<tspan class="val" dx="4">${cur[d] || 0}</tspan></text>`;
  }).join("");
  const dots = DIMS.map(([d], i) => { const [x, y] = pt(i, Math.max(0.02, (cur[d] || 0) / 100)); return `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3"/>`; }).join("");
  const avg = Math.round(DIMS.reduce((a, [d]) => a + (cur[d] || 0), 0) / n);
  const desc = DIMS.map(([d, name]) => `${name} ${cur[d] || 0}`).join("、");
  return `<figure class="radar">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.title || "能力雷達圖"}：${desc}">
      ${rings}${spokes}
      ${prev ? `<polygon class="prev" points="${poly(prev)}"/>` : ""}
      <polygon class="cur" points="${poly(cur)}"/>${dots}${labels}
      <text x="${cx}" y="${cy + 5}" text-anchor="middle" class="avg">${avg}</text>
    </svg>
    <figcaption>${prev ? `<span class="key cur"></span>目前　<span class="key prev"></span>初次作答` : `<span class="key cur"></span>目前`}　中央是六維平均</figcaption>
  </figure>`;
}
const stars = (n, total = 3) => `<span class="stars" aria-label="${n} 顆星（滿分 ${total}）">${"★".repeat(n)}${"☆".repeat(total - n)}</span>`;
function statusHtml(no) {

/* ---------- 測驗題 ---------- */
const norm = (s) => String(s).toLowerCase().replace(/\$/g, "").replace(/[\s　]/g, "").replace(/[（]/g, "(").replace(/[）]/g, ")").replace(/[，]/g, ",");
function parseNum(s) {
  const t = String(s).trim().replace(/[，,]/g, "").replace(/−/g, "-");
  const f = t.match(/^(-?\d*\.?\d+)\s*\/\s*(-?\d*\.?\d+)$/);
  return f ? +f[1] / +f[2] : t === "" ? NaN : Number(t);
}
// 把一題畫進 host，送出後呼叫 done(ok)；opts.review：顯示詳解（練習模式）
function renderQuestion(host, q, u, opts = {}) {
  const st = {};
  let body = "";
  if (q.type === "choice" || q.type === "listen") {
    st.order = shuffle(q.choices.map((_, i) => i));
    body = `${q.type === "listen" ? clipHtml(q.clip, "播放原片片段") : ""}
      <div class="opts" role="radiogroup">${st.order.map((i) => `<button class="opt" role="radio" aria-checked="false" data-i="${i}">${q.choices[i]}</button>`).join("")}</div>`;
  } else if (q.type === "tf") {
    body = `<div class="opts tf" role="radiogroup"><button class="opt" role="radio" aria-checked="false" data-i="1">⭕ 對</button><button class="opt" role="radio" aria-checked="false" data-i="0">❌ 錯</button></div>`;
  } else if (q.type === "fill") {
    body = `<input class="ans" id="qa" type="text" autocomplete="off" placeholder="填入＿＿的內容" aria-label="填空答案">`;
  } else if (q.type === "numeric") {
    body = `<input class="ans" id="qa" type="text" inputmode="decimal" autocomplete="off" placeholder="輸入數字（可寫分數，例如 1/3）" aria-label="數值答案">`;
  } else if (q.type === "order") {
    st.items = shuffle(q.items.map((_, i) => i));
    if (st.items.every((v, i) => v === i) && st.items.length > 1) st.items.reverse();
    body = `<ol class="order" id="ord"></ol><p class="muted small">用 ↑ ↓ 調整順序。</p>`;
  } else if (q.type === "match") {
    st.rights = shuffle(q.pairs.map((_, i) => i));
    body = `<div class="match">${q.pairs.map((p, i) => `<div class="mrow"><span class="ml">${p[0]}</span><select data-l="${i}" aria-label="配對 ${i + 1}"><option value="">選擇…</option>${st.rights.map((r) => `<option value="${r}">${strip(q.pairs[r][1])}</option>`).join("")}</select></div>`).join("")}</div>`;
  }
  host.innerHTML = `
    <div class="q-meta"><span class="dim-tag d-${q.dim}">${DIM_NAME[q.dim] || ""}</span><span>${"●".repeat(q.level)}${"○".repeat(3 - q.level)}</span>${opts.label ? `<span>${opts.label}</span>` : ""}</div>
    <div class="q-prompt">${q.prompt}</div>
    <div class="q-body">${body}</div>
    <div class="row-btns"><button class="btn primary" id="qsubmit">送出</button>${opts.skip ? `<button class="btn" id="qskip">跳過</button>` : ""}</div>
    <div class="q-feedback" id="qfb" hidden></div>`;
  const drawOrder = () => {
    $("#ord", host).innerHTML = st.items.map((i, k) => `<li><span>${q.items[i]}</span><span class="mv"><button class="btn small" data-up="${k}" aria-label="上移" ${k ? "" : "disabled"}>↑</button><button class="btn small" data-dn="${k}" aria-label="下移" ${k < st.items.length - 1 ? "" : "disabled"}>↓</button></span></li>`).join("");
  };
  if (q.type === "order") {
    drawOrder();
    $("#ord", host).addEventListener("click", (e) => {
      const up = e.target.closest("[data-up]"), dn = e.target.closest("[data-dn]");
      if (up) { const k = +up.dataset.up; [st.items[k - 1], st.items[k]] = [st.items[k], st.items[k - 1]]; drawOrder(); }
      if (dn) { const k = +dn.dataset.dn; [st.items[k + 1], st.items[k]] = [st.items[k], st.items[k + 1]]; drawOrder(); }
    });
  }
  host.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
    if (st.done) return;
    host.querySelectorAll(".opt").forEach((x) => x.setAttribute("aria-checked", x === b));
    st.pick = +b.dataset.i;
  }));
  const inp = $("#qa", host);
  if (inp) { inp.addEventListener("keydown", (e) => { if (e.key === "Enter") $("#qsubmit", host).click(); }); setTimeout(() => inp.focus({ preventScroll: true }), 0); }
  if (opts.skip) $("#qskip", host).addEventListener("click", () => opts.onSkip && opts.onSkip());
  $("#qsubmit", host).addEventListener("click", () => {
    if (st.done) { if (opts.onNext) opts.onNext(); return; }
    let ok = false, shown = "";
    if (q.type === "choice" || q.type === "listen") {
      if (st.pick === undefined) return toast("先選一個答案");
      ok = st.pick === q.answer;
      host.querySelectorAll(".opt").forEach((x) => { const i = +x.dataset.i; if (i === q.answer) x.classList.add("right"); else if (i === st.pick) x.classList.add("wrong"); });
    } else if (q.type === "tf") {
      if (st.pick === undefined) return toast("先選對或錯");
      ok = !!st.pick === q.answer;
      shown = `正確答案：${q.answer ? "對" : "錯"}`;
    } else if (q.type === "fill") {
      const v = norm(inp.value);
      if (!v) return toast("先填答案");
      ok = q.accept.some((a) => norm(a) === v);
      shown = `可接受的答案：${q.accept.map(esc).join("、")}`;
    } else if (q.type === "numeric") {
      const v = parseNum(inp.value);
      if (Number.isNaN(v)) return toast("請輸入數字");
      ok = Math.abs(v - q.answer) <= Math.max(q.tol || 1e-6, 1e-9);
      shown = `正確答案：${q.answer}`;
    } else if (q.type === "order") {
      ok = st.items.every((v, i) => v === i);
      shown = `正確順序：${q.items.map((x, i) => `${i + 1}. ${x}`).join("　")}`;
    } else if (q.type === "match") {
      const sel = [...host.querySelectorAll("select")];
      if (sel.some((s) => s.value === "")) return toast("每一列都要配對");
      ok = sel.every((s) => +s.value === +s.dataset.l);
      sel.forEach((s) => s.classList.add(+s.value === +s.dataset.l ? "right" : "wrong"));
      shown = `正確配對：${q.pairs.map((p) => `${p[0]} → ${p[1]}`).join("；")}`;
    }
    st.done = true;
    if (inp) inp.readOnly = true;
    host.querySelectorAll("select, #ord button").forEach((x) => (x.disabled = true));
    const fb = $("#qfb", host);
    fb.hidden = false;
    fb.className = "q-feedback " + (ok ? "ok" : "bad");
    if (opts.review !== false) {
      fb.innerHTML = `<b>${ok ? "✓ 答對了" : "✗ 再想想"}</b>${!ok && shown ? `<div class="shown">${shown}</div>` : ""}<div>${q.explain}</div>${srcHtml(q.src, u)}`;
    } else {
      fb.innerHTML = `<b>${ok ? "✓ 答對" : "✗ 答錯"}</b>`;
    }
    const nb = $("#qsubmit", host);
    nb.textContent = opts.nextLabel || "下一題";
    if (!opts.onNext) nb.hidden = true;
    if (opts.skip) $("#qskip", host).hidden = true;
    if (opts.done) opts.done(ok);
  });
}

        <div class="selfeval" role="group" aria-label="第 ${k + 1} 題自評">自評：${["沒答對", "部分", "答對"].map((t, v) => `<button class="btn small" data-k="${k}" data-v="${v}" aria-pressed="${s2[k] === v}">${t}</button>`).join("")}</div>

      ${ws.answerExtra ? `<div class="answer-extra">${ws.answerExtra}</div>` : ""}</div>`;

    const p = practice.find((x) => x.id === b.dataset.check);
    const row = b.closest(".prow"), input = $("input", row), fb = $(".pfb", row);
    if (LD.practice[`${u.no}:${p.id}`]) return;
    const v = parseNum(input.value);

      LD.practice[`${u.no}:${p.id}`] = true; input.readOnly = true; b.textContent = "✓"; fb.textContent = "答對了";
      gain(5, "練習答對"); repaint();
    } else {
      fb.innerHTML = `還不對。${p.hint ? "提示：" + p.hint : ""}`;
    }
  }));
}

        <a class="btn small" href="${yt(lec.video)}" target="_blank" rel="noopener">${lec.label} 原片 ${ext}</a>
      </div></section>`;
  const doneBtn = $("#doneBtn", host);
  const paintDone = () => { const on = store("done:" + u.no) === "1"; doneBtn.setAttribute("aria-pressed", on); doneBtn.textContent = on ? "✓ 已看完" : "標成已看完"; };
  doneBtn.addEventListener("click", () => {
    const on = store("done:" + u.no) === "1";
    store("done:" + u.no, on ? "0" : "1");
    if (!on) gain(10, "看完前導片");
    paintDone();
  });

    tickFn = (t) => {
      let k = -1;
      u.timeline.forEach(([s], j) => { if (t >= s) k = j; });

    };
  }
}

/* 測驗分頁 */
function tabQuiz({ u, host, repaint }) {
  const L = u.learn;
  if (!L) { host.innerHTML = `<p class="muted">這個單元的測驗還在準備中。</p>`; return; }
  const qs = L.quiz;
  const mode = { name: "menu" };
  const drawMenu = () => {
    const done = qs.filter((q) => quizRec(u.no, q.id)).length, right = qs.filter((q) => (quizRec(u.no, q.id) || {}).ok).length;
    host.innerHTML = `<div class="quiz-menu">
      <section class="qm-card"><h3>練習模式</h3><p class="muted">全部 ${qs.length} 題，可以重複作答，每題附詳解與原片出處。</p>
        <p>已作答 ${done} / ${qs.length}，目前答對 ${right} 題</p>
        <div class="qgrid">${qs.map((q, k) => { const r = quizRec(u.no, q.id); return `<button class="qchip ${r ? (r.ok ? "ok" : "bad") : ""}" data-k="${k}" title="${DIM_NAME[q.dim]}">${k + 1}</button>`; }).join("")}</div>
        <button class="btn primary" id="startPractice">${done && done < qs.length ? "從沒做過的題目繼續" : "開始練習"}</button></section>
      <section class="qm-card"><h3>通關測驗</h3><p class="muted">隨機 10 題、六個維度都會出到，答完才看結果。60% 一顆星、80% 兩顆星、全對三顆星。</p>
        <p>最佳紀錄：${stars(LD.best[u.no] || 0)}</p>
        <button class="btn primary" id="startPass">開始通關</button></section>
    </div>`;
    host.querySelectorAll(".qchip").forEach((b) => b.addEventListener("click", () => practice(+b.dataset.k)));
    $("#startPractice", host).addEventListener("click", () => {
      const k = qs.findIndex((q) => !quizRec(u.no, q.id));
      practice(k < 0 ? 0 : k);
    });
    $("#startPass", host).addEventListener("click", pass);
  };
  const practice = (k) => {
    mode.name = "practice";
    host.innerHTML = `<div class="qtop"><button class="btn small" id="back">← 題目列表</button><span>練習 ${k + 1} / ${qs.length}</span></div><div class="question" id="qh"></div>`;
    $("#back", host).addEventListener("click", drawMenu);
    renderQuestion($("#qh", host), qs[k], u, {
      done: (ok) => { recordQuiz(u, qs[k], ok); repaint(); },
      onNext: () => (k + 1 < qs.length ? practice(k + 1) : drawMenu()),
      nextLabel: k + 1 < qs.length ? "下一題 →" : "回題目列表",
    });
  };
  const pass = () => {
    // 每個維度先抽 1 題，其餘隨機補到 10 題
    const picked = [];
    DIMS.forEach(([d]) => { const c = shuffle(qs.filter((q) => q.dim === d)); if (c[0]) picked.push(c[0]); });
    shuffle(qs.filter((q) => !picked.includes(q))).slice(0, Math.max(0, 10 - picked.length)).forEach((q) => picked.push(q));
    const set = shuffle(picked), res = [];
    const step = (k) => {
      if (k >= set.length) return finish();
      host.innerHTML = `<div class="qtop"><span>通關測驗 ${k + 1} / ${set.length}</span><progress max="${set.length}" value="${k}"></progress></div><div class="question" id="qh"></div>`;
      renderQuestion($("#qh", host), set[k], u, {
        review: false,
        done: (ok) => { res.push(ok); recordQuiz(u, set[k], ok, true); },
        onNext: () => step(k + 1), nextLabel: k + 1 < set.length ? "下一題 →" : "看結果",
      });
    };
    const finish = () => {
      const right = res.filter(Boolean).length, pct = right / set.length;
      const st = pct >= 1 ? 3 : pct >= 0.8 ? 2 : pct >= 0.6 ? 1 : 0;
      const prevBest = LD.best[u.no] || 0;
      if (st > prevBest) LD.best[u.no] = st;
      gain(10 + 20 * Math.max(0, st - prevBest), `通關測驗 ${right}/${set.length}`);
      repaint();
      host.innerHTML = `<div class="result"><div class="big-stars">${stars(st)}</div>
        <h3>答對 ${right} / ${set.length}（${Math.round(pct * 100)}%）</h3>
        ${st > prevBest ? `<p class="ok-msg">刷新紀錄！</p>` : ""}
        <ol class="review-list">${set.map((q, k) => `<li class="${res[k] ? "ok" : "bad"}"><span>${res[k] ? "✓" : "✗"}</span><div>${q.prompt}<div class="muted small">${q.explain}</div>${srcHtml(q.src, u)}</div></li>`).join("")}</ol>
        <div class="row-btns"><button class="btn primary" id="again">再挑戰一次</button><button class="btn" id="menu">回測驗首頁</button></div></div>`;
      $("#again", host).addEventListener("click", pass);
      $("#menu", host).addEventListener("click", drawMenu);
    };
    step(0);
  };
  drawMenu();
}

          ${gap ? `<tr class="gap"><td colspan="5">⚠ ${name}：自評比系統建議高兩級，可能高估了${todo.length ? `，去<a href="#u${u.no}/quiz">做第 ${todo.slice(0, 4).join("、")} 題</a>` : ""}。</td></tr>` : ""}`;

      if (first) gain(2, "自評"); else save();
      draw(); repaint();

    $("#printR", host).addEventListener("click", () => window.print());
  };
  draw();

/* ---------- 互動小實驗（每單元一個） ---------- */
function slider(id, label, min, max, step, val) {
  return `<label class="sl" for="${id}"><span>${label}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><output id="${id}o">${val}</output></label>`;
}
function canvasCtx(cv) {
  const dpr = Math.min(devicePixelRatio || 1, 2), w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
  return [c, w, h];
}
const CSSV = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function gaussRng(seed) {
  let s = seed;
  const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return () => Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(2 * Math.PI * r());
}
const LABS = {
  "01": (el) => {
    el.innerHTML = `<p>同樣走到 t＝1，切成 n 步，每步加一次隨機抖動。抖動乘上 1、h 或 √h，最後終點散得多開？（每次模擬 400 條路線）</p>
      ${slider("n", "步數 n", 1, 200, 1, 20)}
      <div class="chips" id="scale">${["1", "h", "√h"].map((s, k) => `<button class="btn small" data-s="${k}" aria-pressed="${k === 2}">乘 ${s}</button>`).join("")}</div>

function boss(box) {
  const pool = UNITS.filter((u) => u.learn).flatMap((u) => {
    const qs = shuffle(u.learn.quiz.filter((q) => q.dim === "link")).slice(0, 1).concat(shuffle(u.learn.quiz.filter((q) => q.dim === "concept" || q.dim === "formula")).slice(0, 1));
    return qs.map((q) => ({ q, u }));
  });
  const set = shuffle(pool), res = [];
  if (!set.length) { box.innerHTML = `<p class="muted">題庫準備中。</p>`; return; }
  const step = (k) => {
    if (k >= set.length) {
      const sc = res.filter(Boolean).length / set.length;
      const better = !LD.boss || sc > LD.boss.score;

const STOP = new Set("a an the and or but so if of to in on at by for with from as is are was were be been being it its this that these those i you he she we they me my your our their them us do does did not no yes uh um oh okay ok just like very really can could would should will shall may might have has had there here what which who whom when where why how all any some more most such than then too also".split(" "));
let GLOSS = null;
function glossIndex() {
  if (GLOSS) return GLOSS;
  GLOSS = D.glossary.map(([en, zh, unit, layer, note]) => ({ toks: en.toLowerCase().replace(/[^a-z0-9' -]/g, " ").split(/[\s-]+/).filter(Boolean), en, zh, unit, layer, note }))
    .filter((g) => g.toks.length);
  return GLOSS;
}
let DICT = null;
function loadDict() {
  // 內建字典（data/dict.json）還沒做；沒有就不去讀，直接引導到劍橋字典
  if (!DICT) DICT = D.hasDict ? fetch("data/dict.json").then((r) => (r.ok ? r.json() : {})).catch(() => ({})) : Promise.resolve({});
  return DICT;
}
const tokWord = (w) => w.toLowerCase().replace(/^[^a-z0-9]+|[^a-z0-9']+$/g, "").replace(/'s$/, "");
// 把英文句子切成可點的單字，術語表的詞加底色
function wordsHtml(en, idx) {
  const parts = en.split(/(\s+)/);
  const toks = parts.map((p, k) => (k % 2 ? null : tokWord(p)));
  const mark = new Array(parts.length).fill(null);
  glossIndex().forEach((g, gi) => {
    for (let k = 0; k < parts.length; k += 2) {
      let ok = true;
      for (let j = 0; j < g.toks.length; j++) {
        const t = toks[k + j * 2];
        if (!t || (t !== g.toks[j] && !(j === g.toks.length - 1 && (t === g.toks[j] + "s" || t === g.toks[j] + "es")))) { ok = false; break; }
      }
      if (ok) for (let j = 0; j < g.toks.length; j++) if (!mark[k + j * 2] || GLOSS[mark[k + j * 2]].toks.length < g.toks.length) mark[k + j * 2] = gi;
    }
  });
  return parts.map((p, k) => {
    if (k % 2) return p;
    if (!toks[k]) return esc(p);
    const g = mark[k] != null ? GLOSS[mark[k]] : null;
    const cls = g ? ` g-${{ "錨定": "anchor", "聽力詞": "listen", "聽過就好": "heard" }[g.layer] || "heard"}` : "";
    return `<span class="w${cls}" data-w="${esc(toks[k])}" data-i="${idx}"${g ? ` data-g="${mark[k]}"` : ""} tabindex="0">${esc(p)}</span>`;
  }).join("");
}
function lcs(a, b) {
  const n = a.length, m = b.length, dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hitA = new Array(n).fill(false), hitB = new Array(m).fill(false);
  let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] === b[j]) { hitA[i] = hitB[j] = true; i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }
  return { hitA, hitB, n: dp[0][0] };
}
const wordsOf = (s) => s.split(/\s+/).map(tokWord).filter(Boolean);
function diffHtml(ref, got) {
  const R = ref.split(/\s+/).filter(Boolean), Rt = R.map(tokWord), G = wordsOf(got);
  const keep = Rt.map((t, k) => (t ? k : -1)).filter((k) => k >= 0);
  const { hitA } = lcs(keep.map((k) => Rt[k]), G);
  const ok = new Set(keep.filter((_, x) => hitA[x]));
  const missed = keep.filter((k) => !ok.has(k)).map((k) => Rt[k]);
  return { html: R.map((w, k) => (Rt[k] && !ok.has(k) ? `<mark class="miss">${esc(w)}</mark>` : `<span class="hit">${esc(w)}</span>`)).join(" "), acc: keep.length ? ok.size / keep.length : 1, missed };
}

  makePlayer("ytp", lec.video, start);
  function playCue(i, after) {
    const c = cues[i]; if (!c || !playerReady) return;
    ls.stopAt = c[1]; ls.after = after || null; ls.loopLeft = 0;
    seek(c[0]);
  }
  const step = (d) => { const i = Math.min(Math.max(ls.active + d, 0), cues.length - 1); if (cues[i]) { ls.stopAt = null; ls.loopIdx = -1; seek(cues[i][0]); } };
  list.addEventListener("click", (e) => { const r = e.target.closest("[data-t]"); if (r) { ls.stopAt = null; seek(+r.dataset.t); } });
  $("#prev").addEventListener("click", () => step(-1));
  $("#next").addEventListener("click", () => step(1));
  $("#again").addEventListener("click", () => playCue(ls.active));
  $("#pauseEach").addEventListener("click", (e) => { ls.pauseEach = !ls.pauseEach; e.currentTarget.setAttribute("aria-pressed", ls.pauseEach); });
  $("#loop").addEventListener("change", (e) => { ls.loop = +e.target.value; ls.loopIdx = -1; });
  $("#setA").addEventListener("click", () => { if (!playerReady) return; ls.a = player.getCurrentTime(); ls.b = null; $("#setA").textContent = `A ${clock(ls.a)}`; $("#clrAB").hidden = false; });
  $("#setB").addEventListener("click", () => { if (!playerReady || ls.a == null) return toast("先按 A 設起點"); const t = player.getCurrentTime(); if (t <= ls.a) return toast("B 要在 A 之後"); ls.b = t; $("#setB").textContent = `B ${clock(ls.b)}`; seek(ls.a); });
  $("#clrAB").addEventListener("click", () => { ls.a = ls.b = null; $("#setA").textContent = "A"; $("#setB").textContent = "B"; $("#clrAB").hidden = true; });
  const sp = $("#speed"); sp.value = store("speed") || "1";
  sp.addEventListener("change", () => { store("speed", sp.value); if (playerReady) player.setPlaybackRate(+sp.value); });
  $("#toggleAuto").addEventListener("click", (e) => { ls.auto = !ls.auto; e.currentTarget.setAttribute("aria-pressed", ls.auto); render(); });
  document.querySelectorAll("[data-disp]").forEach((b) => b.addEventListener("click", () => {
    ls.disp = b.dataset.disp; store("disp", ls.disp);
    document.querySelectorAll("[data-disp]").forEach((x) => x.setAttribute("aria-pressed", x === b)); render();
  }));
  document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => {
    ls.mode = b.dataset.mode; store("mode", ls.mode);
    document.querySelectorAll("[data-mode]").forEach((x) => x.setAttribute("aria-selected", x === b));
    ls.pauseEach = ls.mode !== "listen"; $("#pauseEach").setAttribute("aria-pressed", ls.pauseEach);
    paintMode();
  }));
  ls.pauseEach = ls.mode !== "listen"; $("#pauseEach").setAttribute("aria-pressed", ls.pauseEach);

  // 進度條＋原片小節刻度
  function drawTicks() {
    const bar = $("#seekbar"); if (!bar) return;
    const total = cues.length ? cues[cues.length - 1][1] : 1;
    bar.querySelectorAll(".tick").forEach((x) => x.remove());
    sections.forEach((s) => { const t = document.createElement("button"); t.className = "tick"; t.style.left = (s.t / total * 100) + "%"; t.title = `${clock(s.t)} ${s.title}`; t.setAttribute("aria-label", t.title); t.addEventListener("click", () => seek(s.t)); bar.append(t); });
    checkpoints.forEach((s) => { const t = document.createElement("span"); t.className = "tick cp"; t.style.left = (s.t / total * 100) + "%"; bar.append(t); });
    bar.removeAttribute("aria-hidden");
    bar.onclick = (e) => { if (e.target !== bar && e.target.id !== "sbFill") return; const r = bar.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * total); };
  }

  // 模式面板：跟讀、聽寫
  const mp = $("#modepanel");
  function paintMode() {
    ls.revealed = false; paintNow();
    if (ls.mode === "listen") { mp.innerHTML = ""; return; }
    if (ls.mode === "study") { mp.innerHTML = `<p class="muted small">精聽：每句播完自動暫停。點英文單字查詞；可搭配單句循環、AB 循環、降速。</p>`; return; }
    if (ls.mode === "shadow") {
      const sr = window.SpeechRecognition || window.webkitSpeechRecognition;
      mp.innerHTML = `<div class="shadow"><p class="muted small">跟讀：每句播完暫停 → 按「錄音」跟著念 → 再按一次停止，會依序播放「原句 → 你的錄音」。${sr ? `<label class="tgl"><input type="checkbox" id="srOn"> 用瀏覽器語音辨識比對（聲音會送到瀏覽器廠商的伺服器）</label>` : ""}</p>
        <div class="row-btns"><button class="btn primary" id="recBtn">🎙 錄音</button><button class="btn" id="playMine" disabled>▶ 原句 → 我的</button></div><div id="srOut" class="sr-out"></div></div>`;
      $("#recBtn").addEventListener("click", toggleRec);
      $("#playMine").addEventListener("click", playCompare);
      return;
    }
    mp.innerHTML = `<div class="dictate"><p class="muted small">聽寫：每句播完暫停，把聽到的英文打出來。答錯的詞會自動收進生字本。</p>
      <input type="text" id="dIn" autocomplete="off" spellcheck="false" placeholder="聽到什麼就打什麼，按 Enter 送出" aria-label="聽寫輸入">
      <div class="row-btns"><button class="btn primary" id="dGo">送出</button><button class="btn" id="dAgain">再聽一次</button><button class="btn" id="dShow">直接看答案</button></div><div id="dOut" class="d-out" aria-live="polite"></div></div>`;
    const go = () => {
      const c = cues[ls.active]; if (!c) return;
      const v = $("#dIn").value.trim(); if (!v) return;
      const r = diffHtml(c[3], v);
      ls.revealed = true; paintNow();
      $("#dOut").innerHTML = `<div class="acc">正確率 <b>${Math.round(r.acc * 100)}%</b></div><div>${r.html}</div>`;
      const k = `${key}:${ls.active}`, first = !LD.dict[k];
      LD.dict[k] = { acc: r.acc, t: c[0] };
      const add = r.missed.filter((w) => w.length > 3 && !STOP.has(w) && !/\d/.test(w)).slice(0, 3);
      add.forEach((w) => { if (!LD.vocab.some((x) => x.w.toLowerCase() === w)) LD.vocab.push({ w, zh: "", en: c[3], zhs: c[2], lec: key, t: c[0], d: c[1] - c[0], at: today(), from: "聽寫" }); });
      if (add.length) $("#dOut").insertAdjacentHTML("beforeend", `<div class="muted small">已收進生字本：${add.map(esc).join("、")}</div>`);
      if (first) gain(r.acc >= 0.8 ? 6 : 3, `聽寫 ${Math.round(r.acc * 100)}%`); else save();
    };
    $("#dGo").addEventListener("click", go);
    $("#dIn").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    $("#dAgain").addEventListener("click", () => playCue(ls.active));
    $("#dShow").addEventListener("click", () => { ls.revealed = true; paintNow(); });
  }
  // 錄音
  let recorder = null, chunks = [], mine = null, recognizer = null, heardText = "";
  async function toggleRec() {
    const btn = $("#recBtn");
    if (recorder && recorder.state === "recording") { recorder.stop(); if (recognizer) try { recognizer.stop(); } catch (e) {} return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) return toast("這個瀏覽器不支援錄音");
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { return toast("沒有取得麥克風權限"); }
    if (playerReady && player.getPlayerState() === 1) player.pauseVideo();
    chunks = []; recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      if (mine) URL.revokeObjectURL(mine);
      mine = URL.createObjectURL(new Blob(chunks, { type: recorder.mimeType }));
      btn.textContent = "🎙 重錄"; btn.classList.remove("rec");
      $("#playMine").disabled = false;
      LD.shadow++; gain(3, "跟讀");
      setTimeout(() => {
        const c = cues[ls.active];
        if (c && heardText) { const r = diffHtml(c[3], heardText); $("#srOut").innerHTML = `<div class="acc">辨識吻合 <b>${Math.round(r.acc * 100)}%</b>（只供參考）</div><div>${r.html}</div><div class="muted small">辨識到：${esc(heardText)}</div>`; }
        playCompare();
      }, 300);
    };
    heardText = "";
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR && $("#srOn") && $("#srOn").checked) {
      recognizer = new SR(); recognizer.lang = "en-US"; recognizer.interimResults = false; recognizer.continuous = true;
      recognizer.onresult = (e) => { heardText = [...e.results].map((r) => r[0].transcript).join(" "); };
      try { recognizer.start(); } catch (e) { recognizer = null; }
    } else recognizer = null;
    recorder.start(); btn.textContent = "■ 停止"; btn.classList.add("rec");
    $("#srOut").innerHTML = "";
  }
  function playCompare() {
    if (!mine) return;
    playCue(ls.active, () => { const a = new Audio(mine); a.play().catch(() => {}); });
  }

  // 每 200 毫秒同步：字幕、循環、檢查點、術語浮卡
  const anchorTerms = glossIndex().map((g, gi) => [g, gi]).filter(([g]) => g.layer === "錨定" && units.some((u) => u.no === g.unit));
  const cpPop = $("#popcard");
  function popcard(html, ms) {
    cpPop.innerHTML = html; cpPop.hidden = false;
    clearTimeout(cpPop._t); if (ms) cpPop._t = setTimeout(() => (cpPop.hidden = true), ms);
    const x = $(".pc-x", cpPop); if (x) x.addEventListener("click", () => (cpPop.hidden = true));
  }
  tickFn = (t) => {
    const total = cues.length ? cues[cues.length - 1][1] : 1;
    const fill = $("#sbFill"); if (fill) fill.style.width = Math.min(100, t / total * 100) + "%";
    if (ls.a != null && ls.b != null && t >= ls.b) { seek(ls.a); return; }
    if (ls.stopAt !== null && t >= ls.stopAt) {
      if (ls.loop && ls.loopLeft > 0 && !ls.after) { ls.loopLeft--; seek(cues[ls.active][0]); return; }
      player.pauseVideo(); ls.stopAt = null;
      if (ls.after) { const f = ls.after; ls.after = null; f(); }
      return;
    }
    // 檢查點：學習單的原片導航
    for (const cp of checkpoints) {
      if (!seen.has(cp.t) && t >= cp.t && t < cp.t + 1.2) {
        seen.add(cp.t);
        popcard(`<div class="pc-head"><span>📍 學習單提示 · 單元 ${cp.unit}</span><button class="btn small pc-x" aria-label="關閉">×</button></div><div>${cp.text}</div><div class="row-btns"><button class="btn small" id="cpPause">暫停想一想</button></div>`, 12000);
        $("#cpPause").addEventListener("click", () => { player.pauseVideo(); cpPop.hidden = true; });
      }
    }
    const i = cues.findIndex((c) => t >= c[0] && t < c[1]);
    if (i < 0 || i === ls.active) return;
    const prevI = ls.active;
    // 單句循環：上一句剛結束就跳回去
    if (ls.loop && prevI >= 0 && i === prevI + 1 && player.getPlayerState() === 1) {
      if (ls.loopIdx !== prevI) { ls.loopIdx = prevI; ls.loopLeft = ls.loop; }
      if (ls.loopLeft > 0) { ls.loopLeft--; player.seekTo(cues[prevI][0], true); return; }
    }
    if (ls.pauseEach && prevI >= 0 && i === prevI + 1 && player.getPlayerState() === 1) {
      player.pauseVideo(); player.seekTo(cues[i][0], true);
      if (ls.mode === "dictate" || ls.mode === "shadow") { player.seekTo(cues[prevI][0], true); return; }
    }
    ls.active = i; ls.revealed = false;
    if (ls.mode === "dictate" && $("#dIn")) { $("#dIn").value = ""; $("#dOut").innerHTML = ""; }
    if (ls.mode === "shadow" && $("#srOut")) { $("#srOut").innerHTML = ""; if ($("#playMine")) $("#playMine").disabled = true; if ($("#recBtn")) $("#recBtn").textContent = "🎙 錄音"; }
    mark(ls.tab !== "subs");
    // 術語浮卡：本堂的錨定詞出現時提示，同一個詞 2 分鐘內不重複
    const low = " " + wordsOf(cues[i][3]).join(" ") + " ";
    const hit = anchorTerms.find(([g]) => low.includes(" " + g.toks.join(" ") + " ") && !(termSeen[g.en] > t - 120));
    if (hit && cpPop.hidden) {
      termSeen[hit[0].en] = t;
      popcard(`<div class="pc-head"><span>📘 本堂術語</span><button class="btn small pc-x" aria-label="關閉">×</button></div><div><b class="en">${esc(hit[0].en)}</b>　${esc(hit[0].zh)}</div>${hit[0].note ? `<div class="muted small">${esc(hit[0].note)}</div>` : ""}`, 6000);
    }
  };
  paintMode();
  lecKeys = (e) => {
    if (e.key === "ArrowLeft") { e.preventDefault(); $("#prev")?.click(); }
    if (e.key === "ArrowRight") { e.preventDefault(); $("#next")?.click(); }
    if (e.key === "r" || e.key === "R") $("#again")?.click();
    if (e.key === "n" || e.key === "N") { e.preventDefault(); ls.tab = "notes"; render(); setTimeout(() => $("#lnote")?.focus(), 0); }
    if (e.key === " " && !e.target.matches("button, a")) { e.preventDefault(); if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo(); }
  };
}
let lecKeys = null, wordHandler = null, pendingStudy = null;
// 單字點擊只掛一次，交給目前這一堂的處理函式
document.addEventListener("click", (e) => {
  const pop = $("#wordpop");
  const s = e.target.closest(".w[data-w]");
  if (s && wordHandler) { wordHandler(s); return; }
  if (pop && !pop.hidden && !e.target.closest("#wordpop")) pop.hidden = true;
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && wordHandler && e.target.matches && e.target.matches(".w[data-w]")) wordHandler(e.target);
  if (e.key === "Escape" && $("#wordpop")) $("#wordpop").hidden = true;
});
document.addEventListener("keydown", (e) => {
  if (view.name !== "lecture" || !playerReady || !lecKeys || e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey) return;
  lecKeys(e);
});

/* ---------- 字幕回報（只有 claude.ai 版有共享資料庫） ---------- */
const REPORT_URL = "https://claude.ai/artifact/VqE14dHm5frx1BC4dGHveu";
function reportBtn(key, i) {
  if (DB) return `<button class="btn small" data-report="${i}">⚑ 回報字幕錯誤</button>`;
  if (EMBED) return `<a class="btn small" href="${REPORT_URL}#${key}/c${i}" target="_blank" rel="noopener">⚑ 回報字幕錯誤 ${ext}</a>`;
  // claude.ai 版但這個帳號不能寫入共享資料：改成複製一段回報文字
  return `<button class="btn small" data-copyreport="${i}">⚑ 複製回報內容</button>`;
}
function bindReport(host, key, cues) {
  host.querySelectorAll("[data-report]").forEach((b) => b.addEventListener("click", () => openReport(host, key, +b.dataset.report, cues)));
  host.querySelectorAll("[data-copyreport]").forEach((b) => b.addEventListener("click", () => {
    const i = +b.dataset.copyreport, c = cues[i];
    const text = `MIT 6.S184 字幕回報｜${key} 第 ${i + 1} 句（${clock(c[0])}）\n英文：${c[3]}\n中文：${c[2]}\n應該是：`;
    try { navigator.clipboard.writeText(text); toast("已複製，貼給課程整理者並寫上正確內容"); } catch (e) { toast("無法複製，請手動記下句子編號"); }
  }));
}
function openReport(host, key, i, cues) {
  const c = cues[i];
  const box = document.createElement("form");
  box.className = "report";
  box.innerHTML = `<b>回報 ${key} 第 ${i + 1} 句（${clock(c[0])}）</b>
    <label>哪一行有錯 <select name="field"><option value="en">英文</option><option value="zh">中文</option></select></label>
    <label>正確應該是 <textarea name="proposed" rows="2" required>${esc(c[3])}</textarea></label>
    <label>說明（選填） <input name="note" type="text" placeholder="例如：講者說的是 theta"></label>
    <div class="row-btns"><button class="btn small primary" type="submit">送出回報</button><button class="btn small" type="button" data-x>取消</button></div>`;
  host.append(box);
  const f = box.elements;
  f.field.addEventListener("change", () => { f.proposed.value = f.field.value === "en" ? c[3] : c[2]; });
  box.querySelector("[data-x]").addEventListener("click", () => box.remove());
  box.addEventListener("submit", async (e) => {
    e.preventDefault();
    const field = f.field.value, proposed = f.proposed.value.trim(), old = field === "en" ? c[3] : c[2];
    if (!proposed || proposed === old) return toast("內容和原句相同");
    try {
      await DB.add({ lec: key, id: i + 1, t: c[0], field, old, proposed, note: f.note.value.trim(), status: "new" });
      box.innerHTML = `<b>已送出，謝謝！</b><span class="muted small">整理後會更新字幕。</span>`;
    } catch (err) { toast("送出失敗，請稍後再試"); }
  });
}
let DB = null;  // claude.ai 版會在這裡接上共享資料庫
// 回報存在 corrections/<檢視者 id>/items/：每人只寫自己的，擁有者（整理字幕的人）讀得到全部
(async () => {
  if (EMBED) return;
  for (let k = 0; k < 30 && !(window.claude && window.claude.use); k++) await new Promise((r) => setTimeout(r, 100));
  if (!(window.claude && window.claude.use)) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    if ((await user.can("data.write")) === false) return;  // 只能檢視的帳號寫不進共享資料
    const id = await user.id();
    if (!id) return;
    DB = { add: (data) => db.collection(`corrections/${id}/items`).add({ ...data, at: Date.now() }) };
    if (view.name === "lecture") route();
  } catch (e) { DB = null; }
})();

/* ---------- 路由 ---------- */
function learnRoute(h, app) {
  wordHandler = null; lecKeys = null;
  const m = h.match(/^u(\d\d)(?:\/(\w+))?$/);
  if (m && U(m[1])) { renderUnit(app, U(m[1]), m[2]); return "unit"; }
  if (h === "me") { renderMe(app); return "me"; }
  const c = h.match(/^(L\w+)\/c(\d+)$/);
  if (c && LECS[c[1]]) { pendingStudy = +c[2]; renderLecture(app, c[1]); return "lecture"; }
  if (h === "review") { renderReview(app); return "review"; }
  return null;
}
touchDay(); save(); checkBadges();

route();
paintStatus();
</script>
