","youtube":"RCD-PufM7Ps","topic":"score function、score matching、SDE 抽樣","range":null,"question":"流模型已經學好了，要怎麼加雜訊又不把結果弄壞？","timeline":[[0,"片頭"],[14,"小節 1｜為什麼要多學一個東西？"],[40,"小節 2｜分數：山坡上的箭頭"],[92,"小節 3｜一筆資料與全部資料"],[166,"小節 4｜換個寫法而已"],[211,"小節 5｜分數匹配，同一招"],[258,"小節 6｜其實是在猜雜訊"],[340,"小節 7｜加雜訊，推回來"],[409,"小節 8｜為什麼 σ 可以任選"],[472,"小節 9｜理論與實務"],[546,"小節 10｜打開原片看哪裡？"]],"sheet":"<p><a href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\">打開原片<\/a>。建議用<a href=\"#L03A\" data-lec=\"L03A\">原片字幕頁<\/a>，可逐句重聽、調慢速度；公式以投影片畫面為準。<\/p>\n<h3>看前導片之前：先答一次<\/h3>\n<p>先寫下答案，不查資料。看完原片後再答同樣三題，比較自己的差異。<\/p>\n<ol><li>條件分數的箭頭指向哪裡？和條件向量場同方向嗎？<\/li><li>網路猜雜訊，為什麼等於在學分數？為什麼不直接回歸分數？<\/li><li>流模型只加雜訊會怎樣？要加什麼才對？σ 真的什麼值都可以嗎？<\/li><\/ol>\n<h3>今天的八個詞<\/h3>\n<div class=\"table-wrap vocab\"><table><thead><tr><th>中文<\/th><th>英文<\/th><th>符號<\/th><th>白話<\/th><\/tr><\/thead><tbody><tr><td>對數概似<\/td><td>log-likelihood<\/td><td><math aria-label=\"log q(x)\"><mrow><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><mi>q<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>機率取 log 之後的高度<\/td><\/tr><tr><td>梯度<\/td><td>gradient<\/td><td><math aria-label=\"∇\"><mrow><mo>∇<\/mo><\/mrow><\/math><\/td><td>上升最快的方向<\/td><\/tr><tr><td>分數函數<\/td><td>score function<\/td><td><math aria-label=\"s(x)=∇log q(x)\"><mrow><mi>s<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><mi>q<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>往機率變大最快的方向指一根箭頭<\/td><\/tr><tr><td>條件分數<\/td><td>conditional score<\/td><td><math aria-label=\"∇log p_t(x|z)\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>只看一筆資料時的分數，指向 α_t z<\/td><\/tr><tr><td>邊際分數<\/td><td>marginal score<\/td><td><math aria-label=\"∇log p_t(x)\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>全部資料按份量投票的分數<\/td><\/tr><tr><td>重新參數化<\/td><td>reparameterization<\/td><td><math aria-label=\"u_t=a_t s_t+b_t x\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><msub><mi>a<\/mi><mi>t<\/mi><\/msub><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo>+<\/mo><msub><mi>b<\/mi><mi>t<\/mi><\/msub><mi>x<\/mi><\/mrow><\/math><\/td><td>同一件事，換個寫法，只限高斯路徑<\/td><\/tr><tr><td>去雜訊分數匹配<\/td><td>denoising score matching<\/td><td><math aria-label=\"L_CSM\"><mrow><msub><mi>L<\/mi><mi>CSM<\/mi><\/msub><\/mrow><\/math><\/td><td>給資料加雜訊，再學怎麼指回去<\/td><\/tr><tr><td>SDE 延伸技巧<\/td><td>SDE extension trick<\/td><td><math aria-label=\"dX=[u+(σ²/2)s]dt+σdW\"><mrow><mi>d<\/mi><mi>X<\/mi><mo>=<\/mo><mo stretchy=\"false\">[<\/mo><mi>u<\/mi><mo>+<\/mo><mo stretchy=\"false\">(<\/mo><msup><mi>σ<\/mi><mn>2<\/mn><\/msup><mo lspace=\"0\" rspace=\"0\">/<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><mi>s<\/mi><mo stretchy=\"false\">]<\/mo><mi>d<\/mi><mi>t<\/mi><mo>+<\/mo><mi>σ<\/mi><mi>d<\/mi><mi>W<\/mi><\/mrow><\/math><\/td><td>加雜訊，同時用分數推回來<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>聽得出這三個詞<\/h3>\n<ul class=\"checks\"><li class=\"check\"><input type=\"checkbox\" id=\"chk-03-1\"><label for=\"chk-03-1\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=1132s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"1132\">18:52<\/a>：brushing over，快速帶過；這段聽不完整沒關係<\/label><\/li><li class=\"check\"><input type=\"checkbox\" id=\"chk-03-2\"><label for=\"chk-03-2\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=2432s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"2432\">40:32<\/a>：theory practice gap，理論和實務的落差<\/label><\/li><li class=\"check\"><input type=\"checkbox\" id=\"chk-03-3\"><label for=\"chk-03-3\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=2528s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"2528\">42:08<\/a>：ablate over，一個一個試過去比較；<a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=2710s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"2710\">45:10<\/a> 自動字幕寫成 a blade<\/label><\/li><\/ul>\n<h3>原片導航<\/h3>\n<div class=\"table-wrap nav-table\"><table><thead><tr><th>時間<\/th><th>看什麼<\/th><\/tr><\/thead><tbody><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=146s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"146\">02:26<\/a><\/td><td>分數的定義<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=594s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"594\">09:54<\/a><\/td><td>換算公式<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=837s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"837\">13:57<\/a><\/td><td>去雜訊分數匹配<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=1122s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"1122\">18:42<\/a><\/td><td>其實在猜雜訊<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=1288s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"1288\">21:28<\/a><\/td><td>SDE 延伸技巧<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=1658s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"1658\">27:38<\/a><\/td><td>散開與推回<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=2419s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"2419\">40:19<\/a><\/td><td>為什麼還要比較 σ<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=2689s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"2689\">44:49<\/a><\/td><td>小結<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=1720s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"1720\">28:40<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=2298s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"2298\">38:18<\/a><\/td><td>證明不必會，第一次可跳過<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=2379s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"2379\">39:39<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=2411s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"2411\">40:11<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=2576s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"2576\">42:56<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=2688s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"2688\">44:48<\/a><\/td><td>蛋白質例子、Langevin 旁支，可先跳<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>四個陷阱<\/h3>\n<ol><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=1775s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"1775\">29:35<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=1892s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"1892\">31:32<\/a> 的正負號說反了。依講義 p.29：增加＝流入－流出。<\/li><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=2275s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"2275\">37:55<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=2351s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"2351\">39:11<\/a> 說不必訓練，意思是不必<strong>重新<\/strong>訓練。<\/li><li>講義 p.32 說丟掉常數 1/β²，它隨 t 變，其實是重新加權；投影片 p.15 的不穩定，口頭沒說。<\/li><li>本課 t=0 是雜訊、t=1 是資料，別的論文常相反，先確認方向（講義 p.84）。<\/li><\/ol>\n<h3>練習：算一根箭頭<\/h3>\n<p>一維的直線路徑，z=2，ε=1，t=0.5。α_t=t，β_t=1−t。<\/p>\n<ol><li>算出位置 x。<\/li><li>用 −(x−α_t z)/β_t² 和 −ε/β_t 各算一次條件分數，確認兩者相同。<\/li><li>用 a=(1−t)/t、b=1/t 算 a·s＋b·x，再和 z−ε 比較。<\/li><\/ol>\n<details class=\"answers\"><summary>參考答案（先自己答，再打開）<\/summary>\n<ol><li>指向此刻雲的中心 α_t z，不是 z。條件向量場指向 z，所以兩者一般不同方向；片中簡化模型的夾角中位數是 42.1 度，這個數字只屬於這個模型。<\/li><li>條件分數化簡後是 −ε/β_t，所以知道雜訊就知道答案，分數網路和雜訊網路差一個 −β_t。直接回歸時，t 接近 1 的答案太大，損失會出現巨大尖峰；雜訊的大小固定，訓練穩定很多。兩種損失不是差常數，是重新加權。<\/li><li>只加雜訊，分布會散開、螺旋會糊掉。要加修正項：分數乘 σ²/2。理論上 σ 任選，因為散開與推回一起和 σ² 成正比；實務上步數要跟 σ² 一起增加。片中簡化模型不報最佳 σ。<\/li><\/ol>\n<p><strong>練習答案<\/strong>：x = 0.5×2 + 0.5×1 = 1.5。−(1.5−1)/0.25 = −2；−1/0.5 = −2。a=1、b=2：1×(−2) + 2×1.5 = 1；z−ε = 1。<\/p>\n<p>片中粒子、三筆資料與小網路都是簡化模型，只用來看機制，不代表真實影像模型的表現；高維與真實圖片沒有驗證。<\/p>\n<\/details>","duration":"10:25","thumb":"data/thumb_03.jpg","ws":{"intro":"<p><a href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\">打開原片<\/a>。建議用<a href=\"#L03A\" data-lec=\"L03A\">原片字幕頁<\/a>，可逐句重聽、調慢速度；公式以投影片畫面為準。<\/p>","pre":["條件分數的箭頭指向哪裡？和條件向量場同方向嗎？","網路猜雜訊，為什麼等於在學分數？為什麼不直接回歸分數？","流模型只加雜訊會怎樣？要加什麼才對？σ 真的什麼值都可以嗎？"],"preNote":"<p>先寫下答案，不查資料。看完原片後再答同樣三題，比較自己的差異。<\/p>","words":[["對數概似","log-likelihood","<math aria-label=\"log q(x)\"><mrow><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><mi>q<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","機率取 log 之後的高度"],["梯度","gradient","<math aria-label=\"∇\"><mrow><mo>∇<\/mo><\/mrow><\/math>","上升最快的方向"],["分數函數","score function","<math aria-label=\"s(x)=∇log q(x)\"><mrow><mi>s<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><mi>q<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","往機率變大最快的方向指一根箭頭"],["條件分數","conditional score","<math aria-label=\"∇log p_t(x|z)\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","只看一筆資料時的分數，指向 α_t z"],["邊際分數","marginal score","<math aria-label=\"∇log p_t(x)\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","全部資料按份量投票的分數"],["重新參數化","reparameterization","<math aria-label=\"u_t=a_t s_t+b_t x\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><msub><mi>a<\/mi><mi>t<\/mi><\/msub><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo>+<\/mo><msub><mi>b<\/mi><mi>t<\/mi><\/msub><mi>x<\/mi><\/mrow><\/math>","同一件事，換個寫法，只限高斯路徑"],["去雜訊分數匹配","denoising score matching","<math aria-label=\"L_CSM\"><mrow><msub><mi>L<\/mi><mi>CSM<\/mi><\/msub><\/mrow><\/math>","給資料加雜訊，再學怎麼指回去"],["SDE 延伸技巧","SDE extension trick","<math aria-label=\"dX=[u+(σ²/2)s]dt+σdW\"><mrow><mi>d<\/mi><mi>X<\/mi><mo>=<\/mo><mo stretchy=\"false\">[<\/mo><mi>u<\/mi><mo>+<\/mo><mo stretchy=\"false\">(<\/mo><msup><mi>σ<\/mi><mn>2<\/mn><\/msup><mo lspace=\"0\" rspace=\"0\">/<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><mi>s<\/mi><mo stretchy=\"false\">]<\/mo><mi>d<\/mi><mi>t<\/mi><mo>+<\/mo><mi>σ<\/mi><mi>d<\/mi><mi>W<\/mi><\/mrow><\/math>","加雜訊，同時用分數推回來"]],"listen":[{"t":1132,"lec":"L03A","word":"brushing over","gloss":"快速帶過；這段聽不完整沒關係"},{"t":2432,"lec":"L03A","word":"theory practice gap","gloss":"理論和實務的落差"},{"t":2528,"lec":"L03A","word":"ablate over","gloss":"一個一個試過去比較；<a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=2710s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"2710\">45:10<\/a> 自動字幕寫成 a blade"}],"nav":[{"t":146,"lec":"L03A","text":"分數的定義","plain":"分數的定義"},{"t":594,"lec":"L03A","text":"換算公式","plain":"換算公式"},{"t":837,"lec":"L03A","text":"去雜訊分數匹配","plain":"去雜訊分數匹配"},{"t":1122,"lec":"L03A","text":"其實在猜雜訊","plain":"其實在猜雜訊"},{"t":1288,"lec":"L03A","text":"SDE 延伸技巧","plain":"SDE 延伸技巧"},{"t":1658,"lec":"L03A","text":"散開與推回","plain":"散開與推回"},{"t":2419,"lec":"L03A","text":"為什麼還要比較 σ","plain":"為什麼還要比較 σ"},{"t":2689,"lec":"L03A","text":"小結","plain":"小結"},{"t":1720,"lec":"L03A","text":"證明不必會，第一次可跳過","plain":"證明不必會，第一次可跳過"},{"t":2379,"lec":"L03A","text":"蛋白質例子、Langevin 旁支，可先跳","plain":"蛋白質例子、Langevin 旁支，可先跳"}],"navNote":"<h3>四個陷阱<\/h3>\n<ol><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=1775s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"1775\">29:35<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=1892s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"1892\">31:32<\/a> 的正負號說反了。依講義 p.29：增加＝流入－流出。<\/li><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=2275s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"2275\">37:55<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=ngC3QnYSVNM&amp;t=2351s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03A\" data-t=\"2351\">39:11<\/a> 說不必訓練，意思是不必<strong>重新<\/strong>訓練。<\/li><li>講義 p.32 說丟掉常數 1/β²，它隨 t 變，其實是重新加權；投影片 p.15 的不穩定，口頭沒說。<\/li><li>本課 t=0 是雜訊、t=1 是資料，別的論文常相反，先確認方向（講義 p.84）。<\/li><\/ol>","practice":{"title":"練習：算一根箭頭","html":"<p>一維的直線路徑，z=2，ε=1，t=0.5。α_t=t，β_t=1−t。<\/p>\n<ol><li>算出位置 x。<\/li><li>用 −(x−α_t z)/β_t² 和 −ε/β_t 各算一次條件分數，確認兩者相同。<\/li><li>用 a=(1−t)/t、b=1/t 算 a·s＋b·x，再和 z−ε 比較。<\/li><\/ol>"},"answers":["指向此刻雲的中心 α_t z，不是 z。條件向量場指向 z，所以兩者一般不同方向；片中簡化模型的夾角中位數是 42.1 度，這個數字只屬於這個模型。","條件分數化簡後是 −ε/β_t，所以知道雜訊就知道答案，分數網路和雜訊網路差一個 −β_t。直接回歸時，t 接近 1 的答案太大，損失會出現巨大尖峰；雜訊的大小固定，訓練穩定很多。兩種損失不是差常數，是重新加權。","只加雜訊，分布會散開、螺旋會糊掉。要加修正項：分數乘 σ²/2。理論上 σ 任選，因為散開與推回一起和 σ² 成正比；實務上步數要跟 σ² 一起增加。片中簡化模型不報最佳 σ。"],"answerExtra":"<p><strong>練習答案<\/strong>：x = 0.5×2 + 0.5×1 = 1.5。−(1.5−1)/0.25 = −2；−1/0.5 = −2。a=1、b=2：1×(−2) + 2×1.5 = 1；z−ε = 1。<\/p>\n<p>片中粒子、三筆資料與小網路都是簡化模型，只用來看機制，不代表真實影像模型的表現；高維與真實圖片沒有驗證。<\/p>","extra":[]},"learn":{"unit":"03","notes":{"keypoints":["分數 <math aria-label=\"s(x) = ∇log q(x)\"><mrow><mi>s<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><mi>q<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 是一根箭頭，指向對數概似上升最快的方向；它不是機率本身，也和考試的分數無關。","條件分數指向此刻那團雲的中心 <math aria-label=\"α_t z\"><mrow><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><\/mrow><\/math>，不是 z；邊際分數是各筆資料的條件分數，按後驗份量投票的結果。","高斯路徑上，向量場和分數只差一次換算 <math aria-label=\"u_t = a_t s_t + b_t x\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><msub><mi>a<\/mi><mi>t<\/mi><\/msub><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo>+<\/mo><msub><mi>b<\/mi><mi>t<\/mi><\/msub><mi>x<\/mi><\/mrow><\/math>，學會一個就有另一個；但 t 接近 0 或 1 時換算會放大誤差。","邊際分數算不動，就和單元 02 一樣改拿條件分數當答案（去雜訊分數匹配）；條件分數化簡後是 <math aria-label=\"−ε/β_t\"><mrow><mo>−<\/mo><mi>ε<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>，所以網路其實在猜雜訊。","SDE 延伸技巧：加雜訊 <math aria-label=\"σ_t dW_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><mi>d<\/mi><msub><mi>W<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 的同時補上 <math aria-label=\"(σ_t²/2) s_t\"><mrow><mo stretchy=\"false\">(<\/mo><msubsup><mi>σ<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><mo lspace=\"0\" rspace=\"0\">/<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><msub><mi>s<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>，散開與推回一起和 σ² 成正比，邊際路徑不變，理論上 σ 任選。","實務上有訓練誤差與模擬誤差：σ 變大，步數要跟著增加；最佳 σ 要一個個試過去比，ODE 常常就夠好。"],"formulas":[{"id":"f1","title":"條件分數：指回雲的中心","plain":"條件分數指向此刻雲的中心 α_t z；把 x 拆開代入，它就是雜訊反過來再除以 β","parts":[{"m":"<math aria-label=\"s_t(x|z)\"><mrow><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"條件分數：只看一筆資料 z 時的分數"},{"m":"<math aria-label=\"=\"><mrow><mo>=<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"−(x − α_t z)\"><mrow><mo>−<\/mo><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>−<\/mo><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"從位置 x 指回雲的中心 α_t z"},{"m":"<math aria-label=\"/β_t²\"><mrow><mo lspace=\"0\" rspace=\"0\">/<\/mo><msubsup><mi>β<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><\/mrow><\/math>","say":"除以雜訊比例的平方：雲越窄，箭頭越長"},{"m":"<math aria-label=\"=\"><mrow><mo>=<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"−ε/β_t\"><mrow><mo>−<\/mo><mi>ε<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","say":"代入 x＝α_t z＋β_t ε，α_t z 消掉，只剩雜訊反過來再除以 β_t"}],"src":{"lec":"L03A","t":503,"video":92,"slide":"p.8、p.14","note":"p.25 式 (40)、p.31–32"}},{"id":"f2","title":"換個寫法：分數變向量場","plain":"向量場＝分數乘 a＋位置乘 b；a、b 只看時間，直線排程 a＝(1−t)/t、b＝1/t；只限高斯路徑","parts":[{"m":"<math aria-label=\"u_t(x)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"向量場：單元 02 學會的黃箭頭"},{"m":"<math aria-label=\"=\"><mrow><mo>=<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"a_t s_t(x)\"><mrow><msub><mi>a<\/mi><mi>t<\/mi><\/msub><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"分數乘上只看時間的係數 a_t"},{"m":"<math aria-label=\"+\"><mrow><mo>+<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"b_t x\"><mrow><msub><mi>b<\/mi><mi>t<\/mi><\/msub><mi>x<\/mi><\/mrow><\/math>","say":"位置乘上只看時間的係數 b_t"}],"src":{"lec":"L03A","t":594,"video":166,"slide":"p.11、p.12","note":"p.26 Prop. 1"}},{"id":"f3","title":"SDE 延伸技巧：加雜訊，再推回來","plain":"照原本的向量場走，加一段亂抖，同時用分數乘 σ²/2 把散開的推回來；每個時間的分布不變","parts":[{"m":"<math aria-label=\"dX_t\"><mrow><mi>d<\/mi><msub><mi>X<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","say":"一小步的位移"},{"m":"<math aria-label=\"=\"><mrow><mo>=<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"u_t(X_t) dt\"><mrow>< 3:06 說這個概念此時還和機器學習無關。","src":{"lec":"L03A","t":166,"video":40,"slide":"p.7"}},{"id":"q02","type":"choice","dim":"concept","level":2,"prompt":"高斯路徑上，條件分數 <math aria-label=\"∇log p_t(x|z)\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 的箭頭指向哪裡？","choices":["資料點 z 本身","此刻那團高斯雲的中心 <math aria-label=\"α_t z\"><mrow><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><\/mrow><\/math>","原點，也就是雜訊分布的平均","和條件向量場 <math aria-label=\"u_t(x|z)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 完全同一個方向"],"answer":1,"explain":"<math aria-label=\"−(x − α_t z)/β_t²\"><mrow><mo>−<\/mo><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>−<\/mo><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><mo lspace=\"0\" rspace=\"0\">/<\/mo><msubsup><mi>β<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><\/mrow><\/math> 從 x 指回雲的中心 <math aria-label=\"α_t z\"><mrow><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><\/mrow><\/math>。條件向量場要去的是 z 本身，所以兩根箭頭一般不同方向；要到 t 接近 1，<math aria-label=\"α_t z\"><mrow><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><\/mrow><\/math> 才接近 z。","src":{"lec":"L03A","t":503,"video":92,"slide":"p.8","note":"p.25 式 (40)"}},{"id":"q03","type":"choice","dim":"concept","level":3,"prompt":"SDE 延伸技巧裡，為什麼理論上 σ 可以任選？","choices":["σ 通常很小，雜訊的影響可以忽略","網路訓練時已經見過各種 σ，所以都學會了","雜訊平均是 0，加多少都不會改變分布","雜訊散開的量和分數推回的量都和 σ² 成正比，永遠互相抵銷"],"answer":3,"explain":"方框帳：σ 從 1 變 2，流失與推回都放大 4 倍，相加仍是 0。σ 是抽樣時才選，網路不必重新訓練；只加雜訊不補分數項，分布會散開。","src":{"lec":"L03A","t":1658,"video":409,"slide":"p.17"}},{"id":"q04","type":"tf","dim":"concept","level":2,"prompt":"理論上 σ 任選，所以實務上不論 σ 多大，用同樣的步數抽樣，結果都一樣好。","answer":false,"explain":"原片 40:32 說 there's a theory practice gap：網路有訓練誤差，離散化有模擬誤差。σ 變大時步數要跟著增加，最佳 σ 要一個個試過 s<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math>","修正項：用分數把散開的推回來"],["<math aria-label=\"σ_t dW_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><mi>d<\/mi><msub><mi>W<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","亂抖：布朗運動的增量乘上擴散係數"],["<math aria-label=\"σ_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","抽樣時才選的雜訊大小，不必重新訓練"]],"explain":"前兩項合起來是新的漂移，最後一項是雜訊。原片 27:38 的直覺：雜訊往四面八方散開，分數把粒子推回來。","src":{"lec":"L03A","t":1471,"video":340,"slide":"p.18","note":"p.27–28 Theorem 17"}},{"id":"q07","type":"choice","dim":"formula","level":2,"prompt":"在 <math aria-label=\"s_t(x|z) = −(x − α_t z)/β_t²\"><mrow><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mo>−<\/mo><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>−<\/mo><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><mo lspace=\"0\" rspace=\"0\">/<\/mo><msubsup><mi>β<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><\/mrow><\/math> 裡，把 <math aria-label=\"x = α_t z + β_t ε\"><mrow><mi>x<\/mi><mo>=<\/mo><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><mo>+<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><mi>ε<\/mi><\/mrow><\/math> 代進去，會剩下什麼？","choices":["<math aria-label=\"−ε/β_t²\"><mrow><mo>−<\/mo><mi>ε<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><msubsup><mi>β<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><\/mrow><\/math>","<math aria-label=\"z − ε\"><mrow><mi>z<\/mi><mo>−<\/mo><mi>ε<\/mi><\/mrow><\/math>","<math aria-label=\"−ε/β_t\"><mrow><mo>−<\/mo><mi>ε<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","<math aria-label=\"−α_t z/β_t\"><mrow><mo>−<\/mo><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>"],"answer":2,"explain":"<math aria-label=\"x − α_t z = β_t ε\"><mrow><mi>x<\/mi><mo>−<\/mo><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><mo>=<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><mi>ε<\/mi><\/mrow><\/math>，再除以 <math aria-label=\"β_t²\"><mrow><msubsup><mi>β<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><\/mrow><\/math> 只剩 <math aria-label=\"−ε/β_t\"><mrow><mo>−<\/mo><mi>ε<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>：答案就是那顆雜訊反過來再除以 β_t，所以網路其實在猜雜訊（原片 18:42 learning to predict the noise）。<math aria-label=\"z − ε\"><mrow><mi>z<\/mi><mo>−<\/mo><mi>ε<\/mi><\/mrow><\/math> 是單元 02 直線路徑的條件向量場，別混淆。","src":{"lec":"L03A","t":1122,"video":258,"slide":"p.14","note":"p.31–32"}},{"id":"q08","type":"fill","dim":"formula","level":2,"prompt":"高斯路徑上，向量場可以由分數換算：<math aria-label=\"u_t(x) = a_t s_t(x) +\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><msub><mi>a<\/mi><mi>t<\/mi><\/msub><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><\/mrow><\/math> ＿＿（只看時間的係數乘上位置，用符號寫）。","accept":["b_t x","b_t·x","b_t*x","bx","b·x","b*x","b_t(x)x"],"explain":"<math aria-label=\"u_t(x) = a_t s_t(x) + b_t x\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><msub><mi>a<\/mi><mi>t<\/mi><\/msub><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><msub><mi>b<\/mi><mi>t<\/mi><\/msub><mi>x<\/mi><\/mrow><\/math>。直線排程 <math aria-label=\"a_t = (1−t)/t\"><mrow><msub><mi>a<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>t<\/mi><\/mrow><\/math>、<math aria-label=\"b_t = 1/t\"><mrow><msub><mi>b<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mn>1<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>t<\/mi><\/mrow><\/math>；條件版與邊際版都成立，但只限高斯路徑。","src":{"lec":"L03A","t":594,"video":166,"slide":"p.12","note":"p.26 Prop. 1"}},{"id":"q09","type":"tf","dim":"formula","level":3,"prompt":"講義 p.32 把 <math aria-label=\"1/β_t²\"><mrow><mn>1<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><msubsup><mi>β<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><\/mrow><\/math> 當成常數丟掉，得到改猜雜訊的損失。這樣只差一個常數，各時間的樣本在損失裡的權重都沒變。","answer":false,"explain":"<math aria-label=\"1/β_t²\"><mrow><mn>1<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><msubsup><mi>β<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><\/mrow><\/math> 隨 t 變，丟掉它是重新加權：原本權重壓在 t 接近 1、β 很小的樣本上。每個時間的最佳答案不變，但已經不是只差一個常數。投影片 p.15 提到的數值不穩定，原片口頭沒說。","src":{"video":258,"slide":"p.15","note":"p.32"}},{"id":"q10","type":"numeric","dim":"compute","level":1,"prompt":"直線路徑 <math aria-label=\"α_t = t\"><mrow><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mi>t<\/mi><\/mrow><\/math>、<math aria-label=\"β_t = 1−t\"><mrow><msub><mi>β<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mn>1<\/mn><mo>−<\/mo><mi>t<\/mi><\/mrow><\/math>，一維，<math aria-label=\"z = 1\"><mrow><mi>z<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math>、<math aria-label=\"ε = 0.5\"><mrow><mi>ε<\/mi><mo>=<\/mo><mn>0.5<\/mn><\/mrow><\/math>、<math aria-label=\"t = 0.8\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>0.8<\/mn><\/mrow><\/math>。先算 <math aria-label=\"x = α_t z + β_t ε\"><mrow><mi>x<\/mi><mo>=<\/mo><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><mo>+<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><mi>ε<\/mi><\/mrow><\/math>，再算條件分數 <math aria-label=\"s_t(x|z)\"><mrow><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>。","answer":-2.5,"tol":0.001,"calc":"-((0.8*1 + 0.2*0.5) - 0.8*1)/(0.2**2)","explain":"x＝0.8＋0.2×0.5＝0.9；−(0.9−0.8)/0.04＝−2.5。用 −ε/β_t＝−0.5/0.2 也是 −2.5。","src":{"lec":"L03A","t":503,"video":211,"note":"p.25 式 (40)"}},{"id":"q11","type":"numeric","dim":"compute","level":2,"prompt":"一維，雜訊固定為 <math aria-label=\"ε = 1\"><mrow><mi>ε<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math>，直線路徑 <math aria-label=\"β_t = 1−t\"><mrow><msub><mi>β<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mn>1<\/mn><mo>−<\/mo><mi>t<\/mi><\/mrow><\/math>。<math aria-label=\"t = 0.99\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>0.99<\/mn><\/mrow><\/math> 時的條件分數 <math aria-label=\"−ε/β_t\"><mrow><mo>−<\/mo><mi>ε<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>，大小是 <math aria-label=\"t = 0.5\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>0.5<\/mn><\/mrow><\/math> 時的幾倍？","answer":50,"tol":0.01,"calc":"(1/(1-0.99))/(1/(1-0.5))","explain":"β 從 0.5 縮到 0.01，縮了 50 倍，分數就放大 50 倍。直接回歸分數時，t 接近 1 的答案大得不像話，損失會出現巨大尖峰；改猜大小固定的 ε，訓練穩定很多。","src":{"video":258,"slide":"p.15","note":"p.32"}},{"id":"q12","type":"numeric","dim":"compute","level":2,"prompt":"直線排程 <math aria-label=\"a_t = (1−t)/t\"><mrow><msub><mi>a<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>t<\/mi><\/mrow><\/math>、<math aria-label=\"b_t = 1/t\"><mrow><msub><mi>b<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mn>1<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>t<\/mi><\/mrow><\/math>。在 <math aria-label=\"t = 0.25\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>0.25<\/mn><\/mrow><\/math>、<math aria-label=\"x = 2\"><mrow><mi>x<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><\/math>、分數 <math aria-label=\"s = −1\"><mrow><mi>s<\/mi><mo>=<\/mo><mo>−<\/mo><mn>1<\/mn><\/mrow><\/math> 的地方，換算出的向量場 <math aria-label=\"u = a_t s + b_t x\"><mrow><mi>u<\/mi><mo>=<\/mo><msub><mi>a<\/mi><mi>t<\/mi><\/msub><mi>s<\/mi><mo>+<\/mo><msub><mi>b<\/mi><mi>t<\/mi><\/msub><mi>x<\/mi><\/mrow><\/math> 是多少？","answer":5,"tol":0.001,"calc":"((1-0.25)/0.25)*(-1) + (1/0.25)*2","explain":"a＝0.75/0.25＝3、b＝4，所以 3×(−1)＋4×2＝5。可反推驗證：這組數字對應 z＝5.75，(z−x)/(1−t)＝3.75/0.75＝5，和單元 02 的條件向量場一致。","src":{"lec":"L03A","t":594,"video":166,"slide":"p.12"}},{"id":"q13","type":"numeric","dim":"compute","level":3,"prompt":"用 SDE 延伸技巧走一步（一維）：<math aria-label=\"X_t = 1\"><mrow><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math>、<math aria-label=\"h = 0.1\"><mrow><mi>h<\/mi><mo>=<\/mo><mn>0.1<\/mn><\/mrow><\/math>、<math aria-label=\"u_t(X_t) = 0.5\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0.5<\/mn><\/mrow><\/math>、<math aria-label=\"s_t(X_t) = −2\"><mrow><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mo>−<\/mo><mn>2<\/mn><\/mrow><\/math>、<math aria-label=\"σ_t = 1\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math>、抽到 <math aria-label=\"ε = 0.3\"><mrow><mi>ε<\/mi><mo>=<\/mo><mn>0.3<\/mn><\/mrow><\/math>。依 <math aria-label=\"X_{t+h} = X_t + h[u_t + (σ_t²/2) s_t] + σ_t √h ε\"><mrow><msub><mi>X<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mi>h<\/mi><\/mrow><\/msub><mo>=<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo>+<\/mo><mi>h<\/mi><mo stretchy=\"false\">[<\/mo><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo>+<\/mo><mo stretchy=\"false\">(<\/mo><msubsup><mi>σ<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><mo lspace=\"0\" rspace=\"0\">/<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">]<\/mo><mo>+<\/mo><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><msqrt><mi>h<\/mi><\/msqrt><mi>ε<\/mi><\/mrow><\/math>，<math aria-label=\"X_{t+h}\"><mrow><msub><mi>X<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mi>h<\/mi><\/mrow><\/msub><\/mrow><\/math> 是多少？（取到小數第三位）","answer":1.045,"tol":0.001,"calc":"1 + 0.1*(0.5 + (1**2/2)*(-2)) + 1*sqrt(0.1)*0.3","explain":"漂移 0.5＋0.5×(−2)＝−0.5，走 h 得 −0.05；亂抖 1×√0.1×0.3≈0.0949。合計 1−0.05＋0.0949≈1.045。修正項把原本往外的 0.5 拉成往回的 −0.5。","src":{"lec":"L03A","t":2305,"video":340,"slide":"p.18","note":"p.33"}},{"id":"q14","type":"order","dim":"compute","level":1,"prompt":"把去雜訊分數匹配（改猜雜訊的寫法）的一次訓練步驟排好順序。","items":["抽一筆資料 z、一個時間 t、一顆標準高斯雜訊 ε","組出加雜訊的位置 <math aria-label=\"x = α_t z + β_t ε\"><mrow><mi>x<\/mi><mo>=<\/mo><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><mo>+<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><mi>ε<\/mi><\/mrow><\/math>","把 x 和 t 餵給網路，得到 <math aria-label=\"s_t^θ(x)\"><mrow><msubsup><mi>s<\/mi><mi>t<\/mi><mi>θ<\/mi><\/msubsup><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","和答案 <math aria-label=\"−ε/β_t\"><mrow><mo>−<\/mo><mi>ε<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 比，算平方誤差","依損失更新參數 θ"],"explain":"和單元 02 的訓練流程一樣，只是答案從條件向量場換成條件分數 <math aria-label=\"−ε/β_t\"><mrow><mo>−<\/mo><mi>ε<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>。原片 18:25 說同樣把抽 x 改寫成先抽雜訊再加上去。","src":{"lec":"L03A","t":1105,"video":211,"slide":"p.15","note":"p.32 Algorithm 4"}},{"id":"q15","type":"match","dim":"term","level":1,"prompt":"把符號配上名稱。","pairs":[["<math aria-label=\"∇log p_t(x|z)\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","條件分數 conditional score"],["<math aria-label=\"∇log p_t(x)\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","邊際分數 marginal score"],["<math aria-label=\"p_t(z|x)\"><mrow><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","後驗 posterior"],["<math aria-label=\"s_t^θ\"><mrow><msubsup><mi>s<\/mi><mi>t<\/mi><mi>θ<\/mi><\/msubsup><\/mrow><\/math>","分數網路 score network"],["<math aria-label=\"ε_t^θ\"><mrow><msubsup><mi>ε<\/mi><mi>t<\/mi><mi>θ<\/mi><\/msubsup><\/mrow><\/math>","雜訊預測網路 noise predictor"]],"explain":"兩種分數都是對 x 取梯度；後驗是邊際分數投票時的份量；<math aria-label=\"ε_t^θ = −β_t s_t^θ\"><mrow><msubsup><mi>ε<\/mi><mi>t<\/mi><mi>θ<\/mi><\/msubsup><mo>=<\/mo><mo>−<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><msubsup><mi>s<\/mi><mi>t<\/mi><mi>θ<\/mi><\/msubsup><\/mrow><\/math>，兩個網路只差一個倍數。noise predictor 這個詞口頭沒說，在投影片與講義。","src":{"lec":"L03A","t":306,"video":92,"slide":"p.10","note":"p.25 式 (38)(39)"}},{"id":"q16","type":"fill","dim":"term","level":1,"prompt":"加雜訊、同時用分數推回來的技巧，講者自己取名為 SDE ＿＿ trick。","accept":["extension","延伸"],"explain":"原片 21:28：「I call this the SDE extension trick, but that's really my naming.」（自動字幕寫成 SCE）中文是 SDE 延伸技巧；它本身不限高斯路徑。","src":{"lec":"L03A","t":1288,"video":340}},{"id":"q17","type":"listen","dim":"listen","level":2,"prompt":"學生說雜訊把粒子推離資料。聽講者接著說 score function 做了什麼？","clip":{"lec":"L03A","t":1714,"dur":6},"choices":["pushes you back","pushes you away","pulls you apart","slows you down"],"answer":0,"explain":"原句：「The noise term pushes you away from the data manifold. The score function pushes you back effectively.」雜訊把粒子推離資料，分數把它推回來；pushes you away 是講雜訊那一項。","src":{"lec":"L03A","t":1714,"video":409}},{"id":"q18","type":"listen","dim":"listen","level":2,"prompt":"講者比較分數與向量場：沒有本質差別，只是一種什麼？選出聽到的詞。","clip":{"lec":"L03A","t":670,"dur":8},"choices":["regularization","reparameterization","renormalization","approximation"],"answer":1,"explain":"原句：「at least for now not that different, okay, there's no qualitative difference, it's a reparameterization」。重新參數化：同一件事換個寫法，限高斯路徑。","src":{"lec":"L03A","t":670,"video":166}},{"id":"q19","type":"choice","dim":"link","level":2,"prompt":"單元 02 的 flow matching：邊際向量場算不動，就拿條件向量場當答案，網路自然停在平均。本單元哪一步用的是同一招？","choices":["SDE 延伸技巧：加雜訊同時補上分數項","重新參數化：把分數換算成向量場","去雜訊分數匹配：每次拿條件分數當答案，網路停在平均，也就是邊際分數","Langevin 動力學：把向量場設成 0"],"answer":2,"explain":"對照單元 02：L_FM 算不動就改用 L_CFM，兩者只差與 θ 無關的常數。本單元的 L_SM 與 L_CSM 完全同理，原片 14:39 說這正是 flow matching 損失與條件 flow matching 損失的類比。","src":{"lec":"L03A","t":879,"video":211,"slide":"p.14","note":"p.31 Theorem 22"}},{"id":"q20","type":"tf","dim":"link","level":2,"prompt":"單元 01 學過 SDE <math aria-label=\"dX_t = u_t(X_t) dt + σ_t dW_t\"><mrow><mi>d<\/mi><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><mi>d<\/mi><mi>t<\/mi><mo>+<\/mo><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><mi>d<\/mi><msub><mi>W<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>。把單元 02 訓練好的 <math aria-label=\"u_t\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 原封不動放進去、只多加 <math aria-label=\"σ_t dW_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><mi>d<\/mi><msub><mi>W<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>，每個時間的分布仍會是 <math aria-label=\"p_t\"><mrow><msub><mi>p<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>。","answer":false,"explain":"對照單元 01、02：只加雜訊會讓分布散開，螺旋糊掉。原片 23:12 問這樣會不會成立，24:00 答會改變，所以漂移要換成 <math aria-label=\"u_t + (σ_t²/2) s_t\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo>+<\/mo><mo stretchy=\"false\">(<\/mo><msubsup><mi>σ<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><mo lspace=\"0\" rspace=\"0\">/<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><msub><mi>s<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>。SDE 抽樣少不了分數。","src":{"lec":"L03A","t":1392,"video":340}}],"rubric":{"concept":["能說出分數是一根箭頭，指向機率變大最快的方向，不是機率本身。","能分辨條件分數指向 <math aria-label=\"α_t z\"><mrow><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><\/mrow><\/math>，邊際分數是按後驗份量投票的結果。","能解釋只加雜訊為何讓分布散開，以及補上分數項為何能拉回來。","能說明 σ 理論上任選的理由，並指出實務上步數與誤差的限制。"],"formula":["能指出 <math aria-label=\"s_t\"><mrow><msub><mi>s<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>、<math aria-label=\"u_t\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>、<math aria-label=\"σ_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 分別代表分數、向量場、雜訊大小。","能把 <math aria-label=\"x = α_t z + β_t ε\"><mrow><mi>x<\/mi><mo>=<\/mo><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><mo>+<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><mi>ε<\/mi><\/mrow><\/math> 代入條件分數，化簡出 <math aria-label=\"−ε/β_t\"><mrow><mo>−<\/mo><mi>ε<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>。","能說出 SDE 延伸技巧每一項的作用，以及 a_t、b_t 只看時間。","能指出換算只限高斯路徑，丟掉 <math aria-label=\"1/β_t²\"><mrow><mn>1<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><msubsup><mi>β<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><\/mrow><\/math> 是重新加權而非常數。"],"compute":["能照直線路徑代數字，算出位置 x 與條件分數。","能用兩種寫法算條件分數並確認相同，再代 a、b 換算出向量場。","能算出 β_t 變小時分數放大的倍數，說明 t 接近 1 為何不穩定。","能手算一步含修正項的 SDE 更新，並說出 σ 加倍時兩邊放大 4 倍。"],"term":["能說出 score function、gradient 的中文意思。","能把 <math aria-label=\"∇log p_t(x|z)\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>、<math aria-label=\"∇log p_t(x)\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 分別對上條件與邊際分數。","能分辨 noise predictor、posterior 各指什麼。","能用中英術語說清去雜訊分數匹配與 SDE 延伸技巧的分工。"],"listen":["看英文字幕時，能認出 score、gradient、SDE 等關鍵字。","不看字幕能聽出 brushing over、theory practice gap。","能聽懂 28:34 講者用 push back 說明分數的作用。","能把自動字幕的誤聽（a blade、SCE）還原成講者原意。"],"link":["能說出本單元沿用單元 02 的條件、邊際兩層架構。","能指出去雜訊分數匹配和單元 02 的條件流匹配是同一招。","能說明單元 01 的 SDE 直接加雜訊為何不夠，必須補上分數項。","能串起單元 01–03：ODE 抽樣、流匹配、換算成分數、再用 SDE 抽樣。"]},"cards":[{"id":"c1","deck":"formula","front":"條件分數：<math aria-label=\"s_t(x|z) = −(x − α_t z)/\"><mrow><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mo>−<\/mo><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>−<\/mo><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><mo lspace=\"0\" rspace=\"0\">/<\/mo><\/mrow><\/math>＿＿","back":"<math aria-label=\"β_t²\"><mrow><msubsup><mi>β<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><\/mrow><\/math>：雜訊比例的平方；雲越窄，箭頭越長"},{"id":"c2","deck":"formula","front":"代入 <math aria-label=\"x = α_t z + β_t ε\"><mrow><mi>x<\/mi><mo>=<\/mo><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><mo>+<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><mi>ε<\/mi><\/mrow><\/math> 後，條件分數＝＿＿","back":"<math aria-label=\"−ε/β_t\"><mrow><mo>−<\/mo><mi>ε<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>：雜訊反過來，再除以 β_t"},{"id":"c3","deck":"formula","front":"高斯路徑換算：<math aria-label=\"u_t(x) =\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><\/mrow><\/math> ＿＿ <math aria-label=\"+ b_t x\"><mrow><mo>+<\/mo><msub><mi>b<\/mi><mi>t<\/mi><\/msub><mi>x<\/mi><\/mrow><\/math>","back":"<math aria-label=\"a_t s_t(x)\"><mrow><msub><mi>a<\/mi><mi>t<\/mi><\/msub><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>；直線排程 <math aria-label=\"a_t = (1−t)/t\"><mrow><msub><mi>a<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>t<\/mi><\/mrow><\/math>、<math aria-label=\"b_t = 1/t\"><mrow><msub><mi>b<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mn>1<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>t<\/mi><\/mrow><\/math>"},{"id":"c4","deck":"formula","front":"SDE 延伸技巧：<math aria-label=\"dX_t = [u_t(X_t) +\"><mrow><mi>d<\/mi><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mo stretchy=\"false\">[<\/mo><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><\/mrow><\/math> ＿＿<math aria-label=\"] dt + σ_t dW_t\"><mrow><mo stretchy=\"false\">]<\/mo><mi>d<\/mi><mi>t<\/mi><mo>+<\/mo><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><mi>d<\/mi><msub><mi>W<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","back":"<math aria-label=\"(σ_t²/2) s_t(X_t)\"><mrow><mo stretchy=\"false\">(<\/mo><msubsup><mi>σ<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><mo lspace=\"0\" rspace=\"0\">/<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>：用分數把雜訊散開的部分推回來"},{"id":"c5","deck":"formula","front":"雜訊預測網路與分數網路：<math aria-label=\"ε_t^θ =\"><mrow><msubsup><mi>ε<\/mi><mi>t<\/mi><mi>θ<\/mi><\/msubsup><mo>=<\/mo><\/mrow><\/math> ＿＿","back":"<math aria-label=\"−β_t s_t^θ\"><mrow><mo>−<\/mo><msub><mi>β<\/mi><mi>t<\/mi><\/msub><msubsup><mi>s<\/mi><mi>t<\/mi><mi>θ<\/mi><\/msubsup><\/mrow><\/math>：兩者只差一個倍數"},{"id":"c6","deck":"term","front":"noise predictor","back":"雜訊預測網路：改猜加進去的雜訊 ε；大小固定，訓練較穩（口頭沒說，見投影片 p.15）"},{"id":"c7","deck":"term","front":"posterior","back":"後驗 <math aria-label=\"p_t(z|x)\"><mrow><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>：站在 x 時，相信自己來自哪一筆 z 的程度"},{"id":"c8","deck":"term","front":"Fokker–Planck equation","back":"Fokker–Planck 方程式：連續方程式多一個散開項；增加＝流入－流出，聽過就好"},{"id":"c9","deck":"term","front":"Langevin dynamics","back":"Langevin 動力學：向量場為 0、分布固定時的 SDE 特例；原片旁支"}]},"answer":"<strong>分數是指向機率變大的箭頭。在高斯路徑上，它和向量場只差一次換算。雜訊把粒子往外散，分數把它推回來，兩邊和 σ² 一起變大、剛好抵銷，所以理論上 σ 任選；實務上步數要跟著增加。<\/strong>","status":"live"},{"no":"04","title":"無分類器引導","lecture":"L03B","youtube":"lAkPQQ0XjDk","topic":"classifier-free guidance","range":null,"question":"怎麼讓模型更聽提示的話？代價是什麼？","timeline":[[0,"片頭"],[14,"小節 1｜把提示放進去"],[68,"小節 2｜理論上做完了"],[114,"小節 3｜拆出提示的部分"],[169,"小節 4｜放大它"],[216,"小節 5｜分類器消失"],[286,"小節 6｜一個網路，偶爾不告訴它"],[345,"小節 7｜轉大之後，樣本去哪"],[435,"小節 8｜得到什麼，失去什麼"],[503,"小節 9｜打開原片看哪裡"]],"sheet":"<p><a href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\">打開原片<\/a>。建議用<a href=\"#L03B\" data-lec=\"L03B\">原片字幕頁<\/a>，可逐句重聽、調慢速度；公式以投影片與講義為準。<\/p>\n<h3>看前導片之前：先答一次<\/h3>\n<p>先寫下答案，不查資料。看完原片後再答同樣三題，比較自己的差異。<\/p>\n<ol><li>w=1 時，引導後的向量場等於哪一根箭頭？w=0 呢？<\/li><li>沒有訓練分類器，為什麼還能得到放大分類器的效果？訓練時要多做哪一件事？<\/li><li>w 變大，樣本會停在資料團的中心嗎？得到什麼，失去什麼？<\/li><\/ol>\n<h3>今天的八個詞<\/h3>\n<div class=\"table-wrap vocab\"><table><thead><tr><th>中文<\/th><th>英文<\/th><th>符號<\/th><th>白話<\/th><\/tr><\/thead><tbody><tr><td>提示<\/td><td>prompt<\/td><td><math aria-label=\"y\"><mrow><mi>y<\/mi><\/mrow><\/math><\/td><td>你告訴模型要什麼；可以是類別或一句文字<\/td><\/tr><tr><td>引導向量場<\/td><td>guided vector field<\/td><td><math aria-label=\"u_t(x|y)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>多看提示的箭頭<\/td><\/tr><tr><td>基本引導<\/td><td>vanilla guidance<\/td><td><math aria-label=\"w=1\"><mrow><mi>w<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math><\/td><td>只把 y 多餵給網路，其他都不變<\/td><\/tr><tr><td>分類器<\/td><td>classifier<\/td><td><math aria-label=\"p_t(y|x)\"><mrow><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>看一眼（有雜訊的）資料，猜它是哪一類<\/td><\/tr><tr><td>分類器引導<\/td><td>classifier guidance<\/td><td><math aria-label=\"u(x)+w a_t∇log p_t(y|x)\"><mrow><mi>u<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mi>w<\/mi><msub><mi>a<\/mi><mi>t<\/mi><\/msub><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>把分類器那一塊放大；要多訓練一個模型<\/td><\/tr><tr><td>引導強度<\/td><td>guidance scale<\/td><td><math aria-label=\"w\"><mrow><mi>w<\/mi><\/mrow><\/math><\/td><td>提示要放大幾倍；1 是不放大<\/td><\/tr><tr><td>無分類器引導<\/td><td>classifier-free guidance（CFG）<\/td><td><math aria-label=\"(1−w)u(x|∅)+w u(x|y)\"><mrow><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>w<\/mi><mo stretchy=\"false\">)<\/mo><mi>u<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>∅<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mi>w<\/mi><mi>u<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>用兩根箭頭的差取代分類器<\/td><\/tr><tr><td>空標記<\/td><td>empty token<\/td><td><math aria-label=\"∅\"><mrow><mi>∅<\/mi><\/mrow><\/math><\/td><td>告訴網路「這次沒有提示」；訓練時偶爾蓋掉標籤<\/td><\/tr><\/tbody><\/table><\/div>\n<p>注意：<strong>conditional<\/strong> 在本系列指一筆資料 z；對提示 y 用 <strong>guided<\/strong>。原片兩種都說 conditional。<\/p>\n<h3>聽得出這三個詞<\/h3>\n<ul class=\"checks\"><li class=\"check\"><input type=\"checkbox\" id=\"chk-04-1\"><label for=\"chk-04-1\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=376s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"376\">06:16<\/a>：reinforce，加強；要想辦法讓模型更聽提示<\/label><\/li><li class=\"check\"><input type=\"checkbox\" id=\"chk-04-2\"><label for=\"chk-04-2\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=2023s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"2023\">33:43<\/a>：heuristic，經驗做法；有道理，但沒有保證<\/label><\/li><li class=\"check\"><input type=\"checkbox\" id=\"chk-04-3\"><label for=\"chk-04-3\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=2221s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"2221\">37:01<\/a>：collapse to the modes，擠到少數幾團；<a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=2055s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"2055\">34:15<\/a> 也這樣說。不是收到峰頂<\/label><\/li><\/ul>\n<h3>原片導航<\/h3>\n<div class=\"table-wrap nav-table\"><table><thead><tr><th>時間<\/th><th>看什麼<\/th><\/tr><\/thead><tbody><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=333s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"333\">05:33<\/a><\/td><td>為什麼還不夠<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtu  target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"2281\">38:01<\/a><\/td><td>下一堂<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=389s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"389\">06:29<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=469s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"469\">07:49<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=2155s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"2155\">35:55<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=2239s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"2239\">37:19<\/a><\/td><td>兩段問答，第一次可略過<\/td><\/tr><tr><td>投影片 p.38–43<\/td><td>這堂沒講（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=2272s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"2272\">37:52<\/a>）；查文獻看講義 Appendix E<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>四個陷阱<\/h3>\n<ol><li><strong>conditional<\/strong>：<a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=232s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"232\">03:52<\/a> 指 z；<a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=323s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"323\">05:23<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=1914s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"1914\">31:54<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=2255s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"2255\">37:35<\/a> 指提示 y。<\/li><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=1987s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"1987\">33:07<\/a> 的「放大 3 倍」是從看提示的箭頭多加 3 份；從不看提示的箭頭算是 4 倍，兩者相同。<\/li><li>投影片 p.37 的三團圖不是 CFG 的樣本，是原論文的傾斜密度。<\/li><li>本課 w=1 是基本引導；原論文的 w 差 1（論文的 w=0 才是不引導，論文 w=3＝本課 w=4）。<\/li><\/ol>\n<h3>練習：算一根箭頭<\/h3>\n<p>同一個點、同一個時間，網路給了兩根箭頭（一維）：不看提示 u(x|∅)=0.2，看提示 u(x|y)=1.0。<\/p>\n<ol><li>提示的部分（兩者的差）是多少？<\/li><li>用 ũ=(1−w)u(x|∅)+w u(x|y) 算 w=0、1、4 的 ũ。<\/li><li>用 u(x|y)+(w−1)(差) 再算一次 w=4，確認相同；再算錯誤寫法 u(x|∅)+(w−1)(差)，看差多少。<\/li><\/ol>\n<details class=\"answers\"><summary>參考答案（先自己答，再打開）<\/summary>\n<ol><li>w=1 時就是看提示的箭頭 u(x|y)，也就是基本引導；w=0 時只剩不看提示的箭頭 u(x|∅)。所以 w=1 不是「沒有引導」，w=0 才是。<\/li><li>分類器那一塊（乘上 a_t 之後）剛好等於「看提示的箭頭減掉不看提示的箭頭」，代進放大的式子後，分類器就消失了，只剩兩根向量場加權相加。兩根箭頭由同一個網路給：訓練時偶爾把標籤蓋成空標記 ∅。一次都不蓋，不看提示的那一支從沒練過，放大後就壞掉。免的只有分類器。代價是抽樣時每步要呼叫網路兩次，網路的小誤差也會被 w 放大。<\/li><li>不會。樣本越過團的中心繼續往外，只在分得出類別的方向變窄，與類別無關的方向不變。得到：比資料本身還對題（片中標錯的比例從 0.196 降到 0.0033）。失去：與別類共用、完全正當的那一部分也被抽乾（0.512 降到 0.005），樣本不再來自原本的資料分布。w 該多大沒有通則。<\/li><\/ol>\n<p><strong>練習答案<\/strong>：差＝1.0−0.2＝0.8。w=0：0.2；w=1：1.0；w=4：(1−4)×0.2＋4×1.0＝3.4。u(x|y)+3×0.8＝3.4，相同。錯誤寫法 0.2＋3×0.8＝2.6，差 0.8，剛好少了一份差。<\/p>\n<p>片中粒子、兩團、螺旋與小網路都是簡化模型，只用來看機制，不代表真實影像模型的表現；高維、真實圖片與文字提示沒有驗證。練習的 0.2、1.0 是手設的教學例，不來自計算結果，也不在影片畫面。<\/p>\n<\/details>","duration":"9:51","thumb":"data/thumb_04.jpg","ws":{"intro":"<p><a href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\">打開原片<\/a>。建議用<a href=\"#L03B\" data-lec=\"L03B\">原片字幕頁<\/a>，可逐句重聽、調慢速度；公式以投影片與講義為準。<\/p>","pre":["w=1 時，引導後的向量場等於哪一根箭頭？w=0 呢？","沒有訓練分類器，為什麼還能得到放大分類器的效果？訓練時要多做哪一件事？","w 變大，樣本會停在資料團的中心嗎？得到什麼，失去什麼？"],"preNote":"<p>先寫下答案，不查資料。看完原片後再答同樣三題，比較自己的差異。<\/p>","words":[["提示","prompt","<math aria-label=\"y\"><mrow><mi>y<\/mi><\/mrow><\/math>","你告訴模型要什麼；可以是類別或一句文字"],["引導向量場","guided vector field","<math aria-label=\"u_t(x|y)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","多看提示的箭頭"],["基本引導","vanilla guidance","<math aria-label=\"w=1\"><mrow><mi>w<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math>","只把 y 多餵給網路，其他都不變"],["分類器","classifier","<math aria-label=\"p_t(y|x)\"><mrow><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","看一眼（有雜訊的）資料，猜它是哪一類"],["分類器引導","classifier guidance","<math aria-label=\"u(x)+w a_t∇log p_t(y|x)\"><mrow><mi>u<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mi>w<\/mi><msub><mi>a<\/mi><mi>t<\/mi><\/msub><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","把分類器那一塊放大；要多訓練一個模型"],["引導強度","guidance scale","<math aria-label=\"w\"><mrow><mi>w<\/mi><\/mrow><\/math>","提示要放大幾倍；1 是不放大"],["無分類器引導","classifier-free guidance（CFG）","<math aria-label=\"(1−w)u(x|∅)+w u(x|y)\"><mrow><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>w<\/mi><mo stretchy=\"false\">)<\/mo><mi>u<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>∅<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mi>w<\/mi><mi>u<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","用兩根箭頭的差取代分類器"],["空標記","empty token","<math aria-label=\"∅\"><mrow><mi>∅<\/mi><\/mrow><\/math>","告訴網路「這次沒有提示」；訓練時偶爾蓋掉標籤"]],"listen":[{"t":376,"lec":"L03B","word":"reinforce","gloss":"加強；要想辦法讓模型更聽提示"},{"t":2023,"lec":"L03B","word":"heuristic","gloss":"經驗做法；有道理，但沒有保證"},{"t":2221,"lec":"L03B","word":"collapse to the modes","gloss":"擠到少數幾團；<a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=2055s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"2055\">34:15<\/a> 也這樣說。不是收到峰頂"}],"nav":[{"t":333,"lec":"L03B","text":"為什麼還不夠","plain":"為什麼還不夠"},{"t":554,"lec":"L03B","text":"貝氏定理","plain":"貝氏定理"},{"t":917,"lec":"L03B","text":"放大分類器那一塊","plain":"放大分類器那一塊"},{"t":1139,"lec":"L03B","text":"分類器的麻煩","plain":"分類器的麻煩"},{"t":1260,"lec":"L03B","text":"無分類器引導 CFG","plain":"無分類器引導 CFG"},{"t":1564,"lec":"L03B","text":"w=1 會怎樣","plain":"w=1 會怎樣"},{"t":1643,"lec":"L03B","text":"空標記","plain":"空標記"},{"t":1804,"lec":"L03B","text":"成果對比（在原片看）","plain":"成果對比（在原片看）"},{"t":1856,"lec":"L03B","text":"訓練時丟標籤","plain":"訓練時丟標籤"},{"t":2023,"lec":"L03B","text":"經驗做法","plain":"經驗做法"},{"t":2248,"lec":"L03B","text":"每步兩次呼叫","plain":"每步兩次呼叫"},{"t":2281,"lec":"L03B","text":"下一堂","plain":"下一堂"},{"t":389,"lec":"L03B","text":"兩段問答，第一次可略過","plain":"兩段問答，第一次可略過"}],"navNote":"<h3>四個陷阱<\/h3>\n<ol><li><strong>conditional<\/strong>：<a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=232s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"232\">03:52<\/a> 指 z；<a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=323s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"323\">05:23<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=1914s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"1914\">31:54<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=2255s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"2255\">37:35<\/a> 指提示 y。<\/li><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=8oWZ1bHwyRI&amp;t=1987s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L03B\" data-t=\"1987\">33:07<\/a> 的「放大 3 倍」是從看提示的箭頭多加 3 份；從不看提示的箭頭算是 4 倍，兩者相同。<\/li><li>投影片 p.37 的三團圖不是 CFG 的樣本，是原論文的傾斜密度。<\/li><li>本課 w=1 是基本引導；原論文的 w 差 1（論文的 w=0 才是不引導，論文 w=3＝本課 w=4）。<\/li><\/ol>","practice":{"title":"練習：算一根箭頭","html":"<p>同一個點、同一個時間，網路給了兩根箭頭（一維）：不看提示 u(x|∅)=0.2，看提示 u(x|y)=1.0。<\/p>\n<ol><li>提示的部分（兩者的差）是多少？<\/li><li>用 ũ=(1−w)u(x|∅)+w u(x|y) 算 w=0、1、4 的 ũ。<\/li><li>用 u(x|y)+(w−1)(差) 再算一次 w=4，確認相同；再算錯誤寫法 u(x|∅)+(w−1)(差)，看差多少。<\/li><\/ol>"},"answers":["w=1 時就是看提示的箭頭 u(x|y)，也就是基本引導；w=0 時只剩不看提示的箭頭 u(x|∅)。所以 w=1 不是「沒有引導」，w=0 才是。","分類器那一塊（乘上 a_t 之後）剛好等於「看提示的箭頭減掉不看提示的箭頭」，代進放大的式子後，分類器就消失了，只剩兩根向量場加權相加。兩根箭頭由同一個網路給：訓練時偶爾把標籤蓋成空標記 ∅。一次都不蓋，不看提示的那一支從沒練過，放大後就壞掉。免的只有分類器。代價是抽樣時每步要呼叫網路兩次，網路的小誤差也會被 w 放大。","不會。樣本越過團的中心繼續往外，只在分得出類別的方向變窄，與類別無關的方向不變。得到：比資料本身還對題（片中標錯的比例從 0.196 降到 0.0033）。失去：與別類共用、完全正當的那一部分也被抽乾（0.512 降到 0.005），樣本不再來自原本的資料分布。w 該多大沒有通則。"],"answerExtra":"<p><strong>練習答案<\/strong>：差＝1.0−0.2＝0.8。w=0：0.2；w=1：1.0；w=4：(1−4)×0.2＋4×1.0＝3.4。u(x|y)+3×0.8＝3.4，相同。錯誤寫法 0.2＋3×0.8＝2.6，差 0.8，剛好少了一份差。<\/p>\n<p>片中粒子、兩團、螺旋與小網路都是簡化模型，只用來看機制，不代表真實影像模型的表現；高維、真實圖片與文字提示沒有驗證。練習的 0.2、1.0 是手設的教學例，不來自計算結果，也不在影片畫面。<\/p>","extra":[]},"learn":{"unit":"04","notes":{"keypoints":["基本引導只是把提示 <math aria-label=\"y\"><mrow><mi>y<\/mi><\/mrow><\/math> 多餵給網路：資料變成（資料, 提示）成對，損失與抽樣流程照舊。理論上這樣就已抽自 <math aria-label=\"p_data(x|y)\"><mrow><msub><mi>p<\/mi><mi>data<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>，實際上樣本卻不夠聽提示。","用貝氏定理取 log 再對 x 取梯度，引導分數拆成「不看提示的分數」加「分類器的梯度」；<math aria-label=\"∇log p_t(y)\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 不含 x，梯度是 0。只有分類器那一項跟提示有關。","在高斯路徑上乘 <math aria-label=\"a_t\"><mrow><msub><mi>a<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 就換成向量場：<math aria-label=\"u_t(x|y) = u_t(x) + a_t ∇log p_t(y|x)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><msub><mi>a<\/mi><mi>t<\/mi><\/msub><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>。把分類器那一項放大 w 倍是分類器引導，但要另外訓練一個看得懂有雜訊資料的分類器，提示是文字時更難。","無分類器引導（CFG）把分類器那一項換成兩根箭頭的差，整理成 <math aria-label=\"ũ = (1−w) u_t(x|∅) + w u_t(x|y)\"><mrow><mi>ũ<\/mi><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>w<\/mi><mo stretchy=\"false\">)<\/mo><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>∅<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mi>w<\/mi><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>。w=1 是基本引導，w=0 是不看提示；免掉的只有分類器。","兩根箭頭來自同一個網路：訓練時以機率 η 把標籤換成空標記 ∅，抽樣時每步呼叫網路兩次。","CFG 是經驗做法（heuristic）：w 變大，樣本更對題，但會越過團的中心往外、在分得出類別的方向變窄、失去多樣性，不再來自原本的資料分布。w 該多大沒有通則。"],"formulas":[{"id":"f1","title":"把引導分數拆成兩塊","plain":"看提示的分數＝不看提示的分數＋分類器的梯度；p_t(y) 不含 x，取梯度後消失","parts":[{"m":"<math aria-label=\"∇log p_t(x|y)\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"引導分數：看了提示之後，機率變大的方向"},{"m":"<math aria-label=\"=\"><mrow><mo>=<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"∇log p_t(x)\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"不看提示的分數，與提示無關"},{"m":"<math aria-label=\"+\"><mrow><mo>+<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"∇log p_t(y|x)\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"分類器的梯度：唯一跟提示有關的一塊"}],"src":{"lec":"L03B","t":660,"video":114,"slide":"p.28","note":"p.36 式 (60)(61)"}},{"id":"f2","title":"把提示的部分放大 w 倍（分類器引導）","plain":"不看提示的箭頭，加上 w 倍的分類器那一塊；換算係數 a_t 只在高斯路徑上成立","parts":[{"m":"<math aria-label=\"ũ_t(x|y)\"><mrow><msub><mi>ũ<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"放大提示之後的箭頭"},{"m":"<math aria-label=\"=\"><mrow><mo>=<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"u_t(x)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"不看提示的箭頭"},{"m":"<math aria-label=\"+\"><mrow><mo>+<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"w\"><mrow><mi>w<\/mi><\/mrow><\/math>","say":"引導強度：提示放大幾倍"},{"m":"<math aria-label=\"a_t\"><mrow><msub><mi>a<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","say":"分數換成向量場的係數，只限高斯路徑"},{"m":"<math aria-label=\"∇log p_t(y|x)\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"分類器的梯度，要另外訓練一個分類器才拿得到"}],"src":{"lec":"L03B","t":980,"video":169,"slide":"p.29","note":"p.36 式 (59)、p.37 式 (62)"}},{"id":"f3","title":"無分類器引導：兩根箭頭加權相加","plain":"分類器那一塊換成兩根箭頭的差，分類器就消失了；w=1 回到基本引導，w=0 只剩不看提示的箭頭","parts":[{"m":"<math aria-label=\"ũ_t(x|y)\"><mrow><msub><mi>ũ<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"抽樣時真正拿來走的箭頭"},{"m":"<math aria-label=\"=\"><mrow><mo>=<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"(1−w)\"><mrow><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>w<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"不看提示那根的權重；w&gt;1 時是負的，等於把它減掉"},{"m":"<math aria-label=\"u_t(x|∅)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>∅<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"提示換成空標記時，同一個網路給的箭頭"},{"m":"<math aria-label=\"+\"><mrow><mo>+<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"w u_t(x|y)\"><mrow><mi>w<\/mi><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"看提示的箭頭乘上 w"}],"src":{"lec":"L03B","t":1534,"video":216,"slide":"p.31、p.33","note":"p.37 式 (65)、p.38 Remark 26"}}]},"practice":[{"id":"p1","prompt":"不看提示 <math aria-label=\"u(x|∅)=0.2\"><mrow><mi>u<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>∅<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0.2<\/mn><\/mrow><\/math>、看提示 <math aria-label=\"u(x|y)=1.0\"><mrow><mi>u<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>1.0<\/mn><\/mrow><\/math>。提示的部分（兩者的差）是多少？","answer":0.8,"tol":0.001,"calc":"1.0 - 0.2","hint":"看提示的箭頭減掉不看提示的箭頭"},{"id":"p2","prompt":"用 <math aria-label=\"ũ=(1−w)u(x|∅)+w u(x|y)\"><mrow><mi>ũ<\/mi><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>w<\/mi><mo stretchy=\"false\">)<\/mo><mi>u<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>∅<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mi>w<\/mi><mi>u<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>，算 w=0 的 ũ。","answer":0.2,"tol":0.001,"calc":"(1-0)*0.2 + 0*1.0","hint":"w=0 時，看提示的那根權重是 0"},{"id":"p3","prompt":"同一組箭頭，算 w=1 的 ũ。","answer":1.0,"tol":0.001,"calc":"(1-1)*0.2 + 1*1.0","hint":"w=1 時，不看提示的那根權重是 0"},{"id":"p4","prompt":"同一組箭頭，算 w=4 的 ũ。","answer":3.4,"tol":0.001,"calc":"(1-4)*0.2 + 4*1.0","hint":"(1−4)×0.2＋4×1.0；也可以用 u(x|y)＋3×差 驗算"},{"id":"p5","prompt":"錯誤寫法 <math aria-label=\"u(x|∅)+(w−1)(差)\"><mrow><mi>u<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>∅<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mo stretchy=\"false\">(<\/mo><mi>w<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>差<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 在 w=4 時算出多少？","answer":2.6,"tol":0.001,"calc":"0.2 + (4-1)*0.8","hint":"0.2＋3×0.8；和正確答案 3.4 比，剛好少一份差"}],"quiz":[{"id":"q01","type":"choice","dim":"concept","level":1,"prompt":"基本引導（vanilla guidance）和原本的流模型相比，改了什麼？","choices":["資料變成（資料, 提示）成對，網路多吃一個輸入 y；損失與抽樣流程照舊","另外訓練一個分類器，抽樣時加上它的梯度","把條件向量場 <math aria-label=\"u_t(x|z)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 改成依賴提示 y 的新公式","抽樣時每一步要呼叫網路兩次"],"answer":0,"explain":"原片說幾乎沒變：只有資料成對、提示成為網路輸入。條件向量場原則上可以依賴 y，但實務不這樣做；另訓分類器是分類器引導，每步兩次呼叫是 CFG 的代價。","src":{"lec":"L03B","t":253,"video":14}},{"id":"q02","type":"choice","dim":"concept","level":2,"prompt":"為什麼這個方法叫「無分類器」引導？","choices":["分類器那一項換成兩根箭頭的差，同一個網路就算得出，不必訓練分類器","因為改用現成（off-the-shelf）的影像分類器，不用自己訓練","因為提示 y 完全不進網路","因為整個模型都不需要訓練"],"answer":0,"explain":"原片 28:54 說效果等於放大了分類器，卻從來沒訓練過一個；那個分類器是假想的。網路本身仍要訓練，而且要偶爾丟標籤。現成分類器看不懂有雜訊的資料，本來就不能直接用。","src":{"lec":"L03B","t":1734,"video":216}},{"id":"q03","type":"tf","dim":"concept","level":1,"prompt":"w=1 時，CFG 已經把提示加強了一倍。","answer":false,"explain":"w=1 時 <math aria-label=\"(1−w)=0\"><mrow><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>w<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math>，ũ 就等於 <math aria-label=\"u_t(x|y)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>，也就是基本引導，什麼都沒放大；w=0 才是完全不看提示。要 w&gt;1 才算加強。","src":{"lec":"L03B","t":1564,"video":216}},{"id":"q04","type":"choice","dim":"concept","level":2,"prompt":"CFG 需要「不看提示的箭頭」<math aria-label=\"u_t(x|∅)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>∅<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>。它從哪裡來？","choic mi>w<\/mi><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 中，取 w=4 時係數 <math aria-label=\"(1−w)\"><mrow><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>w<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 代表什麼？","choices":["是 −3：把不看提示的箭頭減掉，等於往「兩箭頭的差」的方向多推","是兩根箭頭的平均權重，ũ 落在兩根之間","w 一大它就趨近 0，不看提示的箭頭不再影響結果","代表訓練時丟標籤的機率 η"],"answer":0,"explain":"w&gt;1 時 <math aria-label=\"(1−w)\"><mrow><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>w<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 為負，所以 ũ 不是兩根箭頭的內插，而是外插：原片說放大看提示的部分，同時減掉更多不看提示的部分。","src":{"lec":"L03B","t":1574,"video":216}},{"id":"q09","type":"fill","dim":"formula","level":2,"prompt":"只限高斯路徑：<math aria-label=\"u_t(x|y) = u_t(x) +\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><\/mrow><\/math> ＿＿ <math aria-label=\"∇log p_t(y|x)\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>。空格填分數換成向量場的那個係數符號。","accept":["a_t","at","a t","aₜ","a_{t}"],"explain":"係數 <math aria-label=\"a_t\"><mrow><msub><mi>a<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 來自單元 03 的換算 <math aria-label=\"u_t = a_t s_t + b_t x\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><msub><mi>a<\/mi><mi>t<\/mi><\/msub><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo>+<\/mo><msub><mi>b<\/mi><mi>t<\/mi><\/msub><mi>x<\/mi><\/mrow><\/math>；<math aria-label=\"b_t x\"><mrow><msub><mi>b<\/mi><mi>t<\/mi><\/msub><mi>x<\/mi><\/mrow><\/math> 兩邊相同，相減後只剩 <math aria-label=\"a_t\"><mrow><msub><mi>a<\/mi><mi>t<\/mi><\/msub><\/mrow> chy=\"false\">)<\/mo><\/mrow><\/math>（例如直線路徑的 <math aria-label=\"z − ε\"><mrow><mi>z<\/mi><mo>−<\/mo><mi>ε<\/mi><\/mrow><\/math>），只是網路多吃一個 y。","answer":true,"explain":"對照單元 02：損失仍是條件流匹配，目標箭頭只看一筆資料 z。原片 06:34 回答學生說目標原則上可以依賴 y，但實務不這樣做；網路學到的平均就是看提示的向量場。","src":{"lec":"L03B","t":224,"video":14}}],"rubric":{"concept":["能說出基本引導只是把提示 y 多餵給網路，但結果不夠貼提示","能解釋 CFG 免掉的只有分類器，網路仍要訓練，還要偶爾丟標籤","能說出 w=1 是基本引導、w=0 不看提示，以及每步兩次呼叫的代價","能說明 w 變大時樣本越過團中心往外、失去多樣性，不再抽自資料分布"],"formula":["能指出 u(x|y)、u(x|∅)、w 各是哪根箭頭或哪個旋鈕","能說出貝氏拆解中 ∇log p_t(y) 為何是 0，以及哪一項是分類器","能說明 w&gt;1 時 (1−w) 為負，ũ 是兩根箭頭的外插而不是平均","能指出分類器引導那步只限高斯路徑，而 CFG 式子本身任何路徑都能算"],"compute":["給兩根一維箭頭，能算出 w=0、w=1 時的 ũ","能用 (1−w)u(x|∅)+w u(x|y) 算出 w=4 的 ũ，並算出兩箭頭的差","能用 u(x|y)+(w−1)(差) 驗算同一答案，並指出錯誤寫法少了一份差","能從 u(x)、a_t、分類器梯度算出 u(x|y)，驗證兩種引導式結果相同"],"term":["能把 prompt、guidance scale、empty token 對上中文與符號","能說出 vanilla、classifier、CFG 三種引導各多做了什麼","能說明本系列對 y 用 guided、對 z 用 conditional，看原片不混淆","讀論文會先確認 w 的慣例，能把論文的 w=3 換成本課的 w=4"],"listen":["聽原片 06:16 能聽出 reinforce，知道是要加強提示","能聽出 heuristic 與 collapse to the modes，並說出白話意思","能聽懂 37:28 一帶講的是每步兩次網路呼叫，而不是兩個網路","能分辨原片的 conditional 何時指 z、何時指 y，並認出字幕誤聽"],"link":["能說出 ∇log p_t(x|y) 就是單元 03 的分數多加一個提示 y","能指出乘 a_t 換成向量場，靠的是單元 03 的換算 u=a_t s+b_t x","能說明基本引導的損失就是單元 02 的條件流匹配，只是資料成對、網路多吃 y","能說明 CFG 沿用單元 02、03 的訓練只多丟標籤，抽樣只換掉向量場"]},"cards":[{"id":"c1","deck":"formula","front":"<math aria-label=\"∇log p_t(x|y) = ∇log p_t(x) + ＿＿\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mi>＿<\/mi><mi>＿<\/mi><\/mrow><\/math>","back":"<math aria-label=\"∇log p_t(y|x)\"><mrow><mo>∇<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><m
