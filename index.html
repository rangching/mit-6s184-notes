abel=\"ũ = ＿＿ u_t(x|∅) + w u_t(x|y)\"><mrow><mi>ũ<\/mi><mo>=<\/mo><mi>＿<\/mi><mi>＿<\/mi><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>∅<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mi>w<\/mi><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","back":"<math aria-label=\"(1−w)\"><mrow><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>w<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>：w&gt;1 時是負的；w=1 是基本引導，w=0 不看提示"},{"id":"c5","deck":"formula","front":"同一條 CFG：<math aria-label=\"ũ = u_t(x|y) + ＿＿ (u_t(x|y) − u_t(x|∅))\"><mrow><mi>ũ<\/mi><mo>=<\/mo><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mi>＿<\/mi><mi>＿<\/mi><mo stretchy=\"false\">(<\/mo><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>∅<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","back":"<math aria-label=\"(w−1)\"><mrow><mo stretchy=\"false\">(<\/mo><mi>w<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>：從看提示的箭頭多加 w−1 份差；原片 w=4 說放大 3 倍就是這樣算"},{"id":"c6","deck":"term","front":"off-the-shelf classifier","back":"現成的分類器。看不懂加了雜訊的資料，所以分類器引導要自己在有雜訊的資料上另訓一個"},{"id":"c7","deck":"term","front":"丟標籤機率 η（投影片寫 p）","back":"訓練時把標籤換成空標記 ∅ 的機率；原片舉例 20%，不是固定值"},{"id":"c8","deck":"term","front":"unguided vector field","back":"不看提示的箭頭 <math aria-label=\"u_t(x)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>，在 CFG 裡由 <math aria-label=\"u_t(x|∅)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>∅<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 給出；guided 的反面"}]},"answer":"<strong>向量場可以拆成「不看提示」加「提示的部分」。把提示的部分放大 w 倍，樣本更對題；這個部分等於兩根箭頭的差，同一個網路算兩次就有，不必訓練分類器，但訓練時要偶爾丟掉標籤。放大之後，樣本越過團的中心往外、只在分得出類別的方向變窄，也丟掉與別類共用的正當部分，不再來自原本的資料分布。<\/strong>","status":"live"},{"no":"05","title":"潛在空間與 VAE","lecture":"L04","youtube":"lRjEtfpbDug","topic":"潛在空間、自編碼器、VAE、潛在擴散","range":"原片 00:00–57:38","question":"影像太大、太冗餘，能不能先壓縮再生成？","timeline":[[0,"片頭"],[18,"小節 1｜太大了"],[86,"小節 2｜先壓縮"],[168,"小節 3｜管不到形狀"],[216,"小節 4｜想要的形狀"],[293,"小節 5｜兩個損失拔河"],[396,"小節 6｜抽樣擋住梯度"],[468,"小節 7｜在潛在空間生成"],[570,"小節 8｜打開原片看哪裡"]],"sheet":"<p><a href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\">打開原片<\/a>（Lecture 04，本片對應 00:00–57:38）。建議用<a href=\"#L04\" data-lec=\"L04\">原片字幕頁<\/a>，可逐句重聽、調慢速度；公式以投影片與講義為準。<\/p>\n<h3>看前導片之前：先答一次<\/h3>\n<p>先寫下答案，不查資料。看完原片後再答同樣三題，比較自己的差異。<\/p>\n<ol><li>分類器也吃同樣大的圖片，為什麼它不需要潛在空間，擴散模型需要？<\/li><li>VAE 的損失由哪兩部分組成？β 很大時會發生什麼？<\/li><li>z 是抽樣抽出來的，為什麼還能把梯度傳回編碼器？<\/li><\/ol>\n<h3>先記住：字母換了<\/h3>\n<p>前四堂資料寫成 z；<strong>這一堂（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=324s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"324\">05:24<\/a>）起資料寫成 x，z 是潛在變數<\/strong>。前導片裡資料一律綠色，潛在 z 一律琥珀色。<\/p>\n<h3>今天的八個詞<\/h3>\n<div class=\"table-wrap vocab\"><table><thead><tr><th>中文<\/th><th>英文<\/th><th>符號<\/th><th>白話<\/th><\/tr><\/thead><tbody><tr><td>潛在空間<\/td><td>latent space<\/td><td><math aria-label=\"R^k\"><mrow><msup><mi>R<\/mi><mi>k<\/mi><\/msup><\/mrow><\/math><\/td><td>圖片壓縮後住的小空間；每一點是幾個數字<\/td><\/tr><tr><td>自編碼器<\/td><td>autoencoder<\/td><td><math aria-label=\"μ_φ\"><mrow><msub><mi>μ<\/mi><mi>φ<\/mi><\/msub><\/mrow><\/math>、<math aria-label=\"μ_θ\"><mrow><msub><mi>μ<\/mi><mi>θ<\/mi><\/msub><\/mrow><\/math><\/td><td>編碼器把圖壓小、解碼器還原；兩個一起訓練<\/td><\/tr><tr><td>重建損失<\/td><td>reconstruction loss<\/td><td><math aria-label=\"‖x−μ_θ(μ_φ(x))‖²\"><mrow><mo stretchy=\"false\">‖<\/mo><mi>x<\/mi><mo>−<\/mo><msub><mi>μ<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>μ<\/mi><mi>φ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">)<\/mo><msup><mo stretchy=\"false\">‖<\/mo><mn>2<\/mn><\/msup><\/mrow><\/math><\/td><td>壓了再還原，和原圖差多少<\/td><\/tr><tr><td>變分自編碼器<\/td><td>variational autoencoder（VAE）<\/td><td><math aria-label=\"q_φ(z|x)\"><mrow><msub><mi>q<\/mi><mi>φ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>編碼結果是一團（高斯），再拉向標準常態<\/td><\/tr><tr><td>KL 散度<\/td><td>KL divergence<\/td><td><math aria-label=\"KL(q‖p)\"><mrow><mi>KL<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><mo stretchy=\"false\">(<\/mo><mi>q<\/mi><mo stretchy=\"false\">‖<\/mo><mi>p<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>兩個分布差多遠；一定 ≥0，相同才是 0<\/td><\/tr><tr><td>先驗<\/td><td>prior<\/td><td><math aria-label=\"N(0, I)\"><mrow><mi>N<\/mi><mo stretchy=\"false\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mi>I<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>我們希望潛在空間長成的樣子<\/td><\/tr><tr><td>後驗崩塌<\/td><td>posterior collapse<\/td><td>—<\/td><td>β 太大，編碼器忽略圖片，重建變成平均影像<\/td><\/tr><tr><td>潛在擴散模型<\/td><td>latent diffusion model<\/td><td>—<\/td><td>在潛在空間生成，最後才解碼<\/td><\/tr><\/tbody><\/table><\/div>\n<p>注意：<strong>reparameterization trick（重新參數化技巧）<\/strong>＝換一種抽法 z＝μ＋σε；單元 03 的 reparameterization 是同一個場換寫法，名字一樣，事情不同。<\/p>\n<h3>聽得出這三個詞<\/h3>\n<ul class=\"checks\"><li class=\"check\"><input type=\"checkbox\" id=\"chk-05-1\"><label for=\"chk-05-1\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=145s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"145\">02:25<\/a>：redundancy，重複、多餘；相鄰像素幾乎一樣<\/label><\/li><li class=\"check\"><input type=\"checkbox\" id=\"chk-05-2\"><label for=\"chk-05-2\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=1264s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"1264\">21:04<\/a>：nice distribution，好學的分布；這堂指接近高斯<\/label><\/li><li class=\"check\"><input type=\"checkbox\" id=\"chk-05-3\"><label for=\"chk-05-3\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=2075s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"2075\">34:35<\/a>：trade off，兩件事互相拉扯，只能取捨<\/label><\/li><\/ul>\n<h3>原片導航<\/h3>\n<div class=\"table-wrap nav-table\"><table><thead><tr><th>時間<\/th><th>看什麼<\/th><\/tr><\/thead><tbody><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=113s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"113\">01:53<\/a><\/td><td>圖片有多大<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=195s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"195\">03:15<\/a><\/td><td>抽樣要呼叫網路 50–100 次<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=250s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"250\">04:10<\/a><\/td><td>自編碼器<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=324s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"324\">05:24<\/a><\/td><td>符號改了：資料 x、潛在 z<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=426s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"426\">07:06<\/a><\/td><td>重建損失<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=630s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"630\">10:30<\/a><\/td><td>潛在分布<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=746s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"746\">12:26<\/a><\/td><td>編碼器變成一團<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=1176s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"1176\">19:36<\/a><\/td><td>負對數概似＝平方誤差（寬度固定時）<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=1302s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"1302\">21:42<\/a><\/td><td>KL 散度<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=1494s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"1494\">24:54<\/a><\/td><td>K 函數<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=1726s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"1726\">28:46<\/a><\/td><td>只留先驗會怎樣<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=1824s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"1824\">30:24<\/a><\/td><td>合併、加上 β<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=2366s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"2366\">39:26<\/a><\/td><td>為什麼不能直接微分<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=2550s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"2550\">42:30<\/a><\/td><td>重新參數化技巧<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=2712s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"2712\">45:12<\/a><\/td><td>期望值裡沒有參數了<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3295s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3295\">54:55<\/a><\/td><td>潛在擴散模型<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3384s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3384\">56:24<\/a><\/td><td>資訊損失<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3459s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3459\">57:39<\/a><\/td><td>下一段：網路架構（單元 06）<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=1957s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"1957\">32:37<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=2024s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"2024\">33:44<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=2155s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"2155\">35:55<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=2198s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"2198\">36:38<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=2335s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"2335\">38:55<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=2360s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"2360\">39:20<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=2984s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"2984\">49:44<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3031s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3031\">50:31<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3045s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3045\">50:45<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3295s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3295\">54:55<\/a><\/td><td>問答與旁白，第一次可略過<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>四個陷阱<\/h3>\n<ol><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=1498s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"1498\">24:58<\/a> 的 \"mean at one\" 是<strong>最小值<\/strong>在 1（投影片 p.15）。<\/li><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=2245s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"2245\">37:25<\/a> 的 \"mode collapse\"：講義叫後驗崩塌；先驗損失最小在中心 0、寬度 1，不是變異數 0。<\/li><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=2866s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"2866\">47:46<\/a>：每一團是高斯，全部疊起來不一定是高斯。<\/li><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3308s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3308\">55:08<\/a> 取平均；講義 Remark 32 寫抽樣。兩種都有。<\/li><\/ol>\n<p>另：投影片 p.11 的 k&lt;n 是筆誤，<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=403s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"403\">06:43<\/a> 更正為 k&lt;d。<\/p>\n<h3>練習：一維的 KL 與重新參數化<\/h3>\n<p>一維時，對標準常態的 KL＝½μ²＋½K(σ²)，K(α)＝α−ln α−1。<\/p>\n<ol><li>μ=1、σ²=1 時，KL 是多少？哪一部分是 0？<\/li><li>μ=0、σ²=2 時，KL 是多少？（ln 2 ≈ 0.693）<\/li><li>編碼器給 μ=2、σ=0.3，抽到 ε=0.5。用 z＝μ＋σε 算 z。換一個 ε=−1 呢？<\/li><\/ol>\n<details class=\"answers\"><summary>參考答案（先自己答，再打開）<\/summary>\n<ol><li>分類器只輸出 1000 個分數、走一次就好；擴散模型每一步都要輸出和圖片一樣大的箭頭（一張 3×600×1000 的圖是 1,800,000 個數），還要走 50–100 步。圖片又有很多冗餘，所以先壓到潛在空間再生成。<\/li><li>重建損失加上 β 乘 KL（先驗損失）。β 是取捨：小了重建好、潛在分布離高斯遠；大了接近先驗、重建變差；太大就後驗崩塌，編碼器忽略圖片，每張重建都是平均影像。β 該設多少沒有通用答案，它的數值和解碼器變異數、像素尺度綁在一起。<\/li><li>換一種抽法：先抽標準雜訊 ε，再算 z＝μ＋σε。抽到的分布一樣，但隨機性搬到 ε 身上，期望值改成對 ε 取，裡面沒有編碼器參數，梯度就能穿過 z 回到 μ、σ。直接對抽出來的 z 微分算得出來，但答案錯（片中簡化例子得到 0）。<\/li><\/ol>\n<p><strong>練習答案<\/strong>：(1) ½×1＋½×K(1)＝0.5＋0＝0.5；寬度那部分是 0。(2) ½×(2−0.693−1)≈0.153。(3) z＝2＋0.3×0.5＝2.15；ε=−1 時 z＝1.7。<\/p>\n<p>片中光點影像、兩層網路與 β 掃描都是簡化模型，只用來看機制，不代表真實影像模型的表現；β 的數值不可外推。練習的 μ、σ、ε 是手設的教學例，不來自計算結果，也不在影片畫面。<\/p>\n<\/details>","duration":"10:54","thumb":"data/thumb_05.jpg","ws":{"intro":"<p><a href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\">打開原片<\/a>（Lecture 04，本片對應 00:00–57:38）。建議用<a href=\"#L04\" data-lec=\"L04\">原片字幕頁<\/a>，可逐句重聽、調慢速度；公式以投影片與講義為準。<\/p>","pre":["分類器也吃同樣大的圖片，為什麼它不需要潛在空間，擴散模型需要？","VAE 的損失由哪兩部分組成？β 很大時會發生什麼？","z 是抽樣抽出來的，為什麼還能把梯度傳回編碼器？"],"preNote":"<p>先寫下答案，不查資料。看完原片後再答同樣三題，比較自己的差異。<\/p>","words":[["潛在空間","latent space","<math aria-label=\"R^k\"><mrow><msup><mi>R<\/mi><mi>k<\/mi><\/msup><\/mrow><\/math>","圖片壓縮後住的小空間；每一點是幾個數字"],["自編碼器","autoencoder","<math aria-label=\"μ_φ\"><mrow><msub><mi>μ<\/mi><mi>φ<\/mi><\/msub><\/mrow><\/math>、<math aria-label=\"μ_θ\"><mrow><msub><mi>μ<\/mi><mi>θ<\/mi><\/msub><\/mrow><\/math>","編碼器把圖壓小、解碼器還原；兩個一起訓練"],["重建損失","reconstruction loss","<math aria-label=\"‖x−μ_θ(μ_φ(x))‖²\"><mrow><mo stretchy=\"false\">‖<\/mo><mi>x<\/mi><mo>−<\/mo><msub><mi>μ<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>μ<\/mi><mi>φ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">)<\/mo><msup><mo stretchy=\"false\">‖<\/mo><mn>2<\/mn><\/msup><\/mrow><\/math>","壓了再還原，和原圖差多少"],["變分自編碼器","variational autoencoder（VAE）","<math aria-label=\"q_φ(z|x)\"><mrow><msub><mi>q<\/mi><mi>φ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","編碼結果是一團（高斯），再拉向標準常態"],["KL 散度","KL divergence","<math aria-label=\"KL(q‖p)\"><mrow><mi>KL<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><mo stretchy=\"false\">(<\/mo><mi>q<\/mi><mo stretchy=\"false\">‖<\/mo><mi>p<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","兩個分布差多遠；一定 ≥0，相同才是 0"],["先驗","prior","<math aria-label=\"N(0, I)\"><mrow><mi>N<\/mi><mo stretchy=\"false\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mi>I<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","我們希望潛在空間長成的樣子"],["後驗崩塌","posterior collapse","—","β 太大，編碼器忽略圖片，重建變成平均影像"],["潛在擴散模型","latent diffusion model","—","在潛在空間生成，最後才解碼"]],"listen":[{"t":145,"lec":"L04","word":"redundancy","gloss":"重複、多餘；相鄰像素幾乎一樣"},{"t":1264,"lec":"L04","word":"nice distribution","gloss":"好學的分布；這堂指接近高斯"},{"t":2075,"lec":"L04","word":"trade off","gloss":"兩件事互相拉扯，只能取捨"}],"nav":[{"t":113,"lec":"L04","text":"圖片有多大","plain":"圖片有多大"},{"t":195,"lec":"L04","text":"抽樣要呼叫網路 50–100 次","plain":"抽樣要呼叫網路 50–100 次"},{"t":250,"lec":"L04","text":"自編碼器","plain":"自編碼器"},{"t":324,"lec":"L04","text":"符號改了：資料 x、潛在 z","plain":"符號改了：資料 x、潛在 z"},{"t":426,"lec":"L04","text":"重建損失","plain":"重建損失"},{"t":630,"lec":"L04","text":"潛在分布","plain":"潛在分布"},{"t":746,"lec":"L04","text":"編碼器變成一團","plain":"編碼器變成一團"},{"t":1176,"lec":"L04","text":"負對數概似＝平方誤差（寬度固定時）","plain":"負對數概似＝平方誤差（寬度固定時）"},{"t":1302,"lec":"L04","text":"KL 散度","plain":"KL 散度"},{"t":1494,"lec":"L04","text":"K 函數","plain":"K 函數"},{"t":1726,"lec":"L04","text":"只留先驗會怎樣","plain":"只留先驗會怎樣"},{"t":1824,"lec":"L04","text":"合併、加上 β","plain":"合併、加上 β"},{"t":2366,"lec":"L04","text":"為什麼不能直接微分","plain":"為什麼不能直接微分"},{"t":2550,"lec":"L04","text":"重新參數化技巧","plain":"重新參數化技巧"},{"t":2712,"lec":"L04","text":"期望值裡沒有參數了","plain":"期望值裡沒有參數了"},{"t":3295,"lec":"L04","text":"潛在擴散模型","plain":"潛在擴散模型"},{"t":3384,"lec":"L04","text":"資訊損失","plain":"資訊損失"},{"t":3459,"lec":"L04","text":"下一段：網路架構（單元 06）","plain":"下一段：網路架構（單元 06）"},{"t":1957,"lec":"L04","text":"問答與旁白，第一次可略過","plain":"問答與旁白，第一次可略過"}],"navNote":"<h3>四個陷阱<\/h3>\n<ol><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=1498s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"1498\">24:58<\/a> 的 \"mean at one\" 是<strong>最小值<\/strong>在 1（投影片 p.15）。<\/li><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=2245s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"2245\">37:25<\/a> 的 \"mode collapse\"：講義叫後驗崩塌；先驗損失最小在中心 0、寬度 1，不是變異數 0。<\/li><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=2866s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"2866\">47:46<\/a>：每一團是高斯，全部疊起來不一定是高斯。<\/li><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3308s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3308\">55:08<\/a> 取平均；講義 Remark 32 寫抽樣。兩種都有。<\/li><\/ol>\n<p>另：投影片 p.11 的 k&lt;n 是筆誤，<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=403s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"403\">06:43<\/a> 更正為 k&lt;d。<\/p>","practice":{"title":"練習：一維的 KL 與重新參數化","html":"<p>一維時，對標準常態的 KL＝½μ²＋½K(σ²)，K(α)＝α−ln α−1。<\/p>\n<ol><li>μ=1、σ²=1 時，KL 是多少？哪一部分是 0？<\/li><li>μ=0、σ²=2 時，KL 是多少？（ln 2 ≈ 0.693）<\/li><li>編碼器給 μ=2、σ=0.3，抽到 ε=0.5。用 z＝μ＋σε 算 z。換一個 ε=−1 呢？<\/li><\/ol>"},"answers":["分類器只輸出 1000 個分數、走一次就好；擴散模型每一步都要輸出和圖片一樣大的箭頭（一張 3×600×1000 的圖是 1,800,000 個數），還要走 50–100 步。圖片又有很多冗餘，所以先壓到潛在空間再生成。","重建損失加上 β 乘 KL（先驗損失）。β 是取捨：小了重建好、潛在分布離高斯遠；大了接近先驗、重建變差；太大就後驗崩塌，編碼器忽略圖片，每張重建都是平均影像。β 該設多少沒有通用答案，它的數值和解碼器變異數、像素尺度綁在一起。","換一種抽法：先抽標準雜訊 ε，再算 z＝μ＋σε。抽到的分布一樣，但隨機性搬到 ε 身上，期望值改成對 ε 取，裡面沒有編碼器參數，梯度就能穿過 z 回到 μ、σ。直接對抽出來的 z 微分算得出來，但答案錯（片中簡化例子得到 0）。"],"answerExtra":"<p><strong>練習答案<\/strong>：(1) ½×1＋½×K(1)＝0.5＋0＝0.5；寬度那部分是 0。(2) ½×(2−0.693−1)≈0.153。(3) z＝2＋0.3×0.5＝2.15；ε=−1 時 z＝1.7。<\/p>\n<p>片中光點影像、兩層網路與 β 掃描都是簡化模型，只用來看機制，不代表真實影像模型的表現；β 的數值不可外推。練習的 μ、σ、ε 是手設的教學例，不來自計算結果，也不在影片畫面。<\/p>","extra":[{"title":"先記住：字母換了","html":"<p>前四堂資料寫成 z；<strong>這一堂（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=324s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"324\">05:24<\/a>）起資料寫成 x，z 是潛在變數<\/strong>。前導片裡資料一律綠色，潛在 z 一律琥珀色。<\/p>"}]},"learn":{"unit":"05","notes":{"keypoints":["圖片太大：擴散模型的向量場輸入、輸出都和圖片一樣大，抽樣還要呼叫網路 50–100 次，所以先用自編碼器把圖壓到潛在空間 <math aria-label=\"R^k\"><mrow><msup><mi>R<\/mi><mi>k<\/mi><\/msup><\/mrow><\/math>（<math aria-label=\"k&lt;d\"><mrow><mi>k<\/mi><mi>&lt;<\/mi><mi>d<\/mi><\/mrow><\/math>）。","字母換了：本堂起資料寫成 <math aria-label=\"x\"><mrow><mi>x<\/mi><\/mrow><\/math>，潛在變數寫成 <math aria-label=\"z\"><mrow><mi>z<\/mi><\/mrow><\/math>；前四堂的 <math aria-label=\"z\"><mrow><mi>z<\/mi><\/mrow><\/math> 是資料。","只有重建損失，潛在空間長什麼形狀沒人管；VAE 讓編碼器輸出一團高斯，再用 KL 把每一團拉向標準常態 <math aria-label=\"N(0, I)\"><mrow><mi>N<\/mi><mo stretchy=\"false\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mi>I<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>。","β 是取捨：小了重建好，但潛在分布離高斯遠；大了接近先驗，但重建變差；太大就後驗崩塌，編碼器忽略圖片。","<math aria-label=\"z\"><mrow><mi>z<\/mi><\/mrow><\/math> 是抽出來的；改寫成 <math aria-label=\"z = μ + σ·ε\"><mrow><mi>z<\/mi><mo>=<\/mo><mi>μ<\/mi><mo>+<\/mo><mi>σ<\/mi><mo lspace=\"0\" rspace=\"0\">·<\/mo><mi>ε<\/mi><\/mrow><\/math> 後，期望值改對 <math aria-label=\"ε\"><mrow><mi>ε<\/mi><\/mrow><\/math> 取，裡面沒有編碼器參數，梯度才傳得回去。","每一團是高斯，全部疊起來不一定是；所以在潛在空間另外訓練流模型，生成後再解碼。流程和前面單元一樣，只是換了資料集。"],"formulas":[{"id":"f1","title":"壓了再還原","plain":"原圖減掉「壓縮再還原」的圖，每個像素的差平方加起來","parts":[{"m":"<math aria-label=\"‖\"><mrow><mo stretchy=\"false\">‖<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"x\"><mrow><mi>x<\/mi><\/mrow><\/math>","say":"原圖（本堂 <math aria-label=\"x\"><mrow><mi>x<\/mi><\/mrow><\/math> 是資料）"},{"m":"<math aria-label=\"−\"><mrow><mo>−<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"μ_θ(μ_φ(x))\"><mrow><msub><mi>μ<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>μ<\/mi><mi>φ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"編碼器 <math aria-label=\"μ_φ\"><mrow><msub><mi>μ<\/mi><mi>φ<\/mi><\/msub><\/mrow><\/math> 先壓成幾個數字，解碼器 <math aria-label=\"μ_θ\"><mrow><msub><mi>μ<\/mi><mi>θ<\/mi><\/msub><\/mrow><\/math> 再還原成圖"},{"m":"<math aria-label=\"‖²\"><mrow><msup><mo stretchy=\"false\">‖<\/mo><mn>2<\/mn><\/msup><\/mrow><\/math>","say":"差的平方加總；VAE 改用 <math aria-label=\"−log p_θ(x|z)\"><mrow><mo>−<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>，解碼器寬度固定時是放大的平方誤差加常數"}],"src":{"lec":"L04","t":426,"video":86,"slide":"p.11","note":"p.47–48 式 (73)(74)"}},{"id":"f2","title":"離標準常態多遠","plain":"中心離 0 多遠，加上每一維寬度離 1 多遠","parts":[{"m":"<math aria-label=\"KL(q_φ(z|x) ‖ N(0, I))\"><mrow><mi>KL<\/mi><mo>&#x2061;<\ ,"say":"重建：壓了再還原，和原圖差多少"},{"m":"<math aria-label=\"+\"><mrow><mo>+<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"β\"><mrow><mi>β<\/mi><\/mrow><\/math>","say":"取捨的權重，<math aria-label=\"β ≥ 0\"><mrow><mi>β<\/mi><mo>≥<\/mo><mn>0<\/mn><\/mrow><\/math>；太大就後驗崩塌"},{"m":"<math aria-label=\"L_{prior}\"><mrow><msub><mi>L<\/mi><mrow><mi>p<\/mi><mi>r<\/mi><mi>i<\/mi><mi>o<\/mi><mi>r<\/mi><\/mrow><\/msub><\/mrow><\/math>","say":"先驗：上面那條 KL 對所有圖片平均"}],"src":{"lec":"L04","t":1806,"video":293,"slide":"p.17","note":"p.49 式 (78)(79)"}},{"id":"f4","title":"換一種抽法","plain":"先抽標準雜訊，再拉伸、平移；骰子搬到參數外面","parts":[{"m":"<math aria-label=\"z\"><mrow><mi>z<\/mi><\/mrow><\/math>","say":"抽出來的潛在向量"},{"m":"<math aria-label=\"=\"><mrow><mo>=<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"μ_φ(x)\"><mrow><msub><mi>μ<\/mi><mi>φ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"編碼器給的中心：平移"},{"m":"<math aria-label=\"+\"><mrow><mo>+<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"σ_φ(x)·ε\"><mrow><msub><mi>σ<\/mi><mi>φ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo lspace=\"0\" rspace=\"0\">·<\/mo><mi>ε<\/mi><\/mrow><\/math>","say":"編碼器給的寬度乘上標準雜訊：拉伸"},{"m":"<math aria-label=\",\"><mrow><mo>,<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"ε ~ N(0, I)\"><mrow><mi>ε<\/mi><mo>~<\/mo><mi>N<\/mi><mo stretchy=\"false\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mi>I<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"隨機性只在 <math aria-label=\"ε\"><mrow><mi>ε<\/mi><\/mrow><\/math> 身上，它的分布不含任何參數"}],"src":{"lec":"L04","t":2550,"video":396,"slide":"p.17","note":"p.50"}}]},"practice":[{"id":"p1","prompt":"一維時 <math aria-label=\"μ=1\"><mrow><mi>μ<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math>、<math aria-label=\"σ²=1\"><mrow><msup><mi>σ<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math>，對標準常態的 KL 是多少？","answer":0.5,"tol":0.001,"calc":"0.5*1**2 + 0.5*(1 - log(1) - 1)","hint":"KL＝½μ²＋½K(σ²)；K(1)＝0，所以寬度那部分是 0"},{"id":"p2","prompt":"一維時 <math aria-label=\"μ=0\"><mrow><mi>μ<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math>、<math aria-label=\"σ²=2\"><mrow><msup><mi>σ<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mn>2<\/mn><\/mrow><\/math>，KL 是多少？","answer":0.1534,"tol":0.001,"calc":"0.5*0**2 + 0.5*(2 - log(2) - 1)","hint":"中心項是 0，只剩 ½K(2)＝½(2−ln 2−1)"},{"id":"p3","prompt":"編碼器給 <math aria-label=\"μ=2\"><mrow><mi>μ<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><\/math>、<math aria-label=\"σ=0.3\"><mrow><mi>σ<\/mi><mo>=<\/mo><mn>0.3<\/mn><\/mrow><\/math>，抽到 <math aria-label=\"ε=0.5\"><mrow><mi>ε<\/mi><mo>=<\/mo><mn>0.5<\/mn><\/mrow><\/math>，<math aria-label=\"z\"><mrow><mi>z<\/mi><\/mrow><\/math> 是多少？","answer":2.15,"tol":0.001,"calc":"2 + 0.3*0.5","hint":"z＝μ＋σε"},{"id":"p4","prompt":"同一個編碼結果（<math aria-label=\"μ=2\"><mrow><mi>μ<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><\/math>、<math aria-label=\"σ=0.3\"><mrow><mi>σ<\/mi><mo>=<\/mo><mn>0.3<\/mn><\/mrow><\/math>），改抽到 <math aria-label=\"ε=−1\"><mrow><mi>ε<\/mi><mo>=<\/mo><mo>−<\/mo><mn>1<\/mn><\/mrow><\/math>，<math aria-label=\"z\"><mrow><mi>z<\/mi><\/mrow><\/math> 是多少？","answer":1.7,"tol":0.001,"calc":"2 + 0.3*(-1)","hint":"ε 是負的，z 往中心左邊移 σ"}],"quiz":[{"id":"q01","type":"choice","dim":"concept","level":1,"prompt":"影像分類器也吃同樣大的圖片，為什麼擴散模型特別需要潛在空間？","choices":["向量場要從 180 萬維輸出 180 萬維的箭頭，而且抽樣時要呼叫網路 50–100 次","分類器用的圖片解析度比較低，擴散模型用的圖片比較大","像素空間裡無法定義高斯雜訊，一定要先壓到低維才能加雜訊","分類器只要訓練一次，擴散模型每生成一張圖都要重新訓練"],"answer":0,"explain":"分類器把圖片映到 1000 個分數、走一次就好；擴散模型的向量場輸入輸出都和圖片一樣大，還要走 50–100 步。高斯雜訊在任何維度都能加，問題是成本與冗餘。","src":{"lec":"L04","t":232,"video":18,"slide":"p.9"}},{"id":"q02","type":"tf","dim":"concept","level":2,"prompt":"只要自編碼器的重建損失夠小，編碼後的潛在分布自然就會好學。","answer":false,"explain":"重建損失只管「壓了再還原」準不準，不管潛在點怎麼排：把潛在空間放大 25 倍、解碼器縮回來，重建完全一樣。原片說對潛在分布 we have no control over it，它可能很崎嶇、很難學。","src":{"lec":"L04","t":637,"video":168,"slide":"p.12"}},{"id":"q03","type":"choice","dim":"concept","level":2,"prompt":"潛在擴散模型在訓練時，雜訊加在哪裡？","choices":["加在編碼後的潛在向量上；流模型整個在 <math aria-label=\"R^k\"><mrow><msup><mi>R<\/mi><mi>k<\/mi><\/msup><\/mrow><\/math> 裡學，最後才解碼","加在原始像素 <math aria-label=\"x\"><mrow><mi>x<\/mi><\/mrow><\/math> 上，加完雜訊再交給編碼器壓縮","加在解碼器輸出的圖片上，讓解碼器學會去雜訊","VAE 編碼器本身的抽樣就是加雜訊的過程，不必另外訓練流模型"],"answer":0,"explain":"食譜是先把所有圖片編碼成潛在資料集，再在這些潛在向量上訓練流或擴散模型；生成時在潛在空間走完才解碼一次。VAE 的抽樣是編碼的一部分，不是生成模型的前向加雜訊。","src":{"lec":"L04","t":3320,"video":468,"slide":"p.18","note":"p.51 Remark 32"}},{"id":"q04","type":"choice","dim":"concept","level":3,"prompt":"VAE 總損失 <math aria-label=\"L = L_{recon} + β L_{prior}\"><mrow><mi>L<\/mi><mo>=<\/mo><msub><mi>L<\/mi><mrow><mi>r<\/mi><mi>e<\/mi><mi>c<\/mi><mi>o<\/mi><mi>n<\/mi><\/mrow><\/msub><mo>+<\/mo><mi>β<\/mi><msub><mi>L<\/mi><mrow><mi>p<\/mi><mi>r<\/mi><mi>i<\/mi><mi>o<\/mi><mi>r<\/mi><\/mrow><\/msub><\/mrow><\/math> 裡的 β 該怎麼看？","choices":["是取捨：β 小重建好、潛在分布離高斯遠；β 大接近先驗、重建變差，太大就後驗崩塌","KL 項越小越好，所以 β 越大越好；重建交給解碼器自己補回來","β 越小越好，β=0 就是最理想的 VAE","β 有一個通用的最佳值，和資料、解碼器變異數都無關"],"answer":0,"explain":"只留 KL 時最小值是每張圖都輸出 <math aria-label=\"N(0, I)\"><mrow><mi>N<\/mi><mo stretchy=\"false\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mi>I<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>，完全不看資料；β=0 又退回普通自編碼器，形狀沒人管。原片說 β 只能靠實驗決定，數值還和解碼器變異數、像素尺度綁在一起。","src":{"lec":"L04","t":2075,"video":293,"note":"p.50"}},{"id":"q05","type":"match","dim":"formula","level":1,"prompt":"把 VAE 損失裡的每一項，配對到它負責的事。","pairs":[["<math aria-label=\"‖x − μ_θ(z)‖²\"><mrow><mo stretchy=\"false\">‖<\/mo><mi>x<\/mi><mo>−<\/mo><msub><mi>μ<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><msup><mo stretchy=\"false\">‖<\/mo><mn>2<\/mn><\/msup><\/mrow><\/math>","壓了再還原，和原圖差多少"],["<math aria-label=\"½‖μ_φ(x)‖²\"><mrow><mi>½<\/mi><mo stretchy=\"false\">‖<\/mo><msub><mi>μ<\/mi><mi>φ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><msup><mo stretchy=\"false\">‖<\/mo><mn>2<\/mn><\/msup><\/mrow><\/math>","把每一團的中心拉向 0"],["<math aria-label=\"½ΣK(σ_φ²(x))\"><mrow><mi>½<\/mi><mi>Σ<\/mi><mi>K<\/mi><m ld be small"],"answer":0,"explain":"原句：<code>So the minimizer of this function is if mu of phi would always be zero and sigma phi would always be one.<\/code> 接著說 <code>Which completely ignores the data point.<\/code> 這也說明 37:25 的「變異數設成 0」是口誤。","src":{"lec":"L04","t":1726,"video":293}},{"id":"q16","type":"listen","dim":"listen","level":3,"prompt":"重新參數化之後，講者說期望值是對什麼取的？選出你聽到的說法。","clip":{"lec":"L04","t":2708,"dur":7},"choices":["over a distribution that has no parameter","over a distribution that depends on phi","over the data distribution and the decoder","over a distribution that has no variance"],"answer":0,"explain":"原句：<code>We&#x27;re taking an expectation over a distribution that has no parameter.<\/code> 下一句 <code>So we can now do whatever we want and back prop.<\/code> 期望值改對 <math aria-label=\"ε ~ N(0, I)\"><mrow><mi>ε<\/mi><mo>~<\/mo><mi>N<\/mi><mo stretchy=\"false\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mi>I<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 取，裡面沒有 φ，才能反向傳播。","src":{"lec":"L04","t":2708,"video":396}},{"id":"q17","type":"order","dim":"link","level":1,"prompt":"把潛在擴散模型從訓練到生成的步驟排好。","items":["用編碼器把所有訓練圖片轉成潛在向量","在潛在向量資料集上訓練流匹配（或擴散）模型","從標準常態抽雜訊，沿學到的向量場走到潛在空間的樣本","用解碼器把生成的潛在向量還原成圖片"],"explain":"中間兩步就是對照單元 02 的流匹配訓練與單元 01 的「從雜訊沿向量場走」，只是資料換成潛在向量；投影片 p.18 說 Exact same recipe as before。","src":{"lec":"L04","t":3299,"video":468,"slide":"p.18"}},{"id":"q18","type":"choice","dim":"link","level":3,"prompt":"單元 02 的條件路徑寫成 <math aria-label=\"x = t z + (1−t) ε\"><mrow><mi>x<\/mi><mo>=<\/mo><mi>t<\/mi><mi>z<\/mi><mo>+<\/mo><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mi>ε<\/mi><\/mrow><\/math>（那時 <math aria-label=\"z\"><mrow><mi>z<\/mi><\/mrow><\/math> 是資料）。在潛在擴散模型裡照樣用流匹配，這條路徑的終點應該是什麼？","choices":["編碼後的潛在向量（本堂的 <math aria-label=\"z\"><mrow><mi>z<\/mi><\/mrow><\/math>），整條路徑都在 <math aria-label=\"R^k\"><mrow><msup><mi>R<\/mi><mi>k<\/mi><\/msup><\/mrow><\/math> 裡","原始圖片 <math aria-label=\"x\"><mrow><mi>x<\/mi><\/mrow> c":{"lec":"L04","t":2405,"video":396}}],"rubric":{"concept":["能說出圖片太大要先壓縮，但講不出擴散模型為什麼比分類器更吃虧","能說明向量場輸入輸出同維、要呼叫網路 50–100 次，也知道重建損失管不到潛在形狀","能解釋 VAE 為何讓編碼器輸出一團並拉向標準常態，並說出 β 兩端各自的代價","能說明每團高斯疊起來不一定是高斯，所以 VAE 之後仍要在潛在空間訓練流模型"],"formula":["認得重建項與 KL 項，但說不出各項分別管什麼","能指出 ½‖μ‖² 把中心拉向 0、K(σ²) 把寬度拉向 1，β 乘在先驗項上","能說明 K 最小在 1 且兩邊不對稱，及寬度固定時負對數概似是放大的平方誤差","能指出期望值對 q_φ(z|x) 取時 φ 卡住梯度，改寫後期望值改對 ε 取的差別"],"compute":["能把 μ、σ² 代入一維 KL，但常漏掉 K 項或算錯 ln","能正確算出一維 KL，並用 z＝μ＋σε 代數字算出 z","能算多維 KL（K 逐維加總），並分辨題目給的是 σ 還是 σ²","能排出 VAE 訓練一步的順序，並用 K(0.5)、K(2) 算出 K 兩邊不對稱"],"term":["認得 latent space、autoencoder 等英文，但中英常對不上","能把 x、z、ε、φ、θ 對到本堂的意思，不再把 z 當成資料","能分清 posterior collapse 與 mode collapse、本堂與單元 03 的 reparameterization","能用中英術語完整講出潛在擴散流程：encoder、latent、flow matching、decoder"],"listen":["要看字幕才知道講者正在講 KL 或先驗損失","聽得出 KL divergence、prior、latent 等關鍵字，但跟不上整句","能聽出先驗損失最小在 mean zero、variance one，並知道字幕的 set 是 z","能聽懂 no parameter 那段並用中文說明為何能反向傳播，也指得出 37:25 的口誤"],"link":["知道潛在擴散和前面的模型有關，但說不出哪裡一樣","能說出在潛在空間照樣用單元 02 的流匹配，只是資料換成編碼後的 z","能說明條件生成與 CFG 在潛在空間照用，並分清單元 03 與本堂的同名詞","能畫出編碼、在 R^k 訓練流模型、從標準常態抽樣、解碼的全流程並標出各單元位置"]},"cards":[{"id":"c1","deck":"formula","front":"<math aria-label=\"KL(q_φ(z|x) ‖ N(0, I)) = ½‖μ_φ(x)‖² + ＿＿\"><mrow><mi>KL<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><mo stretchy=\"false\">(<\/mo><msub><mi>q<\/mi><mi>φ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">‖<\/mo><mi>N<\/mi><mo stretchy=\"false\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mi>I<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mi>½<\/mi><mo stretchy=\"false\">‖<\/mo><msub><mi>μ<\/mi><mi>φ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><msup><mo stretchy=\"false\">‖<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><mi>＿<\/mi><mi>＿<\/mi><\/mrow><\/math>","back":"<math aria-label=\"½ΣK(σ_φ²(x))\"><mrow><mi>½<\/mi><mi>Σ<\/mi><mi>K<\/mi><mo stretchy=\"false\">(<\/mo><msubsup><mi>σ<\/m p><mi>σ<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 固定時，<math aria-label=\"−log p_θ(x|z) = ＿＿ + 常數\"><mrow><mo>−<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mi>＿<\/mi><mi>＿<\/mi><mo>+<\/mo><mi>常<\/mi><mi>數<\/mi><\/mrow><\/math>","back":"<math aria-label=\"‖x − μ_θ(z)‖²/(2σ²)\"><mrow><mo stretchy=\"false\">‖<\/mo><mi>x<\/mi><mo>−<\/mo><msub><mi>μ<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><msup><mo stretchy=\"false\">‖<\/mo><mn>2<\/mn><\/msup><mo lspace=\"0\" rspace=\"0\">/<\/mo><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><msup><mi>σ<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>：放大過的平方誤差"},{"id":"c6","deck":"term","front":"重新參數化技巧（reparameterization trick）","back":"換一種抽法 <math aria-label=\"z = μ + σ·ε\"><mrow><mi>z<\/mi><mo>=<\/mo><mi>μ<\/mi><mo>+<\/mo><mi>σ<\/mi><mo lspace=\"0\" rspace=\"0\">·<\/mo><mi>ε<\/mi><\/mrow><\/math>，隨機性搬到不含參數的 ε，梯度傳得回編碼器；和單元 03 的同名詞不同"},{"id":"c7","deck":"term","front":"負對數概似（negative log-likelihood）","back":"<math aria-label=\"−log p_θ(x|z)\"><mrow><mo>−<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msub><mi>p<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>：VAE 的重建項；解碼器寬度固定時是放大的平方誤差加常數"},{"id":"c8","deck":"term","front":"邊際潛在分布 <math aria-label=\"q_φ(z)\"><mrow><msub><mi>q<\/mi><mi>φ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","back":"把所有圖片的一團疊起來：<math aria-label=\"q_φ(z) = ∫ q_φ(z|x) p_data(x) dx\"><mrow><msub><mi>q<\/mi><mi>φ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mi>∫<\/mi><msub><mi>q<\/mi><mi>φ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><msub><mi>p<\/mi><mi>data<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>；每團是高斯，疊起來不一定是"}]},"answer":"<strong>用編碼器把圖片壓成幾個數字（潛在空間），流模型在那裡生成，再用解碼器還原。只要求重建，潛在空間的形狀沒人管；VAE 多加一項把每張圖的一團拉向標準常態，權重 β 是取捨：小了重建好但潛在分布離高斯遠，大了接近先驗但重建差，太大就後驗崩塌。z 是抽出來的，換成 z＝μ＋σε 的抽法後梯度才傳得回編碼器。重建好的 VAE 潛在分布不是高斯，所以還要在潛在空間另外訓練流模型。<\/strong>","status":"live"},{"no":"06","title":"網路架構與案例","lecture":"L04","youtube":"hUjnLtI13Gs","topic":"時間與提示編碼、DiT、U-Net、案例","range":"原片 57:38–1:20:56","question":"向量場的網路實際上長什麼樣？","timeline":[[0,"片頭"],[14,"小節 1｜三個輸入，一個輸出"],[73,"小節 2｜時間：一個數字撐成一條"],[132,"小節 3｜文字：一句話變成一串"],[168,"小節 4｜影像：切成小塊排成一串"],[236,"小節 5｜注意力：每一塊去問所有塊"],[302,"小節 6｜DiT：三條線怎麼接進來"],[408,"小節 7｜兩個大模型，同一套零件"],[476,"小節 8｜讀論文的時間陷阱"],[552,"小節 9｜打開原片看哪裡"]],"sheet":"<p><a href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\">打開原片<\/a>（本段從 <a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3459s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3459\">57:39<\/a> 開始）。建議用<a href=\"#L04\" data-lec=\"L04\">原片字幕頁<\/a>，可逐句重聽、調慢速度；公式以投影片與講義為準。<\/p>\n<h3>看前導片之前：先答一次<\/h3>\n<p>先寫下答案，不查資料。看完原片後再答同樣三題，比較自己的差異。<\/p>\n<ol><li>向量場網路吃進 x、t、y，輸出什麼形狀？那是一張圖嗎？<\/li><li>一張 4×32×32 的潛在影像用 2×2 切塊，會變成幾個向量？如果改在 3×256×256 的像素影像上做（一樣 2×2 切），注意力要比對的格子大約變成幾倍？<\/li><li>讀 SD3 論文看到 t=0，那是雜訊還是資料？跟本課一樣嗎？<\/li><\/ol>\n<h3>今天的八個詞<\/h3>\n<div class=\"table-wrap vocab\"><table><thead><tr><th>中文<\/th><th>英文<\/th><th>符號<\/th><th>白話<\/th><\/tr><\/thead><tbody><tr><td>嵌入<\/td><td>embedding<\/td><td>—<\/td><td>把一個東西換成一條向量；時間嵌入、提示嵌入是兩個用法<\/td><\/tr><tr><td>切塊<\/td><td>patchify<\/td><td><math aria-label=\"N=(H/P)(W/P)\"><mrow><mi>N<\/mi><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mi>H<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>P<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>W<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>P<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>切小塊、攤平、排成一串；反過來叫拼回（unpatchify）<\/td><\/tr><tr><td>注意力<\/td><td>attention<\/td><td><math aria-label=\"softmax(QKᵀ/√d_h)V\"><mrow><mi>softmax<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><mo stretchy=\"false\">(<\/mo><mi>Q<\/mi><msup><mi>K<\/mi><mi>T<\/mi><\/msup><mo lspace=\"0\" rspace=\"0\">/<\/mo><msqrt><msub><mi>d<\/mi><mi>h<\/mi><\/msub><\/msqrt><mo stretchy=\"false\">)<\/mo><mi>V<\/mi><\/mrow><\/math><\/td><td>每一塊拿自己的問題（query）去比對所有塊的標籤（key），按權重平均內容（value）<\/td><\/tr><tr><td>自注意力<\/td><td>self-attention<\/td><td>—<\/td><td>問題、標籤、內容都來自影像自己<\/td><\/tr><tr><td>交叉注意力<\/td><td>cross-attention<\/td><td>—<\/td><td>問題來自影像，標籤和內容來自文字；輸出個數跟影像塊一樣多<\/td><\/tr><tr><td>自適應層正規化<\/td><td>adaptive layer normalization（adaLN）<\/td><td>—<\/td><td>先把每塊拉到同一個尺度，再由 t 決定每個通道放大多少、平移多少<\/td><\/tr><tr><td>擴散 Transformer<\/td><td>diffusion transformer（DiT）<\/td><td>—<\/td><td>同一種方塊疊很多層，每層有注意力、小網路與殘差<\/td><\/tr><tr><td>時間慣例<\/td><td>time convention<\/td><td><math aria-label=\"t=0\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math><\/td><td>一篇論文的 t=0 是雜訊還是資料；本課 t=0 是雜訊<\/td><\/tr><\/tbody><\/table><\/div>\n<p>注意：<strong>time embedding<\/strong> 片中叫「時間嵌入」，投影片標題 Encoding Time 譯作「時間編碼」，是同一件事。<\/p>\n<h3>聽得出這三個詞<\/h3>\n<ul class=\"checks\"><li class=\"check\"><input type=\"checkbox\" id=\"chk-06-1\"><label for=\"chk-06-1\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3532s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3532\">58:52<\/a>：boost up，撐大；把只有一個數字的時間，撐成一條長向量<\/label><\/li><li class=\"check\"><input type=\"checkbox\" id=\"chk-06-2\"><label for=\"chk-06-2\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3758s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3758\">62:38<\/a>：beyond the scope，超出這堂課的範圍；這句之後 Transformer 講得很快，看不懂是正常的<\/label><\/li><li class=\"check\"><input type=\"checkbox\" id=\"chk-06-3\"><label for=\"chk-06-3\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3788s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3788\">63:08<\/a>：flavors，各種版本，不是口味；<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=4008s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4008\">66:48<\/a> 又說一次<\/label><\/li><\/ul>\n<h3>原片導航<\/h3>\n<div class=\"table-wrap nav-table\"><table><thead><tr><th>時間<\/th><th>看什麼<\/th><\/tr><\/thead><tbody><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3459s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3459\">57:39<\/a><\/td><td>開講：網路架構<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3504s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3504\">58:24<\/a><\/td><td>網路輸出什麼<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3522s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3522\">58:42<\/a><\/td><td>時間怎麼變成向量<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3573s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3573\">59:33<\/a><\/td><td>文字提示<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3672s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3672\">61:12<\/a><\/td><td>影像<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3699s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3699\">61:39<\/a><\/td><td>切塊<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3788s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3788\">63:08<\/a><\/td><td>DiT<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3884s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3884\">64:44<\/a><\/t I&amp;t=4338s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4338\">72:18<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=4374s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4374\">72:54<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=4385s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4385\">73:05<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=4546s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4546\">75:46<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=4598s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4598\">76:38<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=4701s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4701\">78:21<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=4809s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4809\">80:09<\/a><\/td><td>問答與一張圖，第一次可略過<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>五個陷阱<\/h3>\n<ol><li><strong>網路輸出不是圖片<\/strong>（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3509s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3509\">58:29<\/a>）：形狀與 x 相同，內容是速度。<\/li><li><strong>SD3 不是交叉注意力<\/strong>（投影片 p.31、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=4196s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4196\">69:56<\/a>）：SD3 把文字與影像塊接成一串一起做注意力；MovieGen 才用交叉注意力。<\/li><li><strong>兩種時間<\/strong>（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=4299s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4299\">71:39<\/a>）：t 是加噪進度，T 是影片的幀。<\/li><li><strong>6,000 張 GPU<\/strong>（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=4358s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4358\">72:38<\/a>）：口頭約數；MovieGen 論文寫最多 6,144 張 H100。<\/li><li><strong>時間慣例<\/strong>（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=4427s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4427\">73:47<\/a>）：SD3 論文 t=0 是資料，MovieGen 與本課 t=0 是雜訊。<\/li><\/ol>\n<p>另外兩個寫法差異：投影片 p.22 的時間嵌入係數讓長度只有 0.707，以講義式 (68) 為準；講義 U-Net 的中間層也叫 latent，數字是輸入的 2.67 倍，不是壓縮。<\/p>\n<h3>練習：算塊數與格子數<\/h3>\n<ol><li>一張 4×32×32 的潛在影像，用 P=4 切塊，會得到幾個向量？每個向量有幾個數？<\/li><li>同一張用 P=1 切，塊數是 P=4 的幾倍？注意力要比對的格子又是幾倍？<\/li><li>一張 3×32×48 的影像，用 P=4 切，會得到幾個向量？<\/li><\/ol>\n<details class=\"answers\"><summary>參考答案（先自己答，再打開）<\/summary>\n<ol><li>是一個形狀和 x 一樣的東西：4×32×32。可是它不是圖，每一格裝的是速度，告訴此刻這一點該往哪裡走。圖片要沿著箭頭解 ODE，一步一步走出來。<\/li><li>256 個（高 16 格、寬 16 格，每塊 4×2×2＝16 個數）。像素影像一樣 2×2 切有 16,384 塊，是 64 倍；注意力要比對的格子是塊數的平方，所以是 64×64＝4,096 倍。數字個數只差 48 倍（196,608 對 4,096），三個倍數不要混用。像素影像也用 2×2 切是假設情境。<\/li><li>是資料。SD3 論文的 t 方向和本課相反（t=0 資料、t=1 雜訊）。片中的簡化模型裡，不換算直接套用，粒子會飛到大約 −6.6，而資料在 2 附近。<\/li><\/ol>\n<p><strong>練習答案<\/strong>：1. (32/4)×(32/4)＝64 個，每個 4×4×4＝64 個數。2. P=1 有 1,024 塊，是 64 塊的 16 倍；格子是 16×16＝256 倍。3. (32/4)×(48/4)＝8×12＝96 個，每個 3×4×4＝48 個數。<\/p>\n<p>片中注意力、adaLN 與小 DiT 的權重都是隨機數、沒有訓練，只看形狀；時間慣例的粒子實驗是一維高斯的簡化模型。練習題的 64、1,024、96 與片中計算一致（P=4、P=1 的塊數、長方形切塊都已實算）。<\/p>\n<\/details>","duration":"10:29","thumb":"data/thumb_06.jpg","ws":{"intro":"<p><a href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\">打開原片<\/a>（本段從 <a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3459s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3459\">57:39<\/a> 開始）。建議用<a href=\"#L04\" data-lec=\"L04\">原片字幕頁<\/a>，可逐句重聽、調慢速度；公式以投影片與講義為準。<\/p>","pre":["向量場網路吃進 x、t、y，輸出什麼形狀？那是一張圖嗎？","一張 4×32×32 的潛在影像用 2×2 切塊，會變成幾個向量？如果改在 3×256×256 的像素影像上做（一樣 2×2 切），注意力要比對的格子大約變成幾倍？","讀 SD3 論文看到 t=0，那是雜訊還是資料？跟本課一樣嗎？"],"preNote":"<p>先寫下答案，不查資料。看完原片後再答同樣三題，比較自己的差異。<\/p>","words":[["嵌入","embedding","—","把一個東西換成一條向量；時間嵌入、提示嵌入是兩個用法"],["切塊","patchify","<math aria-label=\"N=(H/P)(W/P)\"><mrow><mi>N<\/mi><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mi>H<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>P<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>W<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>P<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","切小塊、攤平、排成一串；反過來叫拼回（unpatchify）"],["注意力","attention","<math aria-label=\"softmax(QKᵀ/√d_h)V\"><mrow><mi>softmax<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><mo stretchy=\"false\">(<\/mo><mi>Q<\/mi><msup><mi>K<\/mi><mi>T<\/mi><\/msup><mo lspace=\"0\" rspace=\"0\">/<\/mo><msqrt><msub><mi>d<\/mi><mi>h<\/mi><\/msub><\/msqrt><mo stretchy=\"false\">)<\/mo><mi>V<\/mi><\/mrow><\/math>","每一塊拿自己的問題（query）去比對所有塊的標籤（key），按權重平均內容（value）"],["自注意力","self-attention","—","問題、標籤、內容都來自影像自己"],["交叉注意力","cross-attention","—","問題來自影像，標籤和內容來自文字；輸出個數跟影像塊一樣多"],["自適應層正規化","adaptive layer normalization（adaLN）","—","先把每塊拉到同一個尺度，再由 t 決定每個通道放大多少、平移多少"],["擴散 Transformer","diffusion transformer（DiT）","—","同一種方塊疊很多層，每層有注意力、小網路與殘差"],["時間慣例","time convention","<math aria-label=\"t=0\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math>","一篇論文的 t=0 是雜訊還是資料；本課 t=0 是雜訊"]],"listen":[{"t":3532,"lec":"L04","word":"boost up","gloss":"撐大；把只有一個數字的時間，撐成一條長向量"},{"t":3758,"lec":"L04","word":"beyond the scope","gloss":"超出這堂課的範圍；這句之後 Transformer 講得很快，看不懂是正常的"},{"t":3788,"lec":"L04","word":"flavors","gloss":"各種版本，不是口味；<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=4008s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4008\">66:48<\/a> 又說一次"}],"nav":[{"t":3459,"lec":"L04","text":"開講：網路架構","plain":"開講：網路架構"},{"t":3504,"lec":"L04","text":"網路輸出什麼","plain":"網路輸出什麼"},{"t":3522,"lec":"L04","text":"時間怎麼變成向量","plain":"時間怎麼變成向量"},{"t":3573,"lec":"L04","text":"文字提示","plain":"文字提示"},{"t":3672,"lec":"L04","text":"影像","plain":"影像"},{"t":3699,"lec":"L04","text":"切塊","plain":"切塊"},{"t":3788,"lec":"L04","text":"DiT","plain":"DiT"},{"t":3884,"lec":"L04","text":"注意力","plain":"注意力"},{"t":3945,"lec":"L04","text":"自注意力","plain":"自注意力"},{"t":3967,"lec":"L04","text":"交叉注意力","plain":"交叉注意力"},{"t":3989,"lec":"L04","text":"adaLN","plain":"adaLN"},{"t":4024,"lec":"L04","text":"去做 Lab 3","plain":"去做 Lab 3"},{"t":4060,"lec":"L04","text":"SD3","plain":"SD3"},{"t":4219,"lec":"L04","text":"MovieGen","plain":"MovieGen"},{"t":4342,"lec":"L04","text":"影片的切塊","plain":"影片的切塊"},{"t":4427,"lec":"L04","text":"時間慣例","plain":"時間慣例"},{"t":4820,"lec":"L04","text":"下一堂","plain":"下一堂"},{"t":4299,"lec":"L04","text":"問答與一張圖，第一次可略過","plain":"問答與一張圖，第一次可略過"}],"navNote":"<h3>五個陷阱<\/h3>\n<ol><li><strong>網路輸出不是圖片<\/strong>（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=3509s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"3509\">58:29<\/a>）：形狀與 x 相同，內容是速度。<\/li><li><strong>SD3 不是交叉注意力<\/strong>（投影片 p.31、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=4196s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4196\">69:56<\/a>）：SD3 把文字與影像塊接成一串一起做注意力；MovieGen 才用交叉注意力。<\/li><li><strong>兩種時間<\/strong>（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=4299s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4299\">71:39<\/a>）：t 是加噪進度，T 是影片的幀。<\/li><li><strong>6,000 張 GPU<\/strong>（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=4358s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4358\">72:38<\/a>）：口頭約數；MovieGen 論文寫最多 6,144 張 H100。<\/li><li><strong>時間慣例<\/strong>（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=g0MB1CCBmsI&amp;t=4427s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L04\" data-t=\"4427\">73:47<\/a>）：SD3 論文 t=0 是資料，MovieGen 與本課 t=0 是雜訊。<\/li><\/ol>\n<p>另外兩個寫法差異：投影片 p.22 的時間嵌入係數讓長度只有 0.707，以講義式 (68) 為準；講義 U-Net 的中間層也叫 latent，數字是輸入的 2.67 倍，不是壓縮。<\/p>","practice":{"title":"練習：算塊數與格子數","html":"<ol><li>一張 4×32×32 的潛在影像，用 P=4 切塊，會得到幾個向量？每個向量有幾個數？<\/li><li>同一張用 P=1 切，塊數是 P=4 的幾倍？注意力要比對的格子又是幾倍？<\/li><li>一張 3×32×48 的影像，用 P=4 切，會得到幾個向量？<\/li><\/ol>"},"answers":["是一個形狀和 x 一樣的東西：4×32×32。可是它不是圖，每一格裝的是速度，告訴此刻這一點該往哪裡走。圖片要沿著箭頭解 ODE，一步一步走出來。","256 個（高 16 格、寬 16 格，每塊 4×2×2＝16 個數）。像素影像一樣 2×2 切有 16,384 塊，是 64 倍；注意力要比對的格子是塊數的平方，所以是 64×64＝4,096 倍。數字個數只差 48 倍（196,608 對 4,096），三個倍數不要混用。像素影像也用 2×2 切是假設情境。","是資料。SD3 論文的 t 方向和本課相反（t=0 資料、t=1 雜訊）。片中的簡化模型裡，不換算直接套用，粒子會飛到大約 −6.6，而資料在 2 附近。"],"answerExtra":"<p><strong>練習答案<\/strong>：1. (32/4)×(32/4)＝64 個，每個 4×4×4＝64 個數。2. P=1 有 1,024 塊，是 64 塊的 16 倍；格子是 16×16＝256 倍。3. (32/4)×(48/4)＝8×12＝96 個，每個 3×4×4＝48 個數。<\/p>\n<p>片中注意力、adaLN 與小 DiT 的權重都是隨機數、沒有訓練，只看形狀；時間慣例的粒子實驗是一維高斯的簡化模型。練習題的 64、1,024、96 與片中計算一致（P=4、P=1 的塊數、長方形切塊都已實算）。<\/p>","extra":[]},"learn":{"unit":"06","notes":{"keypoints":["向量場網路吃進 x、t、y 三種形狀完全不同的東西，輸出的形狀和 x 一模一樣；但每一格裝的是速度，不是圖片，圖片要沿著箭頭解 ODE 一步一步走出來。","三個輸入先各自變成向量：t 用一排頻率不同的正弦波撐成長度 1 的一條，文字交給 CLIP、T5 這類預訓練模型變成一串，影像（或潛在影像）切成小塊攤平排成一串。","DiT 是同一種方塊疊很多層：影像塊用自注意力互相問，用交叉注意力去問文字，時間不走注意力而走 adaLN 轉動每個通道的旋鈕，最後拼回 x 的形狀。","注意力讓每一塊都去問所有的塊，要比對的格子是塊數的平方；塊數多 64 倍，格子就多 4,096 倍，所以先壓到潛在空間對 DiT 特別重要。","SD3 與 MovieGen 用的是同一套零件，但接文字的方法不同：SD3 把文字和影像塊接成一串一起做注意力，MovieGen 才用交叉注意力。","讀別的論文先查 t=0 那一端是什麼：本課與 MovieGen 的 t=0 是雜訊，SD3 論文的 t=0 是資料，不換算直接套用會走錯地方。"],"formulas":[{"id":"f1","title":"時間嵌入：一個數字撐成一條","plain":"拿一排頻率不同的正弦波，讀出它們在 t 的高度排成一條；係數讓整條長度剛好是 1","parts":[{"m":"<math aria-label=\"e(t)\"><mrow><mi>e<\/mi><mo stretchy=\"false\">(<\/mo><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"時間嵌入：把只有一個數字的 t 撐成長度 d 的向量"},{"m":"<math aria-label=\"=\"><mrow><mo>=<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"√{2/d}\"><mrow><msqrt><mrow><mn>2<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>d<\/mi><\/mrow><\/msqrt><\/mrow><\/math>","say":"係數，讓整條的長度剛好是 1（投影片 p.22 寫 1/√d，長度只剩 0.707）"},{"m":"<math aria-label=\"[cos(2πw_1 t), …, cos(2πw_{d/2} t),\"><mrow><mo stretchy=\"false\">[<\/mo><mi>c<\/mi><mi>o<\/mi><mi>s<\/mi><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mi>π<\/mi><msub><mi>w<\/mi><mn>1<\/mn><\/msub><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mo>,<\/mo><mi>…<\/mi><mo>,<\/mo><mi>c<\/mi><mi>o<\/mi><mi>s<\/mi><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mi>π<\/mi><msub><mi>w<\/mi><mrow><mi>d<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><mn>2<\/mn><\/mrow><\/msub><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mo>,<\/mo><\/mrow><\/math>","say":"前一半：d/2 條頻率不同的餘弦波在 t 的高度"},{"m":"<math aria-label=\"sin(2πw_1 t), …, sin(2πw_{d/2} t)]\"><mrow><mi>s<\/mi><mi>i<\/mi><mi>n<\/mi><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mi>π<\/mi><msub><mi>w<\/mi><mn>1<\/mn><\/msub><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mo>,<\/mo><mi>…<\/mi><mo>,<\/mo><mi>s<\/mi><mi>i<\/mi><mi>n<\/mi><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mi>π<\/mi><msub><mi>w<\/mi><mrow><mi>d<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><mn>2<\/mn><\/mrow><\/msub><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>","say":"後一半：同樣頻率的正弦；每一對 cos² 加 sin² 都是 1"}],"src":{"lec":"L04","t":3532,"video":73,"slide":"p.22","note":"p.42 式 (68)(69)"}},{"id":"f2","title":"切塊：塊數只看高與寬","plain":"高切成 H/P 格、寬切成 W/P 格，相乘就是序列長度；通道數 C 不影響塊數，只讓每一塊有 C·P² 個數","parts":[{"m":"<math aria-label=\"N\"><mrow><mi>N<\/mi><\/mrow><\/math>","say":"塊數，也就是切完之後序列有幾個向量"},{"m":"<math aria-label=\"=\"><mrow><mo>=<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"(H/P)\"><mrow><mo stretchy=\"false\">(<\/mo><mi>H<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>P<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"高方向切成幾格（P 是小方塊的邊長）"},{"m":"<math aria-label=\"(W/P)\"><mrow><mo stretchy=\"false\">(<\/mo><mi>W<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>P<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"寬方向切成幾格"}],"src":{"lec":"L04","t":3703,"video":168,"slide":"p.24","note":"p.43"}},{"id":"f3","title":"注意力：拿問題去比對所有標籤","plain":"每一塊的問題跟所有塊的標籤做點積，縮小後換成加起來是 1 的權重，再按權重平均內容；一串進、一串出","parts":[{"m":"<math aria-label=\"softmax(\"><mrow><mi>softmax<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><mo stretchy=\"false\">(<\/mo><\/mrow><\/math>","say":"對每一列做 softmax：把分數換成加起來是 1 的權重"},{"m":"<math aria-label=\"QKᵀ\"><mrow><mi>Q<\/mi><msup><mi>K<\/mi><mi>T<\/mi><\/msup><\/mrow><\/math>","say":"每個問題（query）跟每個標籤（key）的點積分數"},{"m":"<math aria-label=\"/√d_h\"><mrow><mo lspace=\"0\" rspace=\"0\">/<\/mo><msqrt><msub><mi>d<\/mi><mi>h<\/mi><\/msub><\/msqrt><\/mrow><\/math>","say":"除以根號 d_h，免得分數太大、權重全擠到一塊上"},{"m":"<math aria-label=\")\"><mrow><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"V\"><mrow><mi>V<\/mi><\/mrow><\/math>","say":"按權重把每一塊的內容（value）加權平均"}],"src":{"lec":"L04","t":3889,"video":236,"slide":"p.27","note":"p.44 Remark 29"}},{"id":"f4","title":"注意力的代價：格子數是 N²","plain":"每一塊都要問所有的塊，分數表是 N 列 N 行；塊數變 64 倍，格子就變 64×64＝4,096 倍","parts":[{"m":"<math aria-label=\"QKᵀ\"><mrow><mi>Q<\/mi><msup><mi>K<\/mi><mi>T<\/mi><\/msup><\/mrow><\/math>","say":"分數表：每個問題對每個標籤各一格"},{"m":"<math aria-label=\"∈\"><mrow><mi>∈<\/mi><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"ℝ^{N×N}\"><mrow><msup><mi>ℝ<\/mi><mrow><mi>N<\/mi><mo>×<\/mo><mi>N<\/mi><\/mrow><\/msup><\/mrow><\/math>","say":"N 列 N 行，共 N² 格；塊數加倍，格子變四倍"}],"src":{"lec":"L04","t":3904,"video":236,"slide":"p.27","note":"p.44 Remark 29"}}]},"practice":[{"id":"p1","prompt":"一張 4×32×32 的潛在影像用 P=4 切塊，會得到幾個向量？","answer":64,"tol":0.001,"calc":"(32/4)*(32/4)","hint":"N=(H/P)(W/P)，通道數不影響塊數"},{"id":"p2","prompt":"同上，每個向量有幾個數？","answer":64,"tol":0.001,"calc":"4*4*4","hint":"每塊有 C·P² 個數，C=4、P=4"},{"id":"p3","prompt":"同一張改用 P=1 切，塊數是 P=4 的幾倍？","answer":16,"tol":0.001,"calc":"(32*32)/((32/4)*(32/4))","hint":"P=1 時塊數是 32×32"},{"id":"p4","prompt":"P=1 時注意力要比對的格子，是 P=4 的幾倍？","answer":256,"tol":0.001,"calc":"((32*32)/((32/4)*(32/4)))**2","hint":"格子數是塊數的平方，倍數也要平方"},{"id":"p5","prompt":"一張 3×32×48 的影像用 P=4 切，會得到幾個向量？","answer":96,"tol":0.001,"calc":"(32/4)*(48/4)","hint":"高、寬各自除以 P 再相乘"}],"quiz":[{"id":"q01","type":"choice","dim":"concept","level":1,"prompt":"向量場網路吃進潛在影像 x、時間 t、提示 y。它輸出的是什麼？","choices":["和 x 同形狀的向量場：每一格是此刻這一點該往哪裡走的速度","一張去好雜訊的潛在影像，直接就是生成結果","一個分數，表示這張圖有多符合提示","解碼器還原後的像素圖片"],"answer":0,"explain":"原片 58:29 學生答「潛在影像」，講者回答形狀和 x 一樣。形狀答對了，內容卻是速度；圖片要沿著箭頭解 ODE 一步一步走出來。","src":{"lec":"L04","t":3510,"video":14,"slide":"p.21"}},{"id":"q02","type":"tf","dim":"concept","level":2,"prompt":"依原片的 DiT 標準設計，時間 t 只是一個數字，直接當成影像多一個通道串接進去就好，不需要另外嵌入。","answer":false,"explain":"原片 58:45 說時間只有一維，其他輸入都很高維，所以先用一排正弦波撐成長度 1 的 d 維向量。進了 DiT 之後，t 走 adaLN 決定每個通道放大與平移多少，不是當成像素通道。","src":{"lec":"L04","t":3525,"video":73,"slide":"p.22"}},{"id":"q03","type":"fill","dim":"formula","level":2,"prompt":"講義式 (68) 的時間嵌入是一排 <math aria-label=\"cos(2πw_i t)\"><mrow><mi>c<\/mi><mi>o<\/mi><mi>s<\/mi><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mi>π<\/mi><msub><mi>w<\/mi><mi>i<\/mi><\/msub><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 與 <math aria-label=\"sin(2πw_i t)\"><mrow><mi>s<\/mi><mi>i<\/mi><mi>n<\/mi><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mi>π<\/mi><msub><mi>w<\/mi><mi>i<\/mi><\/msub><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>，前面乘上係數 ＿＿，整條向量的長度才會剛好是 1。","accept":["√(2/d)","sqrt(2/d)","√{2/d}","根號(2/d)","根號2/d","√2/√d","sqrt(2)/sqrt(d)","(2/d)^0.5","根號d分之2"],"explain":"一共 d/2 對，每對 cos² 加 sin² 等於 1，乘上係數平方 2/d 後總和剛好是 1。投影片 p.22 寫 <math aria-label=\"1/√d\"><mrow><mn>1<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><msqrt><mi>d<\/mi><\/msqrt><\/mrow><\/math>，長度只有 0.707，以講義為準。","src":{"lec":"L04","t":3557,"video":73,"slide":"p.22","note":"p.42 式 (68)"}},{"id":"q04","type":"numeric","dim":"compute","level":2,"prompt":"如果照投影片 p.22 的係數 <math aria-label=\"1/√d\"><mrow><mn>1<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><msqrt><mi>d<\/mi><\/msqrt><\/mrow><\/math>，d=32 時時間嵌入的長度是多少？（取到小數第三位）","answer":0.707,"tol":0.001,"calc":"math.sqrt(16*(1/math.sqrt(32))**2)","explain":"16 對 cos²＋sin²，每對乘上 1/32，總和 0.5，開根號約 0.707；跟 d 是多少無關。改用講義的 <math aria-label=\"√{2/d}\"><mrow><msqrt><mrow><mn>2<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>d<\/mi><\/mrow><\/msqrt><\/mrow><\/math>，總和才是 1。","src":{"video":73,"slide":"p.22","note":"p.42 式 (68)"}},{"id":"q05","type":"choice","dim":"concept","level":1,"prompt":"原片說提示文字通常交給 CLIP、T5 這類預訓練模型處理。為什麼？","choices":["網路只吃數字；文字要先換成一串向量，而現成模型已經學好怎麼把語言嵌入","網路可以直接讀字串，預訓練模型只是用來檢查拼字","預訓練模型會把整句話換成單一類別編號，網路再查表","為了讓每句提示都變成長度固定的一條向量，不管句子多長"],"answer":0,"explain":"文字不能直接餵進網路，要先嵌入；原片 60:43 說結果是長度 S 的一串向量，S 隨句子改變。只有提示是類別時，才是每一類查表拿一條向量。","src":{"lec":"L04","t":3594,"video":132,"slide":"p.23"}},{"id":"q06","type":"numeric","dim":"compute","level":1,"prompt":"一張 4×64×64 的潛在影像用 P=2 切塊，序列有幾個向量？","answer":1024,"tol":0.5,"calc":"(64/2)*(64/2)","explain":"高 32 格、寬 32 格，共 1,024 個。通道數 4 不影響塊數，只讓每一塊有 4×2×2＝16 個數。","src":{"lec":"L04","t":3703,"video":168,"slide":"p.24","note":"p.43"}},{"id":"q07","type":"numeric","dim":"compute","level":3,"prompt":"同一張 4×32×32 的潛在影像，切塊邊長從 P=2 改成 P=4，注意力要比對的格子數變成原來的幾倍？（填小數）","answer":0.0625,"tol":0.0001,"calc":"((32/4)*(32/4))**2/((32/2)*(32/2))**2","explain":"塊數從 256 變 64，是 1/4；格子數是塊數的平方，所以是 1/16＝0.0625。代價是每一塊變粗，細節要靠一塊裡的 64 個數表達。","src":{"video":236,"slide":"p.27"}},{"id":"q08","type":"choice","dim":"link","level":3,"prompt":"單元 05 的例子把 3×256×256 的像素圖壓成 4×32×32 的潛在影像，數字個數少 48 倍。如果兩者都用 2×2 切塊，序列長度與注意力格子各差幾倍？","choices":["64 倍與 4,096 倍","48 倍與 2,304 倍","48 倍與 48 倍","8 倍與 64 倍"],"answer":0,"explain":"塊數只看高與寬：16,384 對 256，差 64 倍；格子是塊數的平方，差 4,096 倍。48 倍把通道也算進去了，不能拿來算塊數。對照單元 05：潛在空間的好處在注意力這裡被平方放大。","src":{"lec":"L04","t":3725,"video":168,"slide":"p.24"}},{"id":"q09","type":"match","dim":"formula","level":1,"prompt":"把符號和它的意思配起來。","pairs":[["<math aria-label=\"N\"><mrow><mi>N<\/mi><\/mrow><\/math>","塊數，也就是序列長度"],["<math aria-label=\"P\"><mrow><mi>P<\/mi><\/mrow><\/math>","切塊小方塊的邊長"],["<math aria-label=\"C·P²\"><mrow><mi>C<\/mi><mo lspace=\"0\" rspace=\"0\">·<\/mo><msup><mi>P<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>","每一塊攤平後有幾個數"],["<math aria-label=\"d_h\"><mrow><msub><mi>d<\/mi><mi>h<\/mi><\/msub><\/mrow><\/math>","每個問題、標籤向量的長度"],["<math aria-label=\"√{2/d}\"><mrow><msqrt><mrow><mn>2<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>d<\/mi><\/mrow><\/msqrt><\/mrow><\/math>","讓時間嵌入長度剛好是 1 的係數"]],"explain":"<math aria-label=\"N=(H/P)(W/P)\"><mrow><mi>N<\/mi><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mi>H<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>P<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>W<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>P<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 裡沒有 C，所以通道數只影響每塊多長；<math aria-label=\"d_h\"><mrow><msub><mi>d<\/mi><mi>h<\/mi><\/msub><\/mrow><\/math> 出現在注意力的 <math aria-label=\"√d_h\"><mrow><msqrt><msub><mi>d<\/mi><mi>h<\/mi><\/msub><\/msqrt><\/mrow><\/math>；<math aria-label=\"√{2/d}\"><mrow><msqrt><mrow><mn>2<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>d<\/mi><\/mrow><\/msqrt><\/mrow><\/math> 是講義式 (68) 的係數。","src":{"video":168,"slide":"p.24","note":"p.43"}},{"id":"q10","type":"choice","dim":"formula","level":2,"prompt":"在 <math aria-label=\"softmax(QKᵀ/√d_h)V\"><mrow><mi>softmax<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><mo stretchy=\"false\">(<\/mo><mi>Q<\/mi><msup><mi>K<\/mi><mi>T<\/mi><\/msup><mo lspace=\"0\" rspace=\"0\">/<\/mo><msqrt><msub><mi>d<\/mi><mi>h<\/mi><\/msub><\/msqrt><mo stretchy=\"false\">)<\/mo><mi>V<\/mi><\/mrow><\/math> 裡，除以 <math aria-label=\"√d_h\"><mrow><msqrt><msub><mi>d<\/mi><mi>h<\/mi><\/msub><\/msqrt><\/mrow><\/math> 是為了什麼？","choices":["讓點積分數不要太大，免得 softmax 之後權重幾乎全擠到一塊上","讓每一列的權重加起來剛好是 1","讓輸出向量的長度固定是 1","把 N 個塊的內容平均起來"],"answer":0,"explain":"加起來是 1 是 softmax 的工作；長度固定是 1 是時間嵌入的性質；加權平均是乘上 V 那一步。除以 <math aria-label=\"√d_h\"><mrow><msqrt><msub><mi>d<\/mi><mi>h<\/mi><\/msub><\/msqrt><\/mrow><\/math> 只負責把分數縮回合理的大小。","src":{"lec":"L04","t":3889,"video":236,"slide":"p.27","note":"p.44 Remark 29"}},{"id":"q11","type":"choice","dim":"formula","level":3,"prompt":"交叉注意力裡，Q 來自 N 個影像塊，K、V 來自長度 S 的提示嵌入。輸出有幾個向量？","choices":["N 個，跟影像塊一樣多","S 個，跟提示一樣長","N＋S 個，兩串接起來","N×S 個，每一對一個"],"answer":0,"explain":"<math aria-label=\"QKᵀ\"><mrow><mi>Q<\/mi><msup><mi>K<\/mi><mi>T<\/mi><\/msup><\/mrow><\/math> 是 N 列 S 行的權重表，乘上 S 列的 V，得到 N 列。所以提示多長都不會改變影像的形狀；N×S 是權重表的格子數，不是輸出個數。","src":{"lec":"L04","t":3969,"video":302,"slide":"p.28"}},{"id":"q12","type":"choice","dim":"term","level":2,"prompt":"依原片與投影片 p.28 的標準 DiT 設計，時間 t 透過 adaLN 進入每一層。adaLN 是什麼？","choices":["adaptive layer normalization：先把每一塊拉到同一個尺度，再由 t 決定每個通道放大多少、平移多少","attention layer normalization：把 t 當作交叉注意力的 key 與 value，跟文字一起被查詢","average layer normalization：把所有影像塊平均成一塊，再加上 t","adaptive latent normalization：把 t 先壓進潛在空間，再跟 x 相加"],"answer":0,"explain":"原片 66:29 說 scale 和 offset 由時間決定。時間不走注意力，走旁邊一條控制線，所以 t 不同，同一個 x 出來的結果就不同。","src":{"lec":"L04","t":3989,"video":302,"slide":"p.28","note":"p.44–45"}},{"id":"q13","type":"order","dim":"concept","level":2,"prompt":"把潛在擴散模型裡一次「算箭頭到出圖」的流程排好。","items":["t、y、x 各自換成向量：時間嵌入、提示嵌入、切塊","影像塊通過很多層 DiT block（自注意力、交叉注意力、MLP，t 經 adaLN 調整）","把序列拼回（unpatchify）成 x 的形狀","得到每一格的速度","沿著速度解 ODE，一步一步走出潛在影像","解碼器把潛在影像還原成圖片"],"explain":"前四步是網路算一次箭頭；第五步要把網路呼叫很多次；最後一步用的是單元 05 的解碼器。網路本身從不直接吐出圖片。","src":{"lec":"L04","t":3802,"video":302,"slide":"p.26"}},{"id":"q14","type":"match","dim":"term","level":1,"prompt":"把英文術語和白話配起來。","pairs":[["query","問題：拿去比對別人"],["key","標籤：被拿來比對"],["value","內容：按權重被平均"],["token","序列中的一個向量"],["MM-DiT","SD3 的架構：文字與影像塊接成一串一起做注意力"]],"explain":"原片 65:07 說注意力有 queries、keys、values 三個輸入。MM-DiT 是 SD3 論文的設計，跟交叉注意力不同。","src":{"lec":"L04","t":3907,"video":236,"slide":"p.27"}},{"id":"q15","type":"listen","dim":"listen","level":1,"prompt":"學生答「潛在影像」之後，講者怎麼描述網路的輸出？","clip":{"lec":"L04","t":3510,"dur":6},"choices":["the same shape of X","the same size as the image","a sharper version of X","the same scale as X"],"answer":0,"explain":"原句：\"Yes, another latent vector. So the same shape of X.\" 講者只說形狀相同；裡面裝的是速度，不是圖片。","src":{"lec":"L04","t":3510,"video":14}},{"id":"q16","type":"tf","dim":"link","level":2,"prompt":"SD3 訓練時偶爾把提示丟掉、照常做流匹配，是為了推論時能用無分類器引導；如果提示只是類別，丟掉提示就相當於查類別表裡多出來的那一列空標記。","answer":true,"explain":"原片 68:30 說 SD3 大約 20% 的時間丟掉提示（口頭舉例）。對照單元 04：同一個網路要同時學會有提示與沒提示的箭頭，CFG 才能取兩者的差並放大。","src":{"lec":"L04","t":4110,"video":132}},{"id":"q17","type":"choice","dim":"concept","level":3,"prompt":"SD3 與 MovieGen 把文字接進網路的方法，下列何者正確？","choices":["SD3 把文字與影像塊接成一串一起做注意力；MovieGen 用交叉注意力","兩者都用交叉注意力，投影片 p.31 就是這樣寫","SD3 用交叉注意力；MovieGen 把文字與影像塊接成一串","兩者都把文字當成 adaLN 的控制訊號，完全不走注意力"],"answer":0,"explain":"投影片 p.31 寫 cross-attention，但原片 69:56 講者口頭在修正：\"They don't use cross attention\"。SD3 論文的 MM-DiT 把兩種序列接起來做聯合注意力；MovieGen 才在每層加交叉注意力。","src":{"lec":"L04","t":4196,"video":408,"slide":"p.31"}},{"id":"q18","type":"numeric","dim":"compute","level":3,"prompt":"MovieGen 先用自編碼器在時間與空間各壓 8 倍，再每格切 1×2×2（時間 1、空間 2×2）。一段 256 幀、768×768 的影片，最後序列有幾個向量？","answer":73728,"tol":0.5,"calc":"(256/8)*((768/8)/2)*((768/8)/2)","explain":"壓縮後是 32×96×96，再切成 32×48×48＝73,728，與論文寫的約 73K 相符。原片 72:22 說切塊變 3D，但論文時間方向的切塊是 1，時間的壓縮由自編碼器負責。","src":{"lec":"L04","t":4342,"video":408,"slide":"p.33"}},{"id":"q19","type":"listen","dim":"listen","level":2,"prompt":"講者說明本課的時間慣例，他怎麼說？","clip":{"lec":"L04","t":4432,"dur":5},"choices":["data was one and noise was zero","noise was one and data was zero","data was zero and noise was infinity","data was one and noise was infinity"],"answer":0,"explain":"原句：\"So for us data was one and noise was zero.\" 下一句才說原始擴散模型的慣例：資料在時間 0，往無限大變成雜訊，整個反過來。","src":{"lec":"L04","t":4432,"video":476,"slide":"p.35"}},{"id":"q20","type":"choice","dim":"link","level":3,"prompt":"講義 §6.1.3 的 U-Net 把中間層寫成 <math aria-label=\"x^{latent}\"><mrow><msup><mi>x<\/mi><mrow><mi>l<\/mi><mi>a<\/mi><mi>t<\/mi><mi>e<\/mi><mi>n<\/mi><mi>t<\/mi><\/mrow><\/msup><\/mrow><\/math>，形狀 512×32×32；輸入是 3×256×256。它跟單元 05 的潛在空間是同一回事嗎？","choices":["不是：中間有 524,288 個數，是輸入的約 2.67 倍，不是壓縮","是：高寬從 256 縮到 32，所以跟 VAE 一樣是壓縮","是：U-Net 的中間層就是 VAE 編碼器的輸出","不是：中間層比輸入少 48 倍，比 VAE 壓得更多"],"answer":0,"explain":"512×32×32＝524,288，3×256×256＝196,608；高寬變小但通道變多，總數反而變多。對照單元 05：VAE 的 4×32×32 只有 4,096 個數，那才是壓縮。原片沒講 U-Net，只在講義。","src":{"note":"p.45–46 §6.1.3"}}],"rubric":{"concept":["能說出網路吃 x、t、y 三個輸入，輸出和 x 同形狀","能解釋輸出是速度不是圖片，並說出三個輸入各自怎麼變成向量","能說明影像走自注意力、文字走交叉注意力、時間走 adaLN 的分工","能比較 SD3 與 MovieGen 接文字的差異，並說明讀論文為何先查 t=0"],"formula":["能認出切塊公式與注意力公式各屬於 DiT 的哪個零件","能說出 N、P、C·P² 各代表什麼，並指出通道數不影響塊數","能解釋 √d_h 與 softmax 各自的作用，以及係數 √(2/d) 怎麼讓長度為 1","能從矩陣形狀推出交叉注意力輸出 N 個向量，並指出投影片係數的錯"],"compute":["能照 N=(H/P)(W/P) 算出一張潛在影像的塊數","能算出每塊的數字個數 C·P²，以及改變 P 後塊數的倍數","能分清 48 倍、64 倍、4,096 倍，算出注意力格子的倍數","能算出影片壓縮加切塊後的序列長度，並驗算時間嵌入的長度"],"term":["能把 embedding、patchify、attention 對上中文名稱","能說出自注意力與交叉注意力的 Q、K、V 各來自哪裡","能用白話解釋 adaLN、DiT、unpatchify 與 time convention","能分辨 MM-DiT 與交叉注意力，並說明 U-Net 的 latent 不是壓縮"],"listen":["聽到 boost up、flavors 時，能認出在講時間嵌入與 DiT 變體","能在原片聽出 same shape of X 與 queries、keys","能跟上 62:38 之後的 Transformer 速講，聽出自注意力與交叉注意力","能聽出講者口頭修正 SD3 不用交叉注意力，以及兩種時間慣例的說法"],"link":["能說出這支網路就是前面單元要學的向量場","能說出 SD3 丟提示是為了做 CFG，並對照單元 04 的空標記","能用塊數平方說明單元 05 先壓到潛在空間對 DiT 的好處","能分辨 U-Net 的 latent 與單元 05 的潛在空間，並換算不同論文的 t"]},"cards":[{"id":"c1","deck":"formula","front":"時間嵌入 <math aria-label=\"e(t) = ＿＿ [cos(2πw_i t), sin(2πw_i t)]\"><mrow><mi>e<\/mi><mo stretchy=\"false\">(<\/mo><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mi>＿<\/mi><mi>＿<\/mi><mo stretchy=\"false\">[<\/mo><mi>c<\/mi><mi>o<\/mi><mi>s<\/mi><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mi>π<\/mi><msub><mi>w<\/mi><mi>i<\/mi><\/msub><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mo>,<\/mo><mi>s<\/mi><mi>i<\/mi><mi>n<\/mi><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mi>π<\/mi><msub><mi>w<\/mi><mi>i<\/mi><\/msub><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>","back":"<math aria-label=\"√{2/d}\"><mrow><msqrt><mrow><mn>2<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>d<\/mi><\/mrow><\/msqrt><\/mrow><\/math>：讓長度剛好是 1；投影片的 <math aria-label=\"1/√d\"><mrow><mn>1<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><msqrt><mi>d<\/mi><\/msqrt><\/mrow><\/math> 只有 0.707"},{"id":"c2","deck":"formula","front":"切塊後的塊數 <math aria-label=\"N = ＿＿\"><mrow><mi>N<\/mi><mo>=<\/mo><mi>＿<\/mi><mi>＿<\/mi><\/mrow><\/math>","back":"<math aria-label=\"(H/P)(W/P)\"><mrow><mo stretchy=\"false\">(<\/mo><mi>H<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>P<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>W<\/mi><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>P<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>：只看高與寬；每塊有 <math aria-label=\"C·P²\"><mrow><mi>C<\/mi><mo lspace=\"0\" rspace=\"0\">·<\/mo><msup><mi>P<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 個數"},{"id":"c3","deck":"formula","front":"注意力 <math aria-label=\"softmax(＿＿)V\"><mrow><mi>softmax<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><mo stretchy=\"false\">(<\/mo><mi>＿<\/mi><mi>＿<\/mi><mo stretchy=\"false\">)<\/mo><mi>V<\/mi><\/mrow><\/math>","back":"<math aria-label=\"QKᵀ/√d_h\"><mrow><mi>Q<\/mi><msup><mi>K<\/mi><mi>T<\/mi><\/msup><mo lspace=\"0\" rspace=\"0\">/<\/mo><msqrt><msub><mi>d<\/mi><mi>h<\/mi><\/msub><\/msqrt><\/mrow><\/math>：問題比對標籤，縮小後換成權重"},{"id":"c4","deck":"formula","front":"塊數變 64 倍，注意力要比對的格子變 ＿＿ 倍","back":"4,096 倍：分數表是 <math aria-label=\"N×N\"><mrow><mi>N<\/mi><mo>×<\/mo><mi>N<\/mi><\/mrow><\/math>，格子數是 <math aria-label=\"N²\"><mrow><msup><mi>N<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>"},{"id":"c5","deck":"term","front":"MM-DiT","back":"SD3 的架構：文字與影像塊接成一串一起做注意力，不是交叉注意力"},{"id":"c6","deck":"term","front":"U-Net","back":"講義 §6.1.3 的另一種架構，原片沒講；中間層也叫 latent，但數字是輸入的 2.67 倍，不是壓縮"},{"id":"c7","deck":"term","front":"query／key／value","back":"注意力的問題、標籤、內容：<math aria-label=\"Q\"><mrow><mi>Q<\/mi><\/mrow><\/math>、<math aria-label=\"K\"><mrow><mi>K<\/mi><\/mrow><\/math>、<math aria-label=\"V\"><mrow><mi>V<\/mi><\/mrow><\/math>"}]},"answer":"<strong>三個輸入各自先變成「一串向量」：時間用一排正弦波撐成一條，文字交給現成的模型變成一列，影像切成小塊排成一串。DiT 讓這些向量互相查詢（注意力），時間走旁邊的控制線（adaLN），最後拼回 x 的形狀。出來的是每一格的速度，不是圖片。注意力要比對的格子是塊數的平方，所以先壓到潛在空間特別重要。讀別的論文時，先查 t=0 那一端是雜訊還是資料。<\/strong>","status":"live"},{"no":"07","title":"離散擴散","lecture":"L05","youtube":"bzHTLFfoX-4","topic":"CTMC 與離散擴散","range":null,"question":"文字這種離散資料，也能用流與擴散生成嗎？","timeline":[[0,"片頭"],[19,"小節 1｜從箭頭到跳躍"],[80,"小節 2｜速率矩陣：多快跳到哪裡"],[146,"小節 3｜跳一小步"],[206,"小節 4｜一次只改一格"],[249,"小節 5｜淡出雜訊，淡入資料"],[322,"小節 6｜條件速率與邊際化"],[388,"小節 7｜訓練就是分類"],[463,"小節 8｜遮罩擴散：幾步才夠"],[554,"小節 9｜打開原片＋系列總結"]],"sheet":"<p><a href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\">打開原片<\/a>（本堂從 <a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=11s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"11\">00:11<\/a> 開始）。建議用<a href=\"#L05\" data-lec=\"L05\">原片字幕頁<\/a>，可逐句重聽、調慢速度；公式以投影片與講義為準。<\/p>\n<h3>看前導片之前：先答一次<\/h3>\n<p>先寫下答案，不查資料。看完原片後再答同樣三題，比較自己的差異。<\/p>\n<ol><li>字沒有方向。離散擴散用什麼代替向量場？它的一欄代表什麼？<\/li><li>遮罩擴散一口氣在一步內把全部 [MASK] 解開，會出什麼問題？<\/li><li>訓練離散擴散的網路，本質上是在做哪一種我們已經會的任務？<\/li><\/ol>\n<h3>今天的八個詞<\/h3>\n<div class=\"table-wrap vocab\"><table><thead><tr><th>中文<\/th><th>英文<\/th><th>符號<\/th><th>白話<\/th><\/tr><\/thead><tbody><tr><td>詞元<\/td><td>token<\/td><td>—<\/td><td>一句話切成的一格一格<\/td><\/tr><tr><td>連續時間馬可夫鏈<\/td><td>continuous-time Markov chain（CTMC）<\/td><td><math aria-label=\"X_t\"><mrow><msub><mi>X<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math><\/td><td>時間連續地走、狀態用跳的；下一步只看現在<\/td><\/tr><tr><td>速率矩陣<\/td><td>rate matrix<\/td><td><math aria-label=\"Q_t(y|x)\"><mrow><msub><mi>Q<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>從 x 跳到 y 有多快；一欄＝出發點，欄和為 0<\/td><\/tr><tr><td>轉移機率<\/td><td>transition probability<\/td><td><math aria-label=\"p_{t+h|t}(y|x)\"><mrow><msub><mi>p<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mi>h<\/mi><mo stretchy=\"false\">|<\/mo><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>過了 h 時間從 x 到 y 的機率；一小步時約 h 乘速率<\/td><\/tr><tr><td>分解式<\/td><td>factorized<\/td><td><math aria-label=\"d×V\"><mrow><mi>d<\/mi><mo>×<\/mo><mi>V<\/mi><\/mrow><\/math><\/td><td>一次只准改一格；網路只要輸出 d×V 個數<\/td><\/tr><tr><td>分解式混合路徑<\/td><td>factorized mixture path<\/td><td><math aria-label=\"(1−κ_t)p_init+κ_t δ_z\"><mrow><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><msub><mi>p<\/mi><mi>init<\/mi><\/msub><mo>+<\/mo><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><msub><mi>δ<\/mi><mi>z<\/mi><\/msub><\/mrow><\/math><\/td><td>每格擲硬幣：κ_t 留下資料、1−κ_t 換成雜訊<\/td><\/tr><tr><td>交叉熵<\/td><td>cross-entropy<\/td><td><math aria-label=\"−log p^θ(z_j|x)\"><mrow><mo>−<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msup><mi>p<\/mi><mi>θ<\/mi><\/msup><mo stretchy=\"false\">(<\/mo><msub><mi>z<\/mi><mi>j<\/mi><\/msub><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>分類的損失；猜中正確字的機率越高越小<\/td><\/tr><tr><td>遮罩擴散語言模型<\/td><td>masked diffusion language model（MDLM）<\/td><td><math aria-label=\"[MASK]\"><mrow><mo stretchy=\"false\">[<\/mo><mi>MASK<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math><\/td><td>從全遮開始，一格一格解開；t=0 全遮<\/td><\/tr><\/tbody><\/table><\/div>\n<p>注意：原片字幕把矩陣的 column 譯為「行」（臺灣慣例），前導片說「欄」，是同一件事：固定出發點 x 的那一直排。scheduler 譯「排程」。<\/p>\n<h3>聽得出這三個詞<\/h3>\n<ul class=\"checks\"><li class=\"check\"><input type=\"checkbox\" id=\"chk-07-1\"><label for=\"chk-07-1\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=353s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"353\">05:53<\/a>：switch，換／跳；只能換，並規定換的速率<\/label><\/li><li class=\"check\"><input type=\"checkbox\" id=\"chk-07-2\"><label for=\"chk-07-2\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=2300s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"2300\">38:20<\/a>：fades in／fades out，淡入／淡出；<a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=2466s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"2466\">41:06<\/a> 又說一次（自動字幕誤成 facing）<\/label><\/li><li class=\"check\"><input type=\"checkbox\" id=\"chk-07-3\"><label for=\"chk-07-3\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=4151s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"4151\">69:11<\/a>：amortized，攤到每個位置一起做；同一個網路對每一格做分類<\/label><\/li><\/ul>\n<h3>原片導航<\/h3>\n<div class=\"table-wrap nav-table\"><table><thead><tr><th>時間<\/th><th>看什麼<\/th><\/tr><\/thead><tbody><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=11s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"11\">00:11<\/a><\/td><td>開講<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=118s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"118\">01:58<\/a><\/td><td>沒有 SDE、沒有 ODE<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=210s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"210\">03:30<\/a><\/td><td>詞彙表<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=293s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"293\">04:53<\/a><\/td><td>速率矩陣<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=434s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"434\">07:14<\/a><\/td><td>行還是列（慣例）<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=637s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"637\">10:37<\/a><\/td><td>兩個狀態的例子<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=790s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"790\">13:10<\/a><\/td><td>分解式<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=1291s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"1291\">21:31<\/a><\/td><td>抽樣<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=1470s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"1470\">24:30<\/a><\/td><td>Taylor 一小步<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=1998s\" target= 79:20<\/a><\/td><td>generator matching<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=4817s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"4817\">80:17<\/a><\/td><td>總結<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=2971s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"2971\">49:31<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=3307s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"3307\">55:07<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=955s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"955\">15:55<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=996s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"996\">16:36<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=1818s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"1818\">30:18<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=1875s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"1875\">31:15<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=1890s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"1890\">31:30<\/a>–<a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=1933s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"1933\">32:13<\/a><\/td><td>證明、重寫與問答，第一次可略過<\/td><\/tr><\/tbody><\/table><\/div>\n<p><a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=3669s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"3669\">61:09<\/a> 原片說這堂把三堂的份量壓成一堂；跟不上是正常的，回頭對照前導片的小節。<\/p>\n<h3>五個陷阱<\/h3>\n<ol><li><strong>Q_t(y|x) 是從 x 跳到 y<\/strong>（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=328s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"328\">05:28<\/a> 口頭說反）：以講義式 (86) 為準，一欄總和為 0。<\/li><li><strong>雜訊的機率是 1−κ_t<\/strong>（投影片 p.15 寫成 κ_t；<a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=3572s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"3572\">59:32<\/a> 口頭更正）。<\/li><li><strong>p.25 的 \"Marginal Vector Field\" 是筆誤<\/strong>（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=3617s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"3617\">60:17<\/a>），應為邊際速率矩陣。<\/li><li><strong>遮罩擴散的方向<\/strong>：本課 t=0 全遮、t=1 全解開；讀外部論文先查 t。<\/li><li><strong>這堂的 z 是資料<\/strong>：Lecture 04 資料寫 x，本堂回到 z＝資料、x＝目前序列。<\/li><\/ol>\n<p>另外兩個：均勻雜訊在 t=0 每格有 1/V 剛好對；<a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=648s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"648\">10:48<\/a> 兩狀態例子口頭只說單向，講義 Example 34 是雙向都是 λ。<\/p>\n<h3>練習：速率與一小步<\/h3>\n<ol><li>兩個狀態 a、b，互相以速率 2 跳。寫出 2×2 速率矩陣（欄＝出發點），並檢查每欄加起來是多少。<\/li><li>同一個例子，用一步 Euler、步長 h=0.1，從 a 出發：留在 a 和跳到 b 的機率各是多少？h=0.75 時呢？<\/li><li>詞彙表有 6 個字母、序列 3 格。所有可能的序列有幾種？分解式的網路要輸出幾個數？<\/li><\/ol>\n<details class=\"answers\"><summary>參考答案（先自己答，再打開）<\/summary>\n<ol><li>速率矩陣。它的一欄是「從同一個狀態出發，跳到每個狀態的速率」：非對角 ≥ 0，對角是負的離開速率總和，所以一欄加起來是 0。<\/li><li>每格各自獨立抽，格子之間的搭配丟掉，拼出來的常常不是字。前導片的簡化模型（8 個三字母字、精確後驗）一步只有 41.8% 是字，2 步 65.9%、16 步 95.2%、64 步 98.8%。<\/li><li>每個位置的分類：看著目前的序列 x，猜每一格最後是哪個字，用交叉熵訓練。flow matching 是迴歸，離散版變成分類。<\/li><\/ol>\n<p><strong>練習答案<\/strong>：1. 欄 a 是（−2, 2），欄 b 是（2, −2）；每欄和 0。2. h=0.1：留在 a 是 1−0.1×2＝0.8，跳到 b 是 0.2；h=0.75：留下 1−1.5＝−0.5，是負機率，步長太大（h×離開速率要 ≤ 1）。3. 6³＝216 種；網路輸出 3×6＝18 個數。<\/p>\n<p>片中兩狀態、三種資料、8 個字都是簡化模型；網路是查表分類器、不吃 t，不是 Transformer；步數實驗用精確後驗。練習 2 的 −0.5 與片中小節 3 的計算一致（check A4）；216 與 check E2 的「8/216 是字」一致。<\/p>\n<\/details>","duration":"11:26","thumb":"data/thumb_07.jpg","ws":{"intro":"<p><a href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\">打開原片<\/a>（本堂從 <a class=\"ts\" href=\"https://www.youtube.com/watch?v=d0kmyEJN2hI&amp;t=11s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L05\" data-t=\"11\">00:11<\/a> 開始）。建議用<a href=\"#L05\" data-lec=\"L05\">原片字幕頁<\/a>，可逐句重聽、調慢速度；公式以投影片與講義為準。<\/p>","pre":["字沒有方向。離散擴散用什麼代替向量場？它的一欄代表什麼？","遮罩擴散一口氣在一步內把全部 [MASK] 解開，會出什麼問題？","訓練離散擴散的網路，本質上是在做哪一種我們已經會的任務？"],"preNote":"<p>先寫下答案，不查資料。看完原片後再答同樣三題，比較自己的差異。<\/p>","words":[["詞元","token","—","一句話切成的一格一格"],["連續時間馬可夫鏈","continuous-time Markov chain（CTMC）","<math aria-label=\"X_t\"><mrow><msub><mi>X<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","時間連續地走、狀態用跳的；下一步只看現在"],["速率矩陣","rate matrix","<math aria-label=\"Q_t(y|x)\"><mrow><msub><mi>Q<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","從 x 跳到 y 有多快；一欄＝出發點，欄和為 0"],["轉移機率","transition probability","<math aria-label=\"p_{t+h|t}(y|x)\"><mrow><msub><mi>p<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mi>h<\/mi><mo stretchy=\"false\">|<\/mo><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","過了 h 時間從 x 到 y 的機率；一小步時約 h 乘速率"],["分解式","factorized","<math aria-label=\"d×V\"><mrow><mi>d<\/mi><mo>×<\/mo><mi>V<\/mi><\/mrow><\/math>","一次只准改一格；網路只要輸出 d×V 個數"],["分解式混合路徑","factorized mixture path","<math aria-label=\"(1−κ_t)p_init+κ_t δ_z\"><mrow><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><msub><mi>p<\/mi><mi>init<\/mi><\/msub><mo>+<\/mo><msub><mi>κ<\/mi><mi>t<\/mi><\/msub><msub><mi>δ<\/mi><mi>z<\/mi><\/msub><\/mrow><\/math>","每格擲硬幣：κ_t 留下資料、1−κ_t 換成雜訊"],["交叉熵","cross-entropy","<math aria-label=\"−log p^θ(z_j|x)\"><mrow><mo>−<\/mo><mi>log<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><msup><mi>p<\/mi><mi>θ<\/mi><\/msup><mo stretchy=\"false\">(<\/mo><msub><mi>z<\/mi><mi>j<\/mi><\/msub><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","分類的損失；猜中正確字的機率越高越小"],["遮罩擴散語言模型","mask
