<style>
/* 版面：頂部固定導覽列＋單欄內容；單元頁左側影片與小節時間軸、右側學習單；「黑板講堂」風格：MIT 教室綠黑板、粉筆字與楷體標題，刻意只做深色 */
:root {
  --bg: #1d2b27; --panel: #22332e; --raise: #2a3d37; --line: rgba(236, 233, 223, .22);
  --fg: #ece9df; --muted: #a9b3ab; --accent: #f3e27a; --accent-ink: #1d2b27;
  --gold: #f6b8a8; --data: #a6dcae; --noise: #d6d2c6; --warn: #f6b8a8;
  --font-display: "LXGW WenKai TC", "Kaiti TC", "STKaiti", var(--font-body);
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 4px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 16px/1.7 var(--font-body);
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
}
h1, h2, h3 { text-wrap: balance; line-height: 1.3; margin: 0; font-family: var(--font-display); }
code, .mono, time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
code { font-size: .88em; color: var(--gold); }
img { max-width: 100%; display: block; }

.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 導覽列 */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar .wrap { display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { color: var(--fg); text-decoration: none; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
.brand .mono { color: var(--accent); font-weight: 600; letter-spacing: .02em; }
.topnav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.topnav a {
  color: var(--muted); text-decoration: none; padding: 4px 10px; border-radius: 6px; font-size: 15px;
}
.topnav a:hover { color: var(--fg); background: var(--raise); }
.topnav a[aria-current="page"] { color: var(--fg); background: var(--raise); }

main { padding-block: 28px 64px; }
.kicker {
  font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted);
}
.btn {
  display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 15px;
  padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); color: var(--fg); text-decoration: none; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 500; }
.btn.small { font-size: 14px; padding: 4px 10px; }
.btn .ext { font-size: .85em; opacity: .75; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

.pill {
  display: inline-block; font-size: 12.5px; line-height: 1; padding: 5px 8px; border-radius: 999px;
  border: 1px solid currentColor; white-space: nowrap; font-weight: 500;
}
.pill.live { color: var(--data); }
.pill.soon { color: var(--gold); }
.pill.making { color: var(--accent); }
.pill.planned { color: var(--muted); }
.pill.done { color: var(--accent-ink); background: var(--data); border-color: var(--data); }
.pill.seen { color: var(--muted); border-style: dashed; }
kbd {
  font: 12px var(--font-mono); padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; color: var(--fg); white-space: nowrap;
}

/* 首頁 */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; align-items: center; }
.hero h1 { font-size: clamp(30px, 5vw, 46px); letter-spacing: -.01em; margin-top: 10px; }
.hero h1 .mono { color: var(--accent); }
.hero .lede { color: var(--muted); font-size: 17px; max-width: 34em; margin: 14px 0 22px; }
.flow { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
.flow canvas { width: 100%; height: 100%; display: block; }
.flow .label { position: absolute; left: 12px; top: 10px; font: 13px var(--font-mono); color: var(--muted); }
.flow .label b { color: var(--fg); font-weight: 600; }
.flow .eq { position: absolute; right: 12px; bottom: 10px; font: 13px var(--font-mono); color: var(--gold); }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin: 48px 0 16px; }
.section-head h2 { font-size: 22px; }
.section-head .note { color: var(--muted); font-size: 14.5px; }

.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.card {
  display: flex; flex-direction: column; text-decoration: none; color: var(--fg);
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card .thumb { aspect-ratio: 16 / 9; background: var(--raise); position: relative; }
.card .thumb img { width: 100%; height: 100%; object-fit: cover; }
.card .thumb.empty {
  display: grid; place-items: center; color: var(--muted); font-size: 14px;
  background: repeating-linear-gradient(135deg, var(--raise) 0 10px, var(--panel) 10px 20px);
  border-bottom: 1px dashed var(--line);
}
.card .thumb .dur {
  position: absolute; right: 8px; bottom: 8px; font: 12.5px var(--font-mono);
  background: rgba(0,0,0,.72); color: #fff; padding: 2px 6px; border-radius: 4px;
}
.card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 26px; }
.card .no { font: 600 13px var(--font-mono); color: var(--accent); letter-spacing: .04em; }
.card h3 { font-size: 19px; }
.card .topic { color: var(--muted); font-size: 14.5px; line-height: 1.55; }
.card .lec { margin-top: auto; padding-top: 6px; font: 12.5px var(--font-mono); color: var(--muted); }

.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; padding: 0; margin: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; border-top: 2px solid var(--line); padding-top: 12px; }
.steps li::before { content: "步驟 " counter(s); display: block; font: 600 13px var(--font-mono); color: var(--accent); margin-bottom: 4px; }
.steps b { display: block; font-size: 17px; }
.steps span { color: var(--muted); font-size: 15px; }

footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
footer .wrap { padding-block: 20px 32px; }
footer a { white-space: nowrap; }

/* 單元頁 */
.crumb { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
.crumb a { color: var(--muted); }
.unit-head h1 { font-size: clamp(28px, 4.4vw, 40px); margin: 6px 0 8px; }
.unit-head .q { font-size: 18px; max-width: 40em; margin: 0; }
.unit-head .q::before { content: "核心問題　"; color: var(--gold); font-weight: 700; }
.unit-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; margin-top: 26px; align-items: start; }
.watch { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); display: flex; flex-direction: column; gap: 14px; }
.video { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--radius); overflow: hidden; background: #000; }
.video iframe, .video > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video.poster img { width: 100%; height: 100%; object-fit: cover; }
.video.poster .play {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: rgba(0,0,0,.75); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 500;
  border: 1px solid rgba(255,255,255,.3); white-space: nowrap;
}
.video.poster:hover .play { background: var(--accent); color: var(--accent-ink); }
.video.placeholder {
  display: grid; place-items: center; text-align: center; color: var(--muted); background:
    repeating-linear-gradient(135deg, var(--raise) 0 12px, var(--panel) 12px 24px);
  border: 1px dashed var(--line);
}
.video.placeholder b { display: block; color: var(--fg); font-size: 18px; }
.video.placeholder img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .28; }
.video.placeholder > div { position: relative; padding: 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 14.5px; align-items: center; }

.timeline { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
.timeline li + li { border-top: 1px solid var(--line); }
.timeline .item {
  display: grid; grid-template-columns: 4.2em 4.6em minmax(0, 1fr); gap: 8px; align-items: baseline;
  width: 100%; padding: 9px 14px; text-align: left; font: inherit; font-size: 15px; color: var(--fg);
  background: none; border: 0; text-decoration: none;
}
.timeline a.item, .timeline button.item { cursor: pointer; }
.timeline a.item:hover, .timeline button.item:hover { background: var(--raise); }
.timeline .item.active { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.timeline time { color: var(--accent); font-size: 14px; }
.timeline .tag { color: var(--muted); font-size: 13.5px; white-space: nowrap; }
.timeline .empty { padding: 14px; color: var(--muted); font-size: 15px; }
.tl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tl-head h2 { font-size: 17px; }
.tl-head span { color: var(--muted); font-size: 13.5px; }

.sheet { min-width: 0; container: sheet / inline-size; }
.sheet > h2 { font-size: 22px; margin-bottom: 4px; }
.sheet h3 { font-size: 18px; margin: 30px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.sheet p, .sheet li { max-width: 40em; }
.sheet p { margin: 10px 0; }
.sheet ol, .sheet ul { padding-left: 1.4em; margin: 10px 0; }
.sheet li { margin: 4px 0; }
.sheet blockquote { margin: 12px 0; padding: 8px 14px; border-left: 3px solid var(--line); color: var(--muted); }
.sheet strong { color: var(--fg); }
.sheet a.ts { font-family: var(--font-mono); font-size: .92em; white-space: nowrap; }
.sheet ul.checks { list-style: none; padding-left: 0; }
.sheet li.check { display: flex; gap: 10px; align-items: baseline; }
.sheet li.check input { width: 17px; height: 17px; accent-color: var(--accent); flex: none; transform: translateY(2px); }
.sheet li.check input:checked + label { color: var(--muted); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; }
.table-wrap table { border-collapse: collapse; width: 100%; font-size: 15px; }
.table-wrap th, .table-wrap td { text-align: left; padding: 8px 12px; vertical-align: top; border-bottom: 1px solid var(--line); }
.table-wrap tr:last-child td { border-bottom: 0; }
.table-wrap th { background: var(--raise); font-weight: 500; white-space: nowrap; }
/* 八個詞：中文不斷行、符號用數學字型；原片導航：時間欄只佔需要的寬度 */
.vocab td:first-child { white-space: nowrap; font-weight: 500; }
.vocab td:nth-child(3) { color: var(--gold); }
.nav-table td:first-child { width: 1%; }
math { font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", math; font-size: 1.08em; }
details.answers { margin-top: 30px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 0 16px; }
details.answers summary { cursor: pointer; padding: 12px 0; font-weight: 700; color: var(--gold); }
details.answers[open] { padding-bottom: 12px; }
.sheet .pending { padding: 28px 20px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pager a { text-decoration: none; display: flex; flex-direction: column; color: var(--fg); max-width: 48%; }
.pager a span { font: 12.5px var(--font-mono); color: var(--muted); }
.pager a.next { text-align: right; margin-left: auto; }

/* 原片字幕頁 */
.lec-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 18px; }
.lec-tabs .btn { font-family: var(--font-mono); }
.lec-tabs .btn small { font-family: var(--font-body); font-size: 12.5px; color: var(--muted); }
.lec-tabs .btn[aria-current="page"] { border-color: var(--accent); color: var(--accent); font-weight: 500; }
.keys { color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.lec-head { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; margin-bottom: 18px; }
.lec-head h1 { font-size: clamp(24px, 3.6vw, 32px); }
.lec-head .meta { flex: 1; }
.lec-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(300px, 2fr); gap: 20px; align-items: start; }
.lec-grid.noembed { grid-template-columns: minmax(0, 1fr); max-width: 860px; }
.stage { display: flex; flex-direction: column; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); }
.now { min-height: 4.6em; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.now .zh { font-size: 19px; }
.now .en { color: var(--muted); font-size: 15px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.controls label { color: var(--muted); font-size: 14px; display: flex; gap: 6px; align-items: center; }
select, input[type="search"] {
  font: inherit; font-size: 15px; color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
}
input[type="search"] { width: 100%; }
.panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); min-width: 0; display: flex; flex-direction: column; }
.panel .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); }
.panel .bar .seg { display: flex; gap: 4px; }
.panel .bar input { flex: 1 1 180px; width: auto; }
.list { max-height: 68vh; overflow-y: auto; }
.lec-grid.noembed .list { max-height: none; }
.list .row {
  display: block; width: 100%; text-align: left; font: inherit; font-size: 15.5px; color: var(--fg);
  padding: 8px 12px; border: 0; border-bottom: 1px solid var(--line); background: none; text-decoration: none; cursor: pointer;
}
.list .row:hover { background: var(--raise); }
.list .row.active { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.list .row time { color: var(--accent); font-size: 13px; margin-right: 10px; }
.list .row .e { display: block; color: var(--muted); font-size: 14px; }
.list .msg { padding: 18px 14px; color: var(--muted); }
.hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }

/* 術語表 */
.g-head h1 { font-size: clamp(26px, 4vw, 36px); margin: 6px 0 6px; }
.g-tools { display: flex; flex-direction: column; gap: 10px; margin: 18px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .lbl { color: var(--muted); font-size: 14px; margin-right: 4px; }
.glossary td:first-child { font-family: var(--font-mono); font-size: 14.5px; color: var(--accent); white-space: nowrap; }
.glossary td:nth-child(2) { white-space: nowrap; font-weight: 500; }
.glossary td:nth-child(3) { font-family: inherit; color: var(--muted); font-size: 14.5px; min-width: 16em; }
.glossary td:nth-child(4) a { font-family: var(--font-mono); }
.layer { font-size: 13px; white-space: nowrap; }
.layer.anchor { color: var(--gold); }
.layer.listen { color: var(--accent); }
.layer.heard { color: var(--muted); }
.count { color: var(--muted); font-size: 14px; }

/* 八個詞：學習單欄窄於 640px（桌面雙欄與手機）就改成一詞一張卡：中文＋符號、英文、白話 */
@container sheet (max-width: 640px) {
  .vocab { overflow: visible; }
  .vocab thead { display: none; }
  .vocab table, .vocab tbody { display: block; }
  .vocab tr {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px;
    grid-template-areas: "zh sym" "en en" "plain plain";
    padding: 10px 12px; border-bottom: 1px solid var(--line);
  }
  .vocab tr:last-child { border-bottom: 0; }
  .vocab td { display: block; padding: 0; border: 0 !important; }
  .vocab td:nth-child(1) { grid-area: zh; }
  .vocab td:nth-child(2) { grid-area: en; color: var(--muted); font-size: 14.5px; }
  .vocab td:nth-child(3) { grid-area: sym; text-align: right; white-space: normal; }
  .vocab td:nth-child(4) { grid-area: plain; }
}
@media (max-width: 860px) {
  .hero, .unit-grid, .lec-grid { grid-template-columns: minmax(0, 1fr); }
  .watch, .stage { position: static; }
  .list { max-height: 60vh; }
  .hero .flow { max-width: 440px; }
}
@media (max-width: 620px) {
  .glossary { overflow: visible; }
  .glossary thead { display: none; }
  .glossary table, .glossary tbody { display: block; }
  .glossary tr {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px;
    grid-template-areas: "en unit" "zh layer" "note note";
    padding: 10px 12px; border-bottom: 1px solid var(--line);
  }
  .glossary tr:last-child { border-bottom: 0; }
  .glossary td { display: block; padding: 0; border: 0 !important; min-width: 0 !important; white-space: normal !important; }
  .glossary td:nth-child(1) { grid-area: en; }
  .glossary td:nth-child(2) { grid-area: zh; }
  .glossary td:nth-child(3) { grid-area: note; }
  .glossary td:nth-child(4) { grid-area: unit; text-align: right; }
  .glossary td:nth-child(5) { grid-area: layer; text-align: right; }
}
@media (max-width: 480px) {
  .timeline .item { grid-template-columns: 3.6em minmax(0, 1fr); }
  .timeline .tag { grid-column: 2; grid-row: 1; }
  .timeline .ttl { grid-column: 2; }
  .topnav { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  .card:hover { transform: none; }
}

/* 黑板講堂：板書色帶、粉筆線框、楷體標題 */
:root body {
  background:
    radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.05), transparent 60%),

/* ===== 學習功能（learn.js）：沿用黑板講堂的色彩與字體，只做深色 ===== */

/* 單元頁：狀態列、分頁、雙欄 */

}

}

.cmp { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }

/* 課程筆記 */

/* 背誦卡 */
.deck-bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 14px; }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opts.tf { flex-direction: row; }
.opt { text-align: left; font: inherit; color: var(--fg); background: rgba(0,0,0,.15); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }

.ans, .match select, #dIn, .report input, .report select, #vq, .vzh {

}

}

"_blank\" rel=\"noopener\" data-lec=\"L01\" data-t=\"391\">06:31<\/a><\/td><td>時間有限，從這裡開始<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=9eJQQVrUUoI&amp;t=1614s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L01\" data-t=\"1614\">26:54<\/a><\/td><td>這裡的 θ 是回拉強度，不是網路參數<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=9eJQQVrUUoI&amp;t=1849s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L01\" data-t=\"1849\">30:49<\/a><\/td><td>流模型的定義，本堂核心<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=9eJQQVrUUoI&amp;t=1941s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L01\" data-t=\"1941\">32:21<\/a><\/td><td>從這裡起 θ 是網路參數<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=9eJQQVrUUoI&amp;t=2370s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L01\" data-t=\"2370\">39:30<\/a><\/td><td>原片說覺得難可先專注流模型<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=9eJQQVrUUoI&amp;t=3129s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L01\" data-t=\"3129\">52:09<\/a><\/td><td>有人問為什麼是 √h，先自己答再聽<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=9eJQQVrUUoI&amp;t=3333s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L01\" data-t=\"3333\">55:33<\/a><\/td><td>dX_t 的寫法，第一次可跳到 <a class=\"ts\" href=\"https://www.youtube.com/watch?v=9eJQQVrUUoI&amp;t=3945s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L01\" data-t=\"3945\">65:45<\/a><\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=9eJQQVrUUoI&amp;t=4381s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L01\" data-t=\"4381\">73:01<\/a><\/td><td>「沒有真正差別」指的是抽樣步驟<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>與講義不同的地方<\/strong>：投影片的迴圈寫到 n−1，講義寫到 n。要走到 t=1 需要 n 步，以講義為準。<\/p>\n<h3>練習：動手走兩步<\/h3>\n<p>向量場 u = −θx，θ=0.25，起點 x=10，步長 h=1。用 Euler 法走兩步，寫出每一步的位置。接著算：n=100 時，抖動乘 1、乘 h、乘 √h，走到 t=1 的總變異數各是多少？<\/p>\n<details class=\"answers\"><summary>參考答案（先自己答，再打開）<\/summary>\n<ol><li>生成一張圖，就是從資料分布抽一個樣本。t=0 是抽得到的雜訊，t=1 是資料。這個方向和 DDPM 常見的寫法相反。<\/li><li>輸出向量場，也就是往哪走的箭頭，不是圖；圖是一步一步走出來的。ODE 沒有隨機項，隨機只發生在起點，所以同一起點兩次路線一樣。<\/li><li>獨立的隨機量相加，變異數也相加；乘上一個數，變異數乘它的平方。乘 √h 時每步變異數是 h，加 n 次剛好是 1，切成幾步結果都一樣。乘 h 時總變異數是 h，步數越多越接近 0，隨機性消失；乘 1 時總變異數是 n，會爆炸。<\/li><\/ol>\n<p><strong>練習答案<\/strong>：10 → 7.5 → 5.625。總變異數：乘 1 是 100，乘 h 是 0.01，乘 √h 是 1。<\/p>\n<p>片中粒子與 8 張圖都是簡化模型，只用來看機制，不代表真實影像模型的表現。<\/p>\n<\/details>","duration":"9:57","thumb":"data/thumb_01.jpg","ws":{"intro":"<p><a href=\"https://www.youtube.com/watch?v=9eJQQVrUUoI\" target=\"_blank\" rel=\"noopener\" data-lec=\"L01\">打開原片<\/a>。建議用<a href=\"#L01\" data-lec=\"L01\">原片字幕頁<\/a>，可逐句重聽、調慢速度；公式以投影片畫面為準。<\/p>","pre":["「生成一張圖」用機率怎麼說？t=0、t=1 各是什麼？","流模型的網路輸出什麼？同一個起點跑兩次，結果一樣嗎？","為什麼抖動要乘 √h？改乘 h 會怎樣？"],"preNote":"<p>先寫下答案，不查資料。看完原片後再答同樣三題，比較自己的差異。<\/p>","words":[["資料分布","data distribution","<math aria-label=\"p_data\"><mrow><msub><mi>p<\/mi><mi>data<\/mi><\/msub><\/mrow><\/math>","好圖常出現、爛圖幾乎不出現的那團分布"],["抽樣","sampling","<math aria-label=\"z ~ p_data\"><mrow><mi>z<\/mi><mo>~<\/mo><msub><mi>p<\/mi><mi>data<\/mi><\/msub><\/mrow><\/math>","從分布裡隨機拿一個"],["向量場","vector field","<math aria-label=\"u_t(x)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","給時間和位置，回答一根箭頭"],["常微分方程","ODE","<math aria-label=\"dX_t/dt = u_t(X_t)\"><mrow><mi>d<\/mi><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>d<\/mi><mi>t<\/mi><mo>=<\/mo><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","移動速度等於腳下的箭頭"],["流模型","flow model","<math aria-label=\"u_t^θ\"><mrow><msubsup><mi>u<\/mi><mi>t<\/mi><mi>θ<\/mi><\/msubsup><\/mrow><\/math>","用網路當向量場，照 ODE 從隨機起點走"],["布朗運動","Brownian motion","<math aria-label=\"W_t\"><mrow><msub><mi>W<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","沒有箭頭、只有亂走的路線"],["隨機微分方程","SDE","<math aria-label=\"dX_t = u_t dt + σ_t dW_t\"><mrow><mi>d<\ "keypoints":["一張圖是高維空間裡的一個點；好圖集中在資料分布濃的地方，所以「生成一張圖」就是從 <math aria-label=\"p_data\"><mrow><msub><mi>p<\/mi><mi>data<\/mi><\/msub><\/mrow><\/math> 抽樣。","我們只抽得到高斯雜訊，因此約定 <math aria-label=\"t=0\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math> 是雜訊、<math aria-label=\"t=1\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math> 是資料：起點 <math aria-label=\"X_0 ~ p_init\"><mrow><msub><mi>X<\/mi><mn>0<\/mn><\/msub><mo>~<\/mo><msub><mi>p<\/mi><mi>init<\/mi><\/msub><\/mrow><\/math>，目標是終點 <math aria-label=\"X_1 ~ p_data\"><mrow><msub><mi>X<\/mi><mn>1<\/mn><\/msub><mo>~<\/mo><msub><mi>p<\/mi><mi>data<\/mi><\/msub><\/mrow><\/math>。這個方向和許多 DDPM 文章相反。","流模型的神經網路只輸出向量場（往哪走的箭頭），不輸出圖；圖是用 Euler 法一步一步走出來的。ODE 沒有隨機，隨機只發生在起點。","擴散模型每一步再加一段抖動 <math aria-label=\"σ_t √h ε\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><msqrt><mi>h<\/mi><\/msqrt><mi>ε<\/mi><\/mrow><\/math>。乘 <math aria-label=\"√h\"><mrow><msqrt><mi>h<\/mi><\/msqrt><\/mrow><\/math> 是因為獨立雜訊的變異數會相加，這樣不管切成幾步，總變異數都一樣。","擴散係數 <math aria-label=\"σ_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 是人設定的，不是網路學的；<math aria-label=\"σ_t=0\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math> 時 SDE 退回 ODE，擴散模型也就退回流模型。","這堂只講怎麼抽樣（部署），假設向量場已經有了；怎麼訓練網路學會向量場，是下一堂 Lecture 02 的主題。"],"formulas":[{"id":"f1","title":"從雜訊出發，落在資料上","plain":"起點從抽得到的雜訊抽，終點要落在資料分布上；中間怎麼走，交給向量場","parts":[{"m":"<math aria-label=\"X_0\"><mrow><msub><mi>X<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math>","say":"時間 0 的起點"},{"m":"<math aria-label=\"~\"><mrow><mo>~<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"p_init\"><mrow><msub><mi>p<\/mi><mi>init<\/mi><\/msub><\/mrow><\/math>","say":"抽得到的初始分布，幾乎都是標準高斯"},{"m":"<math aria-label=\",\"><mrow><mo>,<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"X_1\"><mrow><msub><mi>X<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math>","say":"時間 1 的終點"},{"m":"<math aria-label=\"~\"><mrow><mo>~<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"p_data\"><mrow><msub><mi>p<\/mi><mi>data<\/ ><mo stretchy=\"false\">)<\/mo><mi>d<\/mi><mi>t<\/mi><mo>+<\/mo><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><mi>d<\/mi><msub><mi>W<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","parts":[{"m":"<math aria-label=\"X_{t+h}\"><mrow><msub><mi>X<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mi>h<\/mi><\/mrow><\/msub><\/mrow><\/math>","say":"下一刻的位置"},{"m":"<math aria-label=\"=\"><mrow><mo>=<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"X_t\"><mrow><msub><mi>X<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","say":"現在的位置"},{"m":"<math aria-label=\"+\"><mrow><mo>+<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"h u_t(X_t)\"><mrow><mi>h<\/mi><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"和流模型一樣：步長乘箭頭"},{"m":"<math aria-label=\"+\"><mrow><mo>+<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"σ_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","say":"擴散係數：抖多大，人設定"},{"m":"<math aria-label=\"√h\"><mrow><msqrt><mi>h<\/mi><\/msqrt><\/mrow><\/math>","say":"讓每步變異數是 <math aria-label=\"h\"><mrow><mi>h<\/mi><\/mrow><\/math>，切幾步總量都一樣"},{"m":"<math aria-label=\"ε\"><mrow><mi>ε<\/mi><\/mrow><\/math>","say":"這一步新抽的一顆標準高斯雜訊"}],"src":{"lec":"L01","t":3600,"video":405,"slide":"p.31","note":"p.12 式 (9)"}}]},"practice":[{"id":"p1","prompt":"向量場 <math aria-label=\"u=−θx\"><mrow><mi>u<\/mi><mo>=<\/mo><mo>−<\/mo><mi>θ<\/mi><mi>x<\/mi><\/mrow><\/math>，<math aria-label=\"θ=0.25\"><mrow><mi>θ<\/mi><mo>=<\/mo><mn>0.25<\/mn><\/mrow><\/math>，起點 <math aria-label=\"x=10\"><mrow><mi>x<\/mi><mo>=<\/mo><mn>10<\/mn><\/mrow><\/math>，步長 <math aria-label=\"h=1\"><mrow><mi>h<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math>。用 Euler 法走第一步，位置是多少？","answer":7.5,"tol":0.001,"calc":"10 + 1*(-0.25*10)","hint":"箭頭 <math aria-label=\"u=−0.25×10=−2.5\"><mrow><mi>u<\/mi><mo>=<\/mo><mo>−<\/mo><mn>0.25<\/mn><mo>×<\/mo><mn>10<\/mn><mo>=<\/mo><mo>−<\/mo><mn>2.5<\/mn><\/mrow><\/math>，新位置＝<math aria-label=\"10+1×(−2.5)\"><mrow><mn>10<\/mn><mo>+<\/mo><mn>1<\/mn><mo>×<\/mo><mo stretchy=\"false\">(<\/mo><mo>−<\/mo><mn>2.5<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>"},{"id":"p2","prompt":"接著走第二步，位置是多少？","answer":5.625,"tol":0.001,"calc":"7.5 + 1*(-0.25*7.5)","hint":"從 7.5 出發，箭頭是 <math aria-label=\"−0.25×7.5\"><mrow><mo>−<\/mo><mn>0.25<\/mn><mo>×<\/mo><mn>7.5<\/mn><\/mrow><\/math>"},{"id":"p3","prompt":"<math aria-label=\"n=100\"><mrow><mi>n<\/mi><mo>=<\/mo><mn>100<\/mn><\/mrow><\/math> 步、<math aria-label=\"h=1/100\"><mrow><mi>h<\/mi><mo>=<\/mo><mn>1<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><mn>100<\/mn><\/mrow><\/math>。每步抖動乘 1（直接加 <math aria-label=\"ε\"><mrow><mi>ε<\/mi><\/mrow><\/math>），走到 <math aria-label=\"t=1\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math> 的總變異數是多少？","answer":100,"tol":0.001,"calc":"100*1**2","hint":"每步變異數 1，獨立相加 100 次"},{"id":"p4","prompt":"改成每步乘 <math aria-label=\"h\"><mrow><mi>h<\/mi><\/mrow><\/math>（加 <math aria-label=\"h ε\"><mrow><mi>h<\/mi><mi>ε<\/mi><\/mrow><\/math>），總變異數是多少？","answer":0.01,"tol":0.0001,"calc":"100*(1/100)**2","hint":"乘一個數，變異數乘它的平方：每步 <math aria-label=\"h²\"><mrow><msup><mi>h<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，加 100 次"},{"id":"p5","prompt":"改成每步乘 <math aria-label=\"√h\"><mrow><msqrt><mi>h<\/mi><\/msqrt><\/mrow><\/math>（加 <math aria-label=\"√h ε\"><mrow><msqrt><mi>h<\/mi><\/msqrt><mi>ε<\/mi><\/mrow><\/math>），總變異數是多少？","answer":1,"tol":0.0001,"calc":"100*sqrt(1/100)**2","hint":"每步變異數是 <math aria-label=\"h\"><mrow><mi>h<\/mi><\/mrow><\/math>，加 <math aria-label=\"n\"><mrow><mi>n<\/mi><\/mrow><\/math> 次是 <math aria-label=\"n×h=1\"><mrow><mi>n<\/mi><mo>×<\/mo><mi>h<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math>"}],"quiz":[{"id":"q01","type":"choice","dim":"concept","level":1,"prompt":"用機率的語言說，「生成一張好圖」是在做哪件事？","choices":["從資料分布 <math aria-label=\"p_data\"><mrow><msub><mi>p<\/mi><mi>data<\/mi><\/msub><\/mrow><\/math> 抽一個樣本","找出 <math aria-label=\"p_data\"><mrow><msub><mi>p<\/mi><mi>data<\/mi><\/msub><\/mrow><\/math> 機率最高的那一點，每次都輸出它","從資料集裡挑一張最像的圖複製出來","把很多張雜訊圖平均起來"],"answer":0,"explain":"好壞被近似成「在資料分布下有多可能」，所以生成就是從 <math aria-label=\"p_data\"><mrow><msub><mi>p<\/mi><mi>data<\/mi><\/msub><\/mrow><\/math> 抽樣，每次抽到的都不同。只輸出最高點會失去多樣性；從資料集複製只是背答案。","src":{"lec":"L01","t":465,"video":50,"slide":"p.11","note":"p.5"}},{"id":"q02","type":"tf","dim":"concept","level":1,"prompt":"流模型裡，同一顆起點粒子跑兩次，因為神經網路帶有隨機性，兩次走到的終點會不同。","answer":false,"explain":"網路參數 <math aria-label=\"θ\"><mrow><mi>θ<\/mi><\/mrow><\/math> 訓練後就固定，ODE 本身也沒有隨機項。隨機只發生在起點 <math aria-label=\"X_0 ~ p_init\"><mrow><msub><mi>X<\/mi><mn>0<\/mn><\/msub><mo>~<\/mo><msub><mi>p<\/mi><mi>init<\/mi><\/msub><\/mrow><\/math>；起點一樣，路線就一模一樣。","src":{"lec":"L01","t":2006,"video":254,"note":"p.9"}},{"id":"q03","type":"choice","dim":"concept","level":2,"prompt":"流模型的神經網路 <math aria-label=\"u_t^θ\"><mrow><msubsup><mi>u<\/mi><mi>t<\/mi><mi>θ<\/mi><\/msubsup><\/mrow><\/math> 吃進位置 <math aria-label=\"x\"><mrow><mi>x<\/mi><\/mrow><\/math> 和時間 <math aria-label=\"t\"><mrow><mi>t<\/mi><\/mrow><\/math>，它輸出的是什麼？","choices":["一根箭頭：此刻在這個位置該往哪走、走多快","一張生成好的圖","整條軌跡的終點 <math aria-label=\"ψ_1(x)\"><mrow><msub><mi>ψ<\/mi><mn>1<\/mn><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>，直接告訴你走到哪","這一步要抖多大的 <math aria-label=\"σ_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>"],"answer":0,"explain":"網路只是帶參數的向量場，每次呼叫回答一根箭頭；圖是用這些箭頭一步一步走出來的。流 <math aria-label=\"ψ_t\"><mrow><msub><mi>ψ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 是走完的結果，<math aria-label=\"σ_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 是人設定的，都不是網路的輸出。","src":{"lec":"L01","t":2316,"video":254,"slide":"p.25","note":"p.9"}},{"id":"q04","type":"choice","dim":"concept","level":2,"prompt":"走很多小步要呼叫網路很多次。為什麼不直接訓練一個「雜訊進去、圖一步出來」的網路？原片的回答是：","choices":["一步到位是理想，但目前還沒有穩定又能放大的訓練方法","數學上已經證明一步到位的網路不可能存在","一步出來的圖一定只是資料集裡的原圖","因為擴散係數 <math aria-label=\"σ_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 必須大於 0，一步做不到"],"answer":0,"explain":"講者說理想上希望一步完成，但至今沒有 <code>stable and scalable<\/code> 的訓練法（GAN 是一步，但現在較少用）。改走很多小步，換來的是非常有效率的訓練，那是下一堂的主題。","src":{"lec":"L01","t":4548,"video":107}},{"id":"q05","type":"match","dim":"formula","level":1,"prompt":"把更新式 <math aria-label=\"X_{t+h} = X_t + h u_t(X_t) + σ_t √h ε\"><mrow><msub><mi>X<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mi>h<\/mi><\/mrow><\/msub><mo>=<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo>+<\/mo><mi>h<\/mi><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><msqrt><mi>h<\/mi><\/msqrt><mi>ε<\/mi><\/mrow><\/math> 裡的符號和白話配對。","pairs":[["<math aria-label=\"X_t\"><mrow><msub><mi>X<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","現在的位置"],["<math aria-label=\"h\"><mrow><mi>h<\/mi><\/mrow><\/math>","步長：每一步走多久"],["<math aria-label=\"u_t(X_t)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","腳下那根箭頭"],["<math aria-label=\"σ_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","抖動大小，人設定"],["<math aria-label=\"ε\"><mrow><mi>ε<\/mi><\/mrow><\/math>","一顆新抽的標準高斯雜訊"]],"explain":"前三項就是 Euler 法：現在位置加上步長乘箭頭。多出的 <math aria-label=\"σ_t √h ε\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><msqrt><mi>h<\/mi><\/msqrt><mi>ε<\/mi><\/mrow><\/math> 是抖動：抽一顆高斯 <math aria-label=\"ε\"><mrow><mi>ε<\/mi><\/mrow><\/math>，乘 <math aria-label=\"√h\"><mrow><msqrt><mi>h<\/mi><\/msqrt><\/mrow><\/math> 調尺度，再乘人設定的 <math aria-label=\"σ_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>。","src":{"lec":"L01","t":3944,"video":405,"slide":"p.31","note":"p.12 式 (9)"}},{"id":"q06","type":"choice","dim":"formula","level":2,"prompt":"抖動項 <math aria-label=\"σ_t √h ε\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><msqrt><mi>h<\/mi><\/msqrt><mi>ε<\/mi><\/mrow><\/math> 為什麼乘 <math aria-label=\"√h\"><mrow><msqrt><mi>h<\/mi><\/msqrt><\/mrow><\/math>，而不是乘 <math aria-label=\"h\"><mrow><mi>h<\/mi><\/mrow><\/math>？","choices":["每步變異數是 <math aria-label=\"σ_t² h\"><mrow><msubsup><mi>σ<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><mi>h<\/mi><\/mrow><\/math>，加總後只和總時間有關，切成幾步都一樣","乘 <math aria-label=\"h\"><mrow><mi>h<\/mi><\/mrow><\/math> 會讓步數越多抖得越兇，所以要換小一點的 <math aria-label=\"√h\"><mrow><msqrt><mi>h<\/mi><\/msqrt><\/mrow><\/math>","<math aria-label=\"√h\"><mrow><msqrt><mi>h<\/mi><\/msqrt><\/mrow><\/math> 是網路訓練出來的縮放權重","乘 <math aria-label=\"√h\"><mrow><msqrt><mi>h<\/mi><\/msqrt><\/mrow><\/math> 是為了讓步數越多、雜訊越快消失，終點才不會糊"],"answer":0,"explain":"獨立雜訊的變異數會相加，乘上一個數變異數乘它的平方。乘 <math aria-label=\"√h\"><mrow><msqrt><mi>h<\/mi><\/msqrt><\/mrow><\/math> 時每步變異數 <math aria-label=\"σ_t² h\"><mrow><msubsup><mi>σ<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><mi>h<\/mi><\/mrow><\/math>，<math aria-label=\"n\"><mrow><mi>n<\/mi><\/mrow><\/math> 步共 <math aria-label=\"σ_t²\"><mrow><msubsup><mi>σ<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><\/mrow><\/math>（<math aria-label=\"h=1/n\"><mrow><mi>h<\/mi><mo>=<\/mo><mn>1<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>n<\/mi><\/mrow><\/math>），和切幾步無關；乘 <math aria-label=\"h\"><mrow><mi>h<\/mi><\/mrow><\/math> 總變異數只剩 <math aria-label=\"h\"><mrow><mi>h<\/mi><\/mrow><\/math>，步數越多越趨近 0，隨機性消失。","src":{"lec":"L01","t":3135,"video":324,"note":"p.10 式 (5)"}},{"id":"q07","type":"fill","dim":"formula","level":2,"prompt":"SDE 的簡寫：<math aria-label=\"dX_t = u_t(X_t)dt + σ_t\"><mrow><mi>d<\/mi><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><mi>d<\/mi><mi>t<\/mi><mo>+<\/mo><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> ＿＿。空格是布朗運動在一小段時間的增量。","accept":["dW_t","dWt","dW","dW_{t}","d W_t"],"explain":"<math aria-label=\"dW_t\"><mrow><mi>d<\/mi><msub><mi>W<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 是布朗運動 <math aria-label=\"W_t\"><mrow><msub><mi>W<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 的微小增量，離散時就是 <math aria-label=\"√h ε\"><mrow><msqrt><mi>h<\/mi><\/msqrt><mi>ε<\/mi><\/mrow><\/math>。講義 p.11 說 <math aria-label=\"dX_t\"><mrow><mi>d<\/mi><msub><mi>X<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 這種寫法只是離散更新式的簡寫，不必先懂 <math aria-label=\"dW\"><mrow><mi>d<\/mi><mi>W<\/mi><\/mrow><\/math> 的嚴格定義。","src":{"lec":"L01","t":2705,"video":405,"slide":"p.30","note":"p.11 式 (7a)"}},{"id":"q08","type":"numeric","dim":"compute","level":2,"prompt":"向量場 <math aria-label=\"u=−θx\"><mrow><mi>u<\/mi><mo>=<\/mo><mo>−<\/mo><mi>θ<\/mi><mi>x<\/mi><\/mrow><\/math>，<math aria-label=\"θ=0.25\"><mrow><mi>θ<\/mi><mo>=<\/mo><mn>0.25<\/mn><\/mrow><\/math>，起點 <math aria-label=\"x=10\"><mrow><mi>x<\/mi><mo>=<\/mo><mn>10<\/mn><\/mrow><\/math>。時間軸拉到 20，只走 2 步（<math aria-label=\"h=10\"><mrow><mi>h<\/mi><mo>=<\/mo><mn>10<\/mn><\/mrow><\/math>），Euler 法的終點是多少？","answer":22.5,"tol":0.01,"calc":"10*(1-0.25*10)**2","explain":"每步 <math aria-label=\"x\"><mrow><mi>x<\/mi><\/mrow><\/math> 變成 <math aria-label=\"(1−θh)x\"><mrow><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>θ<\/mi><mi>h<\/mi><mo stretchy=\"false\">)<\/mo><mi>x<\/mi><\/mrow><\/math>，而 <math aria-label=\"1−0.25×10=−1.5\"><mrow><mn>1<\/mn><mo>−<\/mo><mn>0.25<\/mn><mo>×<\/mo><mn>10<\/mn><mo>=<\/mo><mo>−<\/mo><mn>1.5<\/mn><\/mrow><\/math>：第一步 <math aria-label=\"10\"><mrow><mn>10<\/mn><\/mrow><\/math> 到 <math aria-label=\"−15\"><mrow><mo>−<\/mo><mn>15<\/mn><\/mrow><\/math>，第二步 <math aria-label=\"−15\"><mrow><mo>−<\/mo><mn>15<\/mn><\/mrow><\/math> 到 <math aria-label=\"22.5\"><mrow><mn>22.5<\/mn><\/mrow><\/math>。正解 <math aria-label=\"10 exp(−5)≈0.067\"><mrow><mn>10<\/mn><mi>exp<\/mi><mo>&#x2061;<\/mo><mspace width=\"0.17em\"/><mo stretchy=\"false\">(<\/mo><mo>−<\/mo><mn>5<\/mn><mo stretchy=\"false\">)<\/mo><mi>≈<\/mi><mn>0.067<\/mn><\/mrow><\/math>；步長太大會衝過頭、越走越遠，這就是步長與計算量的取捨。","src":{"lec":"L01","t":1801,"video":200,"slide":"p.21","note":"p.9 式 (4)"}},{"id":"q09","type":"numeric","dim":"compute","level":2,"prompt":"同一個向量場 <math aria-label=\"u=−θx\"><mrow><mi>u<\/mi><mo>=<\/mo><mo>−<\/mo><mi>θ<\/mi><mi>x<\/mi><\/mrow><\/math>（<math aria-label=\"θ=0.25\"><mrow><mi>θ<\/mi><mo>=<\/mo><mn>0.25<\/mn><\/mrow><\/math>），擴散係數 <math aria-label=\"σ=0.5\"><mrow><mi>σ<\/mi><mo>=<\/mo><mn>0.5<\/mn><\/mrow><\/math>，步長 <math aria-label=\"h=0.04\"><mrow><mi>h<\/mi><mo>=<\/mo><mn>0.04<\/mn><\/mrow><\/math>。從 <math aria-label=\"x=10\"><mrow><mi>x<\/mi><mo>=<\/mo><mn>10<\/mn><\/mrow><\/math> 出發，這一步抽到 <math aria-label=\"ε=−1.2\"><mrow><mi>ε<\/mi><mo>=<\/mo><mo>−<\/mo><mn>1.2<\/mn><\/mrow><\/math>。Euler–Maruyama 走一步後位置是多少？","answer":9.78,"tol":0.001,"calc":"10 + 0.04*(-0.25*10) + 0.5*sqrt(0.04)*(-1.2)","explain":"箭頭項 <math aria-label=\"h u = 0.04×(−2.5) = −0.1\"><mrow><mi>h<\/mi><mi>u<\/mi><mo>=<\/mo><mn>0.04<\/mn><mo>×<\/mo><mo stretchy=\"false\">(<\/mo><mo>−<\/mo><mn>2.5<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mo>−<\/mo><mn>0.1<\/mn><\/mrow><\/math>；抖動項 <math aria-label=\"σ √h ε = 0.5×0.2×(−1.2) = −0.12\"><mrow><mi>σ<\/mi><msqrt><mi>h<\/mi><\/msqrt><mi>ε<\/mi><mo>=<\/mo><mn>0.5<\/mn><mo>×<\/mo><mn>0.2<\/mn><mo>×<\/mo><mo stretchy=\"false\">(<\/mo><mo>−<\/mo><mn>1.2<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mo>−<\/mo><mn>0.12<\/mn><\/mrow><\/math>；<math aria-label=\"10−0.1−0.12=9.78\"><mrow><mn>10<\/mn><mo>−<\/mo><mn>0.1<\/mn><mo>−<\/mo><mn>0.12<\/mn><mo>=<\/mo><mn>9.78<\/mn><\/mrow><\/math>。注意 <math aria-label=\"√h=0.2\"><mrow><msqrt><mi>h<\/mi><\/msqrt><mo>=<\/mo><mn>0.2<\/mn><\/mrow><\/math> 比 <math aria-label=\"h\"><mrow><mi>h<\/mi><\/mrow><\/math> 大得多，步長小時抖動反而比箭頭項顯眼。","src":{"lec":"L01","t":3944,"video":405,"slide":"p.31","note":"p.12 式 (9)"}},{"id":"q10","type":"numeric","dim":"compute","level":3,"prompt":"只有抖動、沒有箭頭（<math aria-label=\"u=0\"><mrow><mi>u<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math>），<math aria-label=\"σ=0.5\"><mrow><mi>σ<\/mi><mo>=<\/mo><mn>0.5<\/mn><\/mrow><\/math>，把時間 0 到 1 切成 <math aria-label=\"n=50\"><mrow><mi>n<\/mi><mo>=<\/mo><mn>50<\/mn><\/mrow><\/math> 步，每步加 <math aria-label=\"σ √h ε\"><mrow><mi>σ<\/mi><msqrt><mi>h<\/mi><\/msqrt><mi>ε<\/mi><\/mrow><\/math>。走到 <math aria-label=\"t=1\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math> 時位置的總變異數是多少？","answer":0.25,"tol":0.001,"calc":"50*(0.5*sqrt(1/50))**2","explain":"每步變異數 <math aria-label=\"σ² h = 0.25×(1/50)\"><mrow><msup><mi>σ<\/mi><mn>2<\/mn><\/msup><mi>h<\/mi><mo>=<\/mo><mn>0.25<\/mn><mo>×<\/mo><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><mn>50<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>，50 步獨立相加得 <math aria-label=\"0.25\"><mrow><mn>0.25<\/mn><\/mrow><\/math>，也就是 <math aria-label=\"σ²\"><mrow><msup><mi>σ<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 乘總時間 1。改成 500 步答案還是 0.25，這正是乘 <math aria-label=\"√h\"><mrow><msqrt><mi>h<\/mi><\/msqrt><\/mrow><\/math> 的用意。","src":{"lec":"L01","t":3142,"video":324,"note":"p.10 式 (5)"}},{"id":"q11","type":"order","dim":"compute","level":2,"prompt":"把擴散模型的抽樣步驟（講義 Algorithm 2）排成正確順序。","items":["設 <math aria-label=\"t=0\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math>、步長 <math aria-label=\"h=1/n\"><mrow><mi>h<\/mi><mo>=<\/mo><mn>1<\/mn><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>n<\/mi><\/mrow><\/math>","從 <math aria-label=\"p_init\"><mrow><msub><mi>p<\/mi><mi>init<\/mi><\/msub><\/mrow><\/math> 抽起點 <math aria-label=\"X_0\"><mrow><msub><mi>X<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math>","抽一顆新的高斯雜訊 <math aria-label=\"ε\"><mrow><mi>ε<\/mi><\/mrow><\/math>","更新 <math aria-label=\"X_{t+h} = X_t + h u_t^θ(X_t) + σ_t √h ε\"><mrow><msub><mi>X<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mi>h<\/mi><\/mrow><\/msub><mo>=<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo>+<\/mo><mi>h<\/mi><msubsup><mi>u<\/mi><mi>t<\/mi><mi>θ<\/mi><\/msubsup><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><msqrt><mi>h<\/mi><\/msqrt><mi>ε<\/mi><\/mrow><\/math>，再把時間加 <math aria-label=\"h\"><mrow><mi>h<\/mi><\/mrow><\/math>","重複 <math aria-label=\"n\"><mrow><mi>n<\/mi><\/mrow><\/math> 次後回傳 <math aria-label=\"X_1\"><mrow><msub><mi>X<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math>"],"explain":"起點只抽一次，之後每一步都重新抽一顆 <math aria-label=\"ε\"><mrow><mi>ε<\/mi><\/mrow><\/math> 再更新。要走到 <math aria-label=\"t=1\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math> 需要 <math aria-label=\"n\"><mrow><mi>n<\/mi><\/mrow><\/math> 步；投影片迴圈寫到 <math aria-label=\"n−1\"><mrow><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><\/mrow><\/math> 少一步，以講義為準。","src":{"lec":"L01","t":3944,"video":405,"slide":"p.33","note":"p.13 Algorithm 2"}},{"id":"q12","type":"match","dim":"term","level":1,"prompt":"把原片出現的英文術語和中文配對。","pairs":[["deterministic","確定性：起點相同終點就相同"],["step size","步長"],["initial distribution","初始分布"],["stochastic process","隨機過程"],["independent increments","獨立增量"]],"explain":"ODE 是 deterministic；<math aria-label=\"h\"><mrow><mi>h<\/mi><\/mrow><\/math> 是 step size；起點的 <math aria-label=\"p_init\"><mrow><msub><mi>p<\/mi><mi>init<\/mi><\/msub><\/mrow><\/math> 叫 initial distribution；布朗運動是一種 stochastic process，定義裡有一條是 independent increments：前一段怎麼走，不影響下一段。","src":{"lec":"L01","t":2941,"note":"p.7–10"}},{"id":"q13","type":"choice","dim":"term","level":2,"prompt":"線性向量場 <math aria-label=\"u_t(x) = −θx\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mo>−<\/mo><mi>θ<\/mi><mi>x<\/mi><\/mrow><\/math>（26:54）和 OU 過程 <math aria-label=\"dX_t = −θX_t dt + σ dW_t\"><mrow><mi>d<\/mi><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mo>−<\/mo><mi>θ<\/mi><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mi>d<\/mi><mi>t<\/mi><mo>+<\/mo><mi>σ<\/mi><mi>d<\/mi><msub><mi>W<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>（69:23）裡的 <math aria-label=\"θ\"><mrow><mi>θ<\/mi><\/mrow><\/math> 是什麼？","choices":["回拉強度：人設定的常數，越大拉回中心越快","神經網路的參數，要靠訓練學出來","擴散係數，控制抖動大小","步長，每一步走多久"],"answer":0,"explain":"這兩處的 <math aria-label=\"θ\"><mrow><mi>θ<\/mi><\/mrow><\/math> 是回拉強度，和 32:21 起代表網路參數的 <math aria-label=\"θ\"><mrow><mi>θ<\/mi><\/mrow><\/math> 是不同的東西。OU 過程裡控制抖動的是 <math aria-label=\"σ\"><mrow><mi>σ<\/mi><\/mrow><\/math>，步長是 <math aria-label=\"h\"><mrow><mi>h<\/mi><\/mrow><\/math>。自動字幕還會把 theta 誤聽成 feeder。","src":{"lec":"L01","t":1611,"slide":"p.20","note":"p.8 Example 4"}},{"id":"q14","type":"listen","dim":"listen","level":1,"prompt":"聽這段：講者說，到目前為止 ODE 是什麼性質？","clip":{"lec":"L01","t":1984,"dur":6},"choices":["deterministic","stochastic","discrete","Gaussian"],"answer":0,"explain":"原句：“Okay, so so far though, an ODE is deterministic, right?” deterministic＝確定性、沒有隨機。所以接下來要讓起點從初始分布隨機抽，才抽得出不同的樣本。","src":{"lec":"L01","t":1984,"video":254}},{"id":"q15","type":"listen","dim":"listen","level":2,"prompt":"學生問：「<math aria-label=\"θ\"><mrow><mi>θ<\/mi><\/mrow><\/math> 在這個演化過程中是固定的嗎？」聽講者怎麼回答。","clip":{"lec":"L01","t":2182,"dur":10},"choices":["Yes, theta is fixed post training.","No, theta is updated at every step.","Theta is sampled from a Gaussian.","Theta is the diffusion coefficient."],"answer":0,"explain":"原句：“So, theta is fixed, yes.” 接著重述問題後說 “Yes, theta is fixed post training.” 自動字幕把 theta 誤聽成 feeder。訓練時才改 <math aria-label=\"θ\"><mrow><mi>θ<\/mi><\/mrow><\/math>，抽樣（部署）時固定。","src":{"lec":"L01","t":2182,"video":254}},{"id":"q16","type":"listen","dim":"listen","level":3,"prompt":"講者解釋為什麼乘 <math aria-label=\"√h\"><mrow><msqrt><mi>h<\/mi><\/msqrt><\/mrow><\/math>：「相加」這個性質只對哪個量成立？","clip":{"lec":"L01","t":3167,"dur":7},"choices":["only holds for the variance, not for the standard deviation","only holds for the standard deviation, not for the variance","only holds for the mean, not for the variance","holds for every random variable"],"answer":0,"explain":"原句：“So, this additive property is something that only holds for the variance, not for the standard deviation.” 獨立隨機量的變異數相加、標準差不相加，所以要讓變異數隨時間線性成長，每步才乘 <math aria-label=\"√h\"><mrow><msqrt><mi>h<\/mi><\/msqrt><\/mrow><\/math>。","src":{"lec":"L01","t":3161,"video":324}},{"id":"q17","type":"choice","dim":"link","level":2,"prompt":"從流模型改成擴散模型，需要改動哪些東西？","choices":["多一個人設定的擴散係數 <math aria-label=\"σ_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>，每步多加抖動；網路仍只輸出向量場","網路要多輸出一個 <math aria-label=\"σ_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>，由訓練學出來","起點改成從資料集抽，不再從 <math aria-label=\"p_init\"><mrow><msub><mi>p<\/mi><mi>init<\/mi><\/msub><\/mrow><\/math> 抽","目標改了：終點不必再落在 <math aria-label=\"p_data\"><mrow><msub><mi>p<\/mi><mi>data<\/mi><\/msub><\/mrow><\/math> 上"],"answer":0,"explain":"對照單元 01 小節 8：擴散模型＝向量場 <math aria-label=\"u_t^θ\"><mrow><msubsup><mi>u<\/mi><mi>t<\/mi><mi>θ<\/mi><\/msubsup><\/mrow><\/math> 加上固定的 <math aria-label=\"σ_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>，起點 <math aria-label=\"X_0 ~ p_init\"><mrow><msub><mi>X<\/mi><mn>0<\/mn><\/msub><mo>~<\/mo><msub><mi>p<\/mi><mi>init<\/mi><\/msub><\/mrow><\/math> 與目標 <math aria-label=\"X_1 ~ p_data\"><mrow><msub><mi>X<\/mi><mn>1<\/mn><\/msub><mo>~<\/mo><msub><mi>p<\/mi><mi>data<\/mi><\/msub><\/mrow><\/math> 都和流模型相同；<math aria-label=\"σ_t=0\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math> 時就退回流模型。","src":{"lec":"L01","t":4261,"video":405,"slide":"p.33","note":"p.13"}},{"id":"q18","type":"choice","dim":"link","level":1,"prompt":"這一堂都假設向量場已經有了。下一堂 Lecture 02 要解決的問題是什麼？","choices":["怎麼訓練網路 <math aria-label=\"u_t^θ\"><mrow><msubsup><mi>u<\/mi><mi>t<\/mi><mi>θ<\/mi><\/msubsup><\/mrow><\/math>，讓走完的終點真的落在 <math aria-label=\"p_data\"><mrow><msub><mi>p<\/mi><mi>data<\/mi><\/msub><\/mrow><\/math> 上","怎麼把 Euler 法改得更精準","怎麼挑選擴散係數 <math aria-label=\"σ_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 的大小","怎麼加入文字提示做條件生成"],"answer":0,"explain":"對照單元 02：講者說下一堂完全在談怎麼達成「終點落在資料分布」這個目標，而且只談流模型與它的訓練（flow matching）。條件生成要到第 3 堂才處理。","src":{"lec":"L01","t":4470,"video":516,"slide":"p.6"}},{"id":"q19","type":"tf","dim":"link","level":3,"prompt":"流模型已經訓練好，想改用 SDE 抽樣：拿同一個向量場、每步直接加上 <math aria-label=\"σ_t √h ε\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><msqrt><mi>h<\/mi><\/msqrt><mi>ε<\/mi><\/mrow><\/math>，終點分布就不會變。","answer":false,"explain":"同一個向量場直接加雜訊，終點會糊掉，要配合雜訊調整向量場（講義 p.27 Theorem 17）。73:01 說「沒有真正差別」指的是抽樣步驟。對照單元 01 小節 8；怎麼調整在單元 03 解釋。","src":{"lec":"L01","t":4382,"video":405,"note":"p.27 Theorem 17"}},{"id":"q20","type":"choice","dim":"link","level":2,"prompt":"把 Euler 法換成 Euler–Maruyama 法，每一步實際多做了什麼？","choices":["多抽一顆高斯 <math aria-label=\"ε\"><mrow><mi>ε<\/mi><\/mrow><\/math>，加上 <math aria-label=\"σ_t √h ε\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><msqrt><mi>h<\/mi><\/msqrt><mi>ε<\/mi><\/mrow><\/math>；呼叫網路的次數不變","多呼叫一次網路，算出這一步的 <math aria-label=\"σ_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","步長從 <math aria-label=\"h\"><mrow><mi>h<\/mi><\/mrow><\/math> 改成 <math aria-label=\"√h\"><mrow><msqrt><mi>h<\/mi><\/msqrt><\/mrow><\/math>，走得比較快","每一步都把位置重設為一顆新的高斯樣本"],"answer":0,"explain":"對照單元 01：Euler–Maruyama＝Euler 更新再加一項抖動，講者說 “We have the same neural network calls as before.” <math aria-label=\"σ_t=0\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math> 時兩者完全相同，正如 SDE 在 <math aria-label=\"σ_t=0\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math> 時就是 ODE。","src":{"lec":"L01","t":4374,"slide":"p.31","note":"p.12 式 (9)"}}],"rubric":{"concept":["能說出一張圖是高維空間的一個點，生成就是從資料分布抽樣","能分清 <math aria-label=\"t=0\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math> 是雜訊、<math aria-label=\"t=1\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math> 是資料，並說出網路輸出箭頭不是圖","能解釋 ODE 同起點必同終點、隨機只在起點，SDE 則每步都抖","能說明為何不一步到位，並指出本堂只講抽樣、訓練留到下一堂"],"formula":["能指出更新式裡哪一項是現在位置、哪一項是步長乘箭頭","能逐項說出更新式中 <math aria-label=\"h\"><mrow><mi>h<\/mi><\/mrow><\/math>、<math aria-label=\"u\"><mrow><mi>u<\/mi><\/mrow><\/math>、<math aria-label=\"σ\"><mrow><mi>σ<\/mi><\/mrow><\/math>、<math aria-label=\"√h\"><mrow><msqrt><mi>h<\/mi><\/msqrt><\/mrow><\/math>、<math aria-label=\"ε\"><mrow><mi>ε<\/mi><\/mrow><\/math> 各自的角色","能把離散更新式對應到 <math aria-label=\"dX_t\"><mrow><mi>d<\/mi><msub><mi>X<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 簡寫，並說出 <math aria-label=\"σ=0\"><mrow><mi>σ<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><\ mn>1<\/mn><\/msub><mo>~<\/mo><msub><mi>p<\/mi><mi>data<\/mi><\/msub><\/mrow><\/math>","back":"<math aria-label=\"p_init\"><mrow><msub><mi>p<\/mi><mi>init<\/mi><\/msub><\/mrow><\/math>：抽得到的雜訊，幾乎都用標準高斯；<math aria-label=\"t=0\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math> 是雜訊、<math aria-label=\"t=1\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math> 是資料"},{"id":"c2","deck":"formula","front":"<math aria-label=\"X_{t+h} = X_t +\"><mrow><msub><mi>X<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mi>h<\/mi><\/mrow><\/msub><mo>=<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo>+<\/mo><\/mrow><\/math> ＿＿","back":"<math aria-label=\"h u_t(X_t)\"><mrow><mi>h<\/mi><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>：步長乘上腳下的箭頭（Euler 法）"},{"id":"c3","deck":"formula","front":"步伐縮到極小：<math aria-label=\"dX_t/dt =\"><mrow><mi>d<\/mi><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo lspace=\"0\" rspace=\"0\">/<\/mo><mi>d<\/mi><mi>t<\/mi><mo>=<\/mo><\/mrow><\/math> ＿＿","back":"<math aria-label=\"u_t(X_t)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>：速度等於當下的箭頭，這就是 ODE"},{"id":"c4","deck":"formula","front":"<math aria-label=\"X_{t+h} = X_t + h u_t(X_t) +\"><mrow><msub><mi>X<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mi>h<\/mi><\/mrow><\/msub><mo>=<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo>+<\/mo><mi>h<\/mi><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><\/mrow><\/math> ＿＿","back":"<math aria-label=\"σ_t √h ε\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><msqrt><mi>h<\/mi><\/msqrt><mi>ε<\/mi><\/mrow><\/math>：抽一顆高斯，乘 <math aria-label=\"√h\"><mrow><msqrt><mi>h<\/mi><\/msqrt><\/mrow><\/math> 再乘擴散係數（Euler–Maruyama）"},{"id":"c5","deck":"formula","front":"SDE 簡寫：<math aria-label=\"dX_t = u_t(X_t)dt +\"><mrow><mi>d<\/mi><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><mi>d<\/mi><mi>t<\/mi><mo>+<\/mo><\/mrow><\/math> ＿＿","back":"<math aria-label=\"σ_t dW_t\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><mi>d<\/mi><msub><mi>W<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>：<math aria-label=\"σ_t=0\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math> 時退回 ODE"},{"id":"c6","deck":"term","front":"Euler method","back":"尤拉法：每次沿箭頭走一小步；原片口頭沒說這個名字，看 p.21"},{"id":"c7","deck":"term","front":"Euler–Maruyama method","back":"尤拉法再加上 <math aria-label=\"σ_t √h ε\"><mrow><msub><mi>σ<\/mi><mi>t<\/mi><\/msub><msqrt><mi>h<\/mi><\/msqrt><mi>ε<\/mi><\/mrow><\/math> 的抖動；看 p.31、p.33"},{"id":"c8","deck":"term","front":"deterministic","back":"確定性：沒有隨機，起點相同終點就相同；ODE 就是這樣"},{"id":"c9","deck":"term","front":"Ornstein–Uhlenbeck (OU) process","back":"<math aria-label=\"dX_t = −θX_t dt + σ dW_t\"><mrow><mi>d<\/mi><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mo>−<\/mo><mi>θ<\/mi><msub><mi>X<\/mi><mi>t<\/mi><\/msub><mi>d<\/mi><mi>t<\/mi><mo>+<\/mo><mi>σ<\/mi><mi>d<\/mi><msub><mi>W<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>：一邊往中心拉、一邊抖；這裡的 <math aria-label=\"θ\"><mrow><mi>θ<\/mi><\/mrow><\/math> 是回拉強度，不是網路參數"}]},"answer":"<strong>一張圖就是空間裡的一個點，好圖是資料分布濃的地方。生成就是先隨手抽一顆雜訊粒子，再讓向量場一小步一小步把它搬到資料分布上。<\/strong> 走路只照向量場走是流模型；走路時再抖一下是擴散模型。","status":"live"},{"no":"02","title":"流匹配","lecture":"L02","youtube":"OQiaBzs-Eyg","topic":"機率路徑、向量場、flow matching","range":null,"question":"沒有人知道那個把雜訊推成資料的向量場，要怎麼訓練網路學會它？","timeline":[[0,"片頭"],[14,"小節 1｜向量場到底從哪裡來？"],[43,"小節 2｜如果目的地只有一筆資料，路好畫嗎？"],[127,"小節 3｜照這根箭頭走，會得到什麼？"],[155,"小節 4｜全部資料混在一起，中間長什麼樣？"],[192,"小節 5｜站在一個位置，該往哪走？"],[248,"小節 6｜這個平均，真的把機率搬對了嗎？"],[282,"小節 7｜算不動的東西，怎麼當訓練目標？"],[394,"小節 8｜損失降不到 0，是訓練失敗嗎？"],[474,"小節 9｜實際訓練要做幾件事？"],[529,"小節 10｜打開原片看哪裡，下一堂解決什麼？"]],"sheet":"<p><a href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\">打開原片<\/a>。建議用<a href=\"#L02\" data-lec=\"L02\">原片字幕頁<\/a>，可逐句重聽、調慢速度；公式以投影片畫面為準。<\/p>\n<h3>看前導片之前：先答一次<\/h3>\n<p>先寫下答案，不查資料。看完原片後再答同樣三題，比較自己的差異。<\/p>\n<ol><li>只照條件向量場走，粒子最後到哪？為什麼還要邊際向量場？<\/li><li>直線時，回歸目標是什麼？為什麼不直接對邊際向量場回歸？<\/li><li>條件損失停在大於 0 的值，是失敗嗎？它和邊際損失是什麼關係？<\/li><\/ol>\n<h3>今天的八個詞<\/h3>\n<div class=\"table-wrap vocab\"><table><thead><tr><th>中文<\/th><th>英文<\/th><th>符號<\/th><th>白話<\/th><\/tr><\/thead><tbody><tr><td>條件<\/td><td>conditional<\/td><td><math aria-label=\"p_t(x|z)\"><mrow><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>、<math aria-label=\"u_t(x|z)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>只看一筆資料<\/td><\/tr><tr><td>邊際<\/td><td>marginal<\/td><td><math aria-label=\"p_t(x)\"><mrow><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>、<math aria-label=\"u_t(x)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>全部資料混在一起，忘掉是哪一筆<\/td><\/tr><tr><td>機率路徑<\/td><td>probability path<\/td><td><math aria-label=\"p_t\"><mrow><msub><mi>p<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math><\/td><td>從雜訊到資料，每個時間的分布<\/td><\/tr><tr><td>高斯機率路徑<\/td><td>Gaussian probability path<\/td><td><math aria-label=\"N(α_t z, β_t² I)\"><mrow><mi>N<\/mi><mo stretchy=\"false\">(<\/mo><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><mo>,<\/mo><msubsup><mi>β<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><mi>I<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>每個時間都是鐘形，中心移向 z，寬度縮到 0<\/td><\/tr><tr><td>條件向量場<\/td><td>conditional vector field<\/td><td><math aria-label=\"u_t(x|z)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>往某一筆資料走的箭頭，直線時就是 z − ε<\/td><\/tr><tr><td>邊際向量場<\/td><td>marginal vector field<\/td><td><math aria-label=\"u_t(x)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>各筆箭頭按份量的加權平均<\/td><\/tr><tr><td>流匹配損失<\/td><td>flow matching loss<\/td><td><math aria-label=\"L_FM(θ)\"><mrow><msub><mi>L<\/mi><mi>FM<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>θ<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>網路和真正要的箭頭差多少，算不動<\/td><\/tr><tr><td>條件流匹配損失<\/td><td>conditional flow matching loss<\/td><td><math aria-label=\"L_CFM(θ)\"><mrow><msub><mi>L<\/mi><mi>CFM<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>θ<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/td><td>網路和一條路的箭頭差多少，算得動<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>聽得出這三個詞<\/h3>\n<ul class=\"checks\"><li class=\"check\"><input type=\"checkbox\" id=\"chk-02-1\"><label for=\"chk-02-1\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=3294s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"3294\">54:54<\/a>：tractable，算得動；not tractable 就是算不動<\/label><\/li><li class=\"check\"><input type=\"checkbox\" id=\"chk-02-2\"><label for=\"chk-02-2\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=3380s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"3380\">56:20<\/a>：regress against，把某個量當答案去逼近<\/label><\/li><li class=\"check\"><input type=\"checkbox\" id=\"chk-02-3\"><label for=\"chk-02-3\"><a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=3729s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"3729\">62:09<\/a>：minimizer，讓損失最小的那組參數，不是最小值本身<\/label><\/li><\/ul>\n<h3>原片導航<\/h3>\n<div class=\"table-wrap nav-table\"><table><thead><tr><th>時間<\/th><th>看什麼<\/th><\/tr><\/thead><tbody><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=169s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"169\">02:49<\/a><\/td><td>那張表，全堂都在填它<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=3055s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"3055\">50:55<\/a><\/td><td>時間有限，從這裡開始<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=3553s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"3553\">59:13<\/a><\/td><td>差一個常數，本堂高潮<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=4300s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"4300\">71:40<\/a><\/td><td>免模擬（simulation-free）：訓練全程不跑 ODE<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=4574s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"4574\">76:14<\/a><\/td><td>直線排程，最值得看<\/td><\/tr><tr><td><a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=2086s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"2086\">34:46<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=3923s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"3923\">65:23<\/a><\/td><td>證明不必會，可先跳<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>三個陷阱<\/h3>\n<ol><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=2180s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"2180\">36:20<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=2209s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"2209\">36:49<\/a> 與投影片 p.20 把連續方程式的符號說反了。依講義：增加＝流入－流出。<\/li><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=3814s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"3814\">63:34<\/a> 說最小值相同是口誤。最小值不同，minimizer 相同（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=3729s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"3729\">62:09<\/a>）。<\/li><li>兩個損失不相等。L_FM = L_CFM + C 這條式子投影片沒有，寫在黑板和講義第 20 頁。<\/li><\/ol>\n<h3>練習：算一根箭頭<\/h3>\n<p>一維的直線路徑，z=3，ε=−1，t=0.5。算出位置 x，再用 z − ε 和 (z − x)/(1 − t) 各算一次箭頭，確認兩者相同。<\/p>\n<details class=\"answers\"><summary>參考答案（先自己答，再打開）<\/summary>\n<ol><li>全部收到同一筆資料 z，只是重現手上那一筆。我們要的是走向全部資料的路，所以需要邊際向量場。<\/li><li>目標是 z − ε。邊際向量場每算一根箭頭都要掃過全部資料，算不動。訓練時回歸條件箭頭就夠了，網路平均後學到的就是邊際向量場。<\/li><li>不是失敗。同一個位置有好幾個答案，不可能全對，所以損失有底；片中簡化模型的底約 3.35，這個數字只屬於這個模型。兩者關係是 L_FM = L_CFM + C，C 與 θ 無關，所以平均來說下坡方向相同；它們不相等，單一批次的方向也不一定相同。<\/li><\/ol>\n<p><strong>練習答案<\/strong>：x = 0.5×3 + 0.5×(−1) = 1。z − ε = 4；(3 − 1)/(1 − 0.5) = 4。<\/p>\n<p>片中粒子與 8 張圖都是簡化模型，只用來看機制，不代表真實影像模型的表現。<\/p>\n<\/details>","duration":"10:19","thumb":"data/thumb_02.jpg","ws":{"intro":"<p><a href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\">打開原片<\/a>。建議用<a href=\"#L02\" data-lec=\"L02\">原片字幕頁<\/a>，可逐句重聽、調慢速度；公式以投影片畫面為準。<\/p>","pre":["只照條件向量場走，粒子最後到哪？為什麼還要邊際向量場？","直線時，回歸目標是什麼？為什麼不直接對邊際向量場回歸？","條件損失停在大於 0 的值，是失敗嗎？它和邊際損失是什麼關係？"],"preNote":"<p>先寫下答案，不查資料。看完原片後再答同樣三題，比較自己的差異。<\/p>","words":[["條件","conditional","<math aria-label=\"p_t(x|z)\"><mrow><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>、<math aria-label=\"u_t(x|z)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","只看一筆資料"],["邊際","marginal","<math aria-label=\"p_t(x)\"><mrow><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>、<math aria-label=\"u_t(x)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","全部資料混在一起，忘掉是哪一筆"],["機率路徑","probability path","<math aria-label=\"p_t\"><mrow><msub><mi>p<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>","從雜訊到資料，每個時間的分布"],["高斯機率路徑","Gaussian probability path","<math aria-label=\"N(α_t z, β_t² I)\"><mrow><mi>N<\/mi><mo stretchy=\"false\">(<\/mo><msub><mi>α<\/mi><mi>t<\/mi><\/msub><mi>z<\/mi><mo>,<\/mo><msubsup><mi>β<\/mi><mi>t<\/mi><mn>2<\/mn><\/msubsup><mi>I<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","每個時間都是鐘形，中心移向 z，寬度縮到 0"],["條件向量場","conditional vector field","<math aria-label=\"u_t(x|z)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","往某一筆資料走的箭頭，直線時就是 z − ε"],["邊際向量場","marginal vector field","<math aria-label=\"u_t(x)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","各筆箭頭按份量的加權平均"],["流匹配損失","flow matching loss","<math aria-label=\"L_FM(θ)\"><mrow><msub><mi>L<\/mi><mi>FM<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>θ<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","網路和真正要的箭頭差多少，算不動"],["條件流匹配損失","conditional flow matching loss","<math aria-label=\"L_CFM(θ)\"><mrow><msub><mi>L<\/mi><mi>CFM<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>θ<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","網路和一條路的箭頭差多少，算得動"]],"listen":[{"t":3294,"lec":"L02","word":"tractable","gloss":"算得動；not tractable 就是算不動"},{"t":3380,"lec":"L02","word":"regress against","gloss":"把某個量當答案去逼近"},{"t":3729,"lec":"L02","word":"minimizer","gloss":"讓損失最小的那組參數，不是最小值本身"}],"nav":[{"t":169,"lec":"L02","text":"那張表，全堂都在填它","plain":"那張表，全堂都在填它"},{"t":3055,"lec":"L02","text":"時間有限，從這裡開始","plain":"時間有限，從這裡開始"},{"t":3553,"lec":"L02","text":"差一個常數，本堂高潮","plain":"差一個常數，本堂高潮"},{"t":4300,"lec":"L02","text":"免模擬（simulation-free）：訓練全程不跑 ODE","plain":"免模擬（simulation-free）：訓練全程不跑 ODE"},{"t":4574,"lec":"L02","text":"直線排程，最值得看","plain":"直線排程，最值得看"},{"t":2086,"lec":"L02","text":"證明不必會，可先跳","plain":"證明不必會，可先跳"}],"navNote":"<h3>三個陷阱<\/h3>\n<ol><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=2180s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"2180\">36:20<\/a>、<a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=2209s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"2209\">36:49<\/a> 與投影片 p.20 把連續方程式的符號說反了。依講義：增加＝流入－流出。<\/li><li><a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=3814s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"3814\">63:34<\/a> 說最小值相同是口誤。最小值不同，minimizer 相同（<a class=\"ts\" href=\"https://www.youtube.com/watch?v=PNkMKWW8Khw&amp;t=3729s\" target=\"_blank\" rel=\"noopener\" data-lec=\"L02\" data-t=\"3729\">62:09<\/a>）。<\/li><li>兩個損失不相等。L_FM = L_CFM + C 這條式子投影片沒有，寫在黑板和講義第 20 頁。<\/li><\/ol>","practice":{"title":"練習：算一根箭頭","html":"<p>一維的直線路徑，z=3，ε=−1，t=0.5。算出位置 x，再用 z − ε 和 (z − x)/(1 − t) 各算一次箭頭，確認兩者相同。<\/p>"},"answers":["全部收到同一筆資料 z，只是重現手上那一筆。我們要的是走向全部資料的路，所以需要邊際向量場。","目標是 z − ε。邊際向量場每算一根箭頭都要掃過全部資料，算不動。訓練時回歸條件箭頭就夠了，網路平均後學到的就是邊際向量場。","不是失敗。同一個位置有好幾個答案，不可能全對，所以損失有底；片中簡化模型的底約 3.35，這個數字只屬於這個模型。兩者關係是 L_FM = L_CFM + C，C 與 θ 無關，所以平均來說下坡方向相同；它們不相等，單一批次的方向也不一定相同。"],"answerExtra":"<p><strong>練習答案<\/strong>：x = 0.5×3 + 0.5×(−1) = 1。z − ε = 4；(3 − 1)/(1 − 0.5) = 4。<\/p>\n<p>片中粒子與 8 張圖都是簡化模型，只用來看機制，不代表真實影像模型的表現。<\/p>","extra":[]},"learn":{"unit":"02","notes":{"keypoints":["一筆資料一條路：把資料 <math aria-label=\"z\"><mrow><mi>z<\/mi><\/mrow><\/math> 固定住，從雜訊 <math aria-label=\"ε\"><mrow><mi>ε<\/mi><\/mrow><\/math> 拉一條直線到 <math aria-label=\"z\"><mrow><mi>z<\/mi><\/mrow><\/math>，條件箭頭就是終點減起點 <math aria-label=\"z − ε\"><mrow><mi>z<\/mi><mo>−<\/mo><mi>ε<\/mi><\/mrow><\/math>，很好算。","只照條件向量場走，所有粒子都收到同一筆 <math aria-label=\"z\"><mrow><mi>z<\/mi><\/mrow><\/math>，只是重現手上的資料；我們要的是走向全部資料的邊際向量場。","邊際向量場是各筆條件箭頭按後驗 <math aria-label=\"p_t(z|x)\"><mrow><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 加權的平均；每算一根都要掃過全部資料，真實資料算不動（not tractable）。","訓練改成對條件箭頭回歸（<math aria-label=\"L_CFM\"><mrow><msub><mi>L<\/mi><mi>CFM<\/mi><\/msub><\/mrow><\/math>）：同一個位置收到好幾種答案，網路只能給一根箭頭，自然停在加權平均，也就是邊際向量場。","<math aria-label=\"L_FM = L_CFM + C\"><mrow><msub><mi>L<\/mi><mi>FM<\/mi><\/msub><mo>=<\/mo><msub><mi>L<\/mi><mi>CFM<\/mi><\/msub><mo>+<\/mo><mi>C<\/mi><\/mrow><\/math>，<math aria-label=\"C\"><mrow><mi>C<\/mi><\/mrow><\/math> 與 <math aria-label=\"θ\"><mrow><mi>θ<\/mi><\/mrow><\/math> 無關：梯度（平均來說）與 minimizer 相同，最小值不同，所以條件損失停在大於 0 的底不是失敗。","訓練全程不跑 ODE（simulation-free），每步只呼叫一次網路；代價留到生成，要照單元 01 的方式走很多步。"],"formulas":[{"id":"f1","title":"一條直線的箭頭","plain":"站在線上 <math aria-label=\"x = t z + (1−t) ε\"><mrow><mi>x<\/mi><mo>=<\/mo><mi>t<\/mi><mi>z<\/mi><mo>+<\/mo><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mi>ε<\/mi><\/mrow><\/math>，箭頭是終點減起點，也是剩下的距離除以剩下的時間","parts":[{"m":"<math aria-label=\"u_t(x|z)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">|<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"要去資料 z 時，在位置 x 的條件箭頭"},{"m":"<math aria-label=\"=\"><mrow><mo>=<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"z − ε\"><mrow><mi>z<\/mi><mo>−<\/mo><mi>ε<\/mi><\/mrow><\/math>","say":"終點減起點，整條線上都一樣長"},{"m":"<math aria-label=\"=\"><mrow><mo>=<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"(z − x)\"><mrow><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo>−<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"從現在位置到終點還剩的距離"},{"m":"<math aria-label=\"/\"><mrow><mo lspace=\"0\" rspace=\"0\">/<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"(1 − t)\"><mrow><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"還剩的時間；t＝1 時分母為 0，所以實作用 z − ε"}],"src":{"lec":"L02","t":4572,"video":110,"slide":"p.26","note":"p.17 式 (20)、p.22 Example 13"}},{"id":"f2","titl >t<\/mi><mi>θ<\/mi><\/msubsup><mo stretchy=\"false\">(<\/mo><mi>t<\/mi><mi>z<\/mi><mo>+<\/mo><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mi>ε<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"網路在直線上那一點輸出的箭頭"},{"m":"<math aria-label=\"−\"><mrow><mo>−<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"(z − ε)‖²\"><mrow><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo>−<\/mo><mi>ε<\/mi><mo stretchy=\"false\">)<\/mo><msup><mo stretchy=\"false\">‖<\/mo><mn>2<\/mn><\/msup><\/mrow><\/math>","say":"減去好算的條件箭頭，取長度平方"}],"src":{"lec":"L02","t":4632,"video":368,"slide":"p.26","note":"p.20 式 (26)、p.22"}},{"id":"f4","title":"只差一個常數","plain":"算不動的損失＝算得動的損失＋一個和網路無關的常數，所以下坡方向相同","parts":[{"m":"<math aria-label=\"L_FM(θ)\"><mrow><msub><mi>L<\/mi><mi>FM<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>θ<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"流匹配損失：網路和邊際向量場的差，算不動"},{"m":"<math aria-label=\"=\"><mrow><mo>=<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"L_CFM(θ)\"><mrow><msub><mi>L<\/mi><mi>CFM<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>θ<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>","say":"條件流匹配損失：網路和條件箭頭的差，算得動"},{"m":"<math aria-label=\"+\"><mrow><mo>+<\/mo><\/mrow><\/math>","say":""},{"m":"<math aria-label=\"C\"><mrow><mi>C<\/mi><\/mrow><\/math>","say":"與 θ 無關的常數；是負的，條件損失比較高"}],"src":{"lec":"L02","t":3557,"video":445,"note":"p.20 Theorem 12"}}]},"practice":[{"id":"p1","prompt":"一維直線路徑，<math aria-label=\"z=3\"><mrow><mi>z<\/mi><mo>=<\/mo><mn>3<\/mn><\/mrow><\/math>、<math aria-label=\"ε=−1\"><mrow><mi>ε<\/mi><mo>=<\/mo><mo>−<\/mo><mn>1<\/mn><\/mrow><\/math>、<math aria-label=\"t=0.5\"><mrow><mi>t<\/mi><mo>=<\/mo><mn>0.5<\/mn><\/mrow><\/math>，位置 <math aria-label=\"x\"><mrow><mi>x<\/mi><\/mrow><\/math> 是多少？","answer":1,"tol":0.001,"calc":"0.5*3 + (1 - 0.5)*(-1)","hint":"<math aria-label=\"x = t z + (1−t) ε\"><mrow><mi>x<\/mi><mo>=<\/mo><mi>t<\/mi><mi>z<\/mi><mo>+<\/mo><mo stretchy=\"false "><mrow><mi>z<\/mi><mo>−<\/mo><mi>ε<\/mi><mo>=<\/mo><mn>2<\/mn><mo>−<\/mo><mn>0.5<\/mn><mo>=<\/mo><mn>1.5<\/mn><\/mrow><\/math> 相同。兩種寫法是同一根箭頭，直線上速度固定。","src":{"lec":"L02","t":4572,"video":110}},{"id":"q11","type":"numeric","dim":"compute","level":3,"prompt":"一維情形，站在某個 <math aria-label=\"x\"><mrow><mi>x<\/mi><\/mrow><\/math>。三筆資料的條件箭頭分別是 <math aria-label=\"+3\"><mrow><mo>+<\/mo><mn>3<\/mn><\/mrow><\/math>、<math aria-label=\"−1\"><mrow><mo>−<\/mo><mn>1<\/mn><\/mrow><\/math>、<math aria-label=\"−2\"><mrow><mo>−<\/mo><mn>2<\/mn><\/mrow><\/math>，後驗權重依序是 0.5、0.3、0.2。這裡的邊際向量場 <math aria-label=\"u_t(x)\"><mrow><msub><mi>u<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math> 是多少？","answer":0.8,"tol":0.001,"calc":"0.5*3 + 0.3*(-1) + 0.2*(-2)","explain":"加權平均：<math aria-label=\"0.5×3 + 0.3×(−1) + 0.2×(−2) = 1.5 − 0.3 − 0.4 = 0.8\"><mrow><mn>0.5<\/mn><mo>×<\/mo><mn>3<\/mn><mo>+<\/mo><mn>0.3<\/mn><mo>×<\/mo><mo stretchy=\"false\">(<\/mo><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mn>0.2<\/mn><mo>×<\/mo><mo stretchy=\"false\">(<\/mo><mo>−<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>1.5<\/mn><mo>−<\/mo><mn>0.3<\/mn><mo>−<\/mo><mn>0.4<\/mn><mo>=<\/mo><mn>0.8<\/mn><\/mrow><\/math>。權重是後驗，加起來為 1；換一個位置，權重就會變。","src":{"lec":"L02","t":1839,"video":211}},{"id":"q12","type":"numeric","dim":"compute","level":3,"prompt":"一維情形，某個位置 <math aria-label=\"x\"><mrow><mi>x<\/mi><\/mrow><\/math> 收到兩種條件答案 <math aria-label=\"+2\"><mrow><mo>+<\/mo><mn>2<\/mn><\/mrow><\/math> 與 <math aria-label=\"−2\"><mrow><mo>−<\/mo><mn>2<\/mn><\/mrow><\/math>，各占一半機率。網路在這點只能輸出一個數 <math aria-label=\"u\"><mrow><mi>u<\/mi><\/mrow><\/math>，條件損失是 <math aria-label=\"0.5(u−2)² + 0.5(u+2)²\"><mrow><mn>0.5<\/mn><mo stretchy=\"false\">(<\/mo><mi>u<\/mi><mo>−<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><mn>0.5<\/mn><mo stretchy=\"false\">(<\/mo><mi>u<\/mi><mo>+<\/mo><mn>2<\/mn><msup><mo stretchy=\"f
